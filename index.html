<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070B12">
<meta name="color-scheme" content="dark">
<title>ATLAS Prime — Decision Operating System</title>
<style>
/* ════════════════════════════════════════════════════════════════════
   ATLAS PRIME · DESIGN TOKENS — single source of visual truth
   Dark-committed institutional terminal. Mono-led type system.
   Semantic status colors are NOT the accent; accent spent on LIVE gold
   and info blue only where meaning demands it.
   ════════════════════════════════════════════════════════════════════ */
:root{
  /* grounds — navy-biased slate, never black-on-black */
  --bg0:#070B12; --bg1:#0C1220; --bg2:#121A2B; --bg3:#1A2438; --bg4:#233049;
  --line:rgba(151,166,192,.11); --line2:rgba(151,166,192,.24);
  /* ink */
  --ink0:#E9EEF6; --ink1:#9FABBF; --ink2:#67748C; --ink3:#485469;
  /* semantic status — favorable/adverse/warning/blocked/info/paper/live */
  --pos:#2FD6A0; --neg:#F2637C; --warn:#E7B653; --blk:#FF4D5F;
  --info:#5AA7FF; --paper:#9D8DF8; --live:#D6B25E; --demo:#57C7E3;
  --pos-bg:rgba(47,214,160,.09); --neg-bg:rgba(242,99,124,.09);
  --warn-bg:rgba(231,182,83,.10); --blk-bg:rgba(255,77,95,.10);
  --info-bg:rgba(90,167,255,.09); --paper-bg:rgba(157,141,248,.10);
  --live-bg:rgba(214,178,94,.11); --demo-bg:rgba(87,199,227,.10);
  /* type — mono-led terminal voice; sans reserved for explanatory prose */
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono","Roboto Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  /* scale */
  --fs-xxs:9.5px; --fs-xs:10.5px; --fs-sm:11.5px; --fs-md:12.5px; --fs-lg:14px; --fs-xl:17px; --fs-xxl:22px;
  --r:5px; --r-lg:8px;
  --rail-w:208px; --top-h:46px;
  --focus:0 0 0 2px var(--bg0),0 0 0 4px var(--info);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--ink0);font-family:var(--sans);font-size:var(--fs-md);line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:rgba(90,167,255,.28)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:5px;border:2px solid var(--bg0)}
::-webkit-scrollbar-thumb:hover{background:var(--bg4)}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
a{color:var(--info);text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--pos)}.dn{color:var(--neg)}
.i1{color:var(--ink1)}.i2{color:var(--ink2)}
h1,h2,h3{font-family:var(--mono);letter-spacing:.4px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ════════ APP SHELL ════════
   grid: topbar spans, left domain rail, main workspace.
   body.mode-live gets gold top rule; body.halted gets blocked inset ring. */
#app{display:grid;grid-template-rows:var(--top-h) 1fr;grid-template-columns:var(--rail-w) 1fr;height:100vh;overflow:hidden}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg1);border-bottom:1px solid var(--line);z-index:60;min-width:0}
#rail{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:10px 8px 14px}
#main{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--bg0)}
#subnav{display:flex;align-items:center;gap:2px;padding:0 14px;height:37px;flex:none;border-bottom:1px solid var(--line);background:var(--bg1);overflow-x:auto;scrollbar-width:none}
#subnav::-webkit-scrollbar{display:none}
#view{flex:1;overflow-y:auto;padding:14px 16px 80px;scroll-behavior:smooth}
#view>.vwrap{max-width:1720px}
body.halted #app{box-shadow:inset 0 0 0 2px var(--blk)}
body.mode-live #topbar{box-shadow:inset 0 2px 0 var(--live)}
body.focusmode #rail,body.focusmode #subnav{display:none}
body.focusmode #app{grid-template-columns:0 1fr}

/* topbar */
.brand{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:2.5px;display:flex;align-items:center;gap:8px;flex:none}
.brand .bdot{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 7px var(--pos)}
body.halted .brand .bdot{background:var(--blk);box-shadow:0 0 7px var(--blk)}
.tsep{width:1px;height:22px;background:var(--line);flex:none}
.tstat{display:flex;flex-direction:column;line-height:1.2;flex:none;min-width:0}
.tstat .k{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--ink2);text-transform:uppercase}
.tstat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.tstat.click{cursor:pointer;border-radius:var(--r);padding:2px 5px;margin:-2px -5px}
.tstat.click:hover{background:var(--bg2)}
.tright{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
#clockbox{font-family:var(--mono);font-size:11.5px;color:var(--ink1);text-align:right;line-height:1.25}
#clockbox .ph{font-size:8.5px;letter-spacing:1.2px;color:var(--ink2);text-transform:uppercase}

/* meter — capacity bars in topbar + risk views */
.meter{width:74px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:3px}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--pos);transition:width .3s}
.meter>i.warn{background:var(--warn)}.meter>i.crit{background:var(--blk)}

/* ════════ CHIPS — enum-driven status language ════════
   Shape + icon + text always accompany color (never color alone). */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:600;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;border-radius:var(--r);border:1px solid;white-space:nowrap;vertical-align:middle}
.chip::before{content:attr(data-ico);font-size:8px}
.ch-demo{color:var(--demo);border-color:rgba(87,199,227,.4);background:var(--demo-bg)}
.ch-replay{color:var(--ink1);border-color:var(--line2);background:var(--bg2)}
.ch-paper{color:var(--paper);border-color:rgba(157,141,248,.42);background:var(--paper-bg)}
.ch-live{color:var(--live);border-color:rgba(214,178,94,.5);background:var(--live-bg)}
.ch-ok{color:var(--pos);border-color:rgba(47,214,160,.38);background:var(--pos-bg)}
.ch-warn{color:var(--warn);border-color:rgba(231,182,83,.42);background:var(--warn-bg)}
.ch-blk{color:var(--blk);border-color:rgba(255,77,95,.48);background:var(--blk-bg)}
.ch-info{color:var(--info);border-color:rgba(90,167,255,.38);background:var(--info-bg)}
.ch-mut{color:var(--ink2);border-color:var(--line2);background:var(--bg2)}
.ch-neg{color:var(--neg);border-color:rgba(242,99,124,.4);background:var(--neg-bg)}

/* lifecycle chips — one FSM language everywhere */
.lc{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:600;font-size:9.5px;letter-spacing:.5px;padding:2px 7px;border-radius:var(--r);border:1px solid var(--line2);color:var(--ink2);background:var(--bg2);white-space:nowrap}
.lc::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.lc-SCANNING{color:var(--ink2)}
.lc-CANDIDATE{color:var(--ink1)}
.lc-FORMING{color:var(--info);border-color:rgba(90,167,255,.35);background:var(--info-bg)}
.lc-ARMED{color:var(--warn);border-color:rgba(231,182,83,.45);background:var(--warn-bg);animation:lcpulse 1.1s ease-in-out infinite}
.lc-TRIGGERED{color:var(--pos);border-color:rgba(47,214,160,.45);background:var(--pos-bg);animation:lcpulse 1.1s ease-in-out infinite}
.lc-READY_FOR_RISK{color:var(--paper);border-color:rgba(157,141,248,.4);background:var(--paper-bg)}
.lc-RISK_BLOCKED{color:var(--blk);border-color:rgba(255,77,95,.45);background:var(--blk-bg)}
.lc-READY_FOR_HUMAN{color:var(--live);border-color:rgba(214,178,94,.5);background:var(--live-bg)}
.lc-APPROVED_PAPER{color:var(--paper)}
.lc-REJECTED{color:var(--neg);border-color:rgba(242,99,124,.4)}
.lc-EXPIRED{color:var(--ink3)}
.lc-ORDER_SUBMITTED,.lc-WORKING{color:var(--info)}
.lc-PARTIAL_FILL{color:var(--info);border-color:rgba(90,167,255,.4)}
.lc-FILLED{color:var(--pos)}
.lc-MANAGING{color:var(--pos);border-color:rgba(47,214,160,.4)}
.lc-CLOSED{color:var(--ink1)}
.lc-AUDITED{color:var(--ink2)}
@keyframes lcpulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 7px 0 currentColor}}

/* provenance tag — every rule reference is inspectable */
.prov{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.4px;color:var(--info);background:var(--info-bg);border:1px solid rgba(90,167,255,.24);border-radius:4px;padding:1px 6px;cursor:help;white-space:nowrap}
.prov.law{color:var(--live);background:var(--live-bg);border-color:rgba(214,178,94,.32)}
.prov.cfg{color:var(--paper);background:var(--paper-bg);border-color:rgba(157,141,248,.28)}

/* ════════ DOMAIN RAIL ════════ */
.dr-mode{margin:0 4px 10px;padding:9px 10px;border-radius:var(--r-lg);border:1px solid rgba(87,199,227,.35);background:var(--demo-bg)}
.dr-mode .m1{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:1.6px;color:var(--demo)}
.dr-mode .m2{font-size:10px;color:var(--ink1);margin-top:2px;line-height:1.45}
.dom{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-left:2px solid transparent;color:var(--ink1);font-family:var(--mono);font-size:12px;letter-spacing:.6px;padding:9px 10px;border-radius:var(--r);transition:background .12s,color .12s;position:relative}
.dom:hover{background:var(--bg2);color:var(--ink0)}
.dom.on{background:var(--bg2);color:var(--ink0);border-left-color:var(--info)}
.dom .dico{width:17px;text-align:center;font-size:13px;flex:none;color:var(--ink2)}
.dom.on .dico{color:var(--info)}
.dom .dkey{margin-left:auto;font-size:9px;color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:0 4px;line-height:1.5}
.dom .dbadge{margin-left:auto;font-family:var(--mono);font-size:9.5px;font-weight:700;background:var(--live-bg);color:var(--live);border:1px solid rgba(214,178,94,.4);padding:0 6px;border-radius:8px;line-height:1.7}
.dom .ddot{position:absolute;left:3px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--blk)}
.dr-purpose{font-size:9.5px;color:var(--ink3);padding:1px 12px 7px 39px;line-height:1.4;margin-top:-4px}
.dr-foot{margin-top:auto;padding:10px 6px 0;border-top:1px solid var(--line);font-family:var(--mono);font-size:9px;color:var(--ink3);line-height:1.7}
.dr-foot b{color:var(--ink2);font-weight:600}

/* sub-workspace tabs */
.snav{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink2);font-family:var(--mono);font-size:11px;letter-spacing:.5px;padding:9px 11px 7px;white-space:nowrap}
.snav:hover{color:var(--ink0)}
.snav.on{color:var(--ink0);border-bottom-color:var(--info)}
.snav .cnt{font-size:9px;color:var(--ink3);margin-left:4px}
.snav.attn .cnt{color:var(--live)}
#crumb{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3);white-space:nowrap;padding-left:14px}
#crumb b{color:var(--ink2);font-weight:600}

/* ════════ PANELS / LAYOUT ════════ */
.panel{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;min-width:0}
.panel>.ph{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.ph .t{font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink1)}
.panel>.ph .why{font-size:10.5px;color:var(--ink2)}
.panel>.ph .spacer{margin-left:auto}
.panel>.pb{padding:12px 13px}
.panel>.pb.flush{padding:0}
.panel.crit{border-color:rgba(255,77,95,.4)}
.panel.gold{border-color:rgba(214,178,94,.35)}
.grid{display:grid;gap:12px;min-width:0}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}.g13{grid-template-columns:1fr 3fr}
@media(max-width:1180px){.g2,.g3,.g4,.g21,.g12,.g13{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* view header */
.vhead{margin-bottom:13px}
.vhead .kick{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.vhead h2{font-size:var(--fs-xl);font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-wrap:balance}
.vhead .sub{font-size:var(--fs-sm);color:var(--ink1);margin-top:3px;max-width:104ch}

/* stat blocks */
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;min-width:0}
.stat .k{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--ink2);text-transform:uppercase;display:flex;gap:6px;align-items:center}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:10px;color:var(--ink2);margin-top:2px;line-height:1.4}
.stat.hot{border-color:rgba(214,178,94,.4);background:linear-gradient(180deg,var(--live-bg),var(--bg2))}

/* key-value rows */
.kv{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);align-items:baseline}
.kv:last-child{border-bottom:none}
.kv .k{font-family:var(--mono);font-size:10px;letter-spacing:.6px;color:var(--ink2);text-transform:uppercase;flex:none;width:148px}
.kv .v{color:var(--ink0);min-width:0}

/* ════════ TABLES ════════ */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg1);z-index:2;white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--bg2)}
.tbl tbody tr.sel{background:var(--bg2);box-shadow:inset 2px 0 0 var(--info)}
.tbl tbody tr.click{cursor:pointer}
.tbl .r{text-align:right}
.tbl td.num,.tbl td.r{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.tbl tr.dim td{opacity:.5}

/* ════════ BUTTONS — command-contract driven ════════ */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;background:var(--bg2);border:1px solid var(--line2);color:var(--ink1);border-radius:var(--r);padding:7px 12px;transition:all .12s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--bg3);color:var(--ink0);border-color:var(--ink3)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--info-bg);border-color:rgba(90,167,255,.45);color:var(--info)}
.btn.pri:hover:not(:disabled){background:rgba(90,167,255,.18)}
.btn.pos{background:var(--pos-bg);border-color:rgba(47,214,160,.45);color:var(--pos)}
.btn.pos:hover:not(:disabled){background:rgba(47,214,160,.17)}
.btn.neg{background:var(--neg-bg);border-color:rgba(242,99,124,.45);color:var(--neg)}
.btn.neg:hover:not(:disabled){background:rgba(242,99,124,.16)}
.btn.gold{background:var(--live-bg);border-color:rgba(214,178,94,.5);color:var(--live)}
.btn.gold:hover:not(:disabled){background:rgba(214,178,94,.18)}
.btn.danger{background:var(--blk-bg);border-color:rgba(255,77,95,.5);color:var(--blk)}
.btn.danger:hover:not(:disabled){background:rgba(255,77,95,.18)}
.btn.sm{padding:4px 9px;font-size:9.5px}
.btn.wide{width:100%;justify-content:center;padding:10px}
.btn .why{display:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* disabled-with-reason: hover reveals precondition failure */
.btn[data-blocked]{position:relative}
.btn[data-blocked]:hover::after{content:attr(data-blocked);position:absolute;left:0;bottom:calc(100% + 6px);background:var(--bg3);border:1px solid var(--line2);color:var(--warn);font-size:10px;font-weight:400;text-transform:none;letter-spacing:.2px;padding:6px 9px;border-radius:var(--r);white-space:pre-line;width:max-content;max-width:290px;z-index:90;text-align:left}

/* segmented control */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg>button{background:none;border:none;font-family:var(--mono);font-size:10px;letter-spacing:.6px;color:var(--ink2);padding:5px 11px;border-right:1px solid var(--line)}
.seg>button:last-child{border-right:none}
.seg>button.on{background:var(--bg3);color:var(--ink0)}

/* inputs */
.inp,select.inp{background:var(--bg0);border:1px solid var(--line2);border-radius:var(--r);color:var(--ink0);font-family:var(--mono);font-size:11.5px;padding:7px 10px;width:100%}
.inp::placeholder{color:var(--ink3)}

/* ════════ BANNERS / CALLOUTS ════════ */
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid;border-radius:var(--r-lg);padding:10px 13px;font-size:var(--fs-sm);line-height:1.55;margin-bottom:12px}
.banner .bico{font-family:var(--mono);font-weight:700;flex:none}
.banner.info{border-color:rgba(90,167,255,.3);background:var(--info-bg);color:var(--ink1)}
.banner.warn{border-color:rgba(231,182,83,.35);background:var(--warn-bg);color:var(--ink1)}
.banner.blk{border-color:rgba(255,77,95,.4);background:var(--blk-bg);color:var(--ink1)}
.banner.ok{border-color:rgba(47,214,160,.32);background:var(--pos-bg);color:var(--ink1)}
.banner.gold{border-color:rgba(214,178,94,.4);background:var(--live-bg);color:var(--ink1)}
.banner b{color:var(--ink0)}

/* next-best-action hero (Command) */
.nba{border:1px solid rgba(214,178,94,.42);border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(214,178,94,.12),var(--bg1) 55%);padding:14px 16px;margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.nba .nk{font-family:var(--mono);font-size:9px;letter-spacing:1.6px;color:var(--live);text-transform:uppercase}
.nba .nt{font-size:15px;font-weight:600;margin-top:2px;text-wrap:balance}
.nba .ns{font-size:11px;color:var(--ink1);margin-top:3px;max-width:92ch}
.nba .ngo{margin-left:auto;flex:none}

/* empty / degraded states */
.empty{padding:26px 16px;text-align:center;color:var(--ink2);font-size:var(--fs-sm)}
.empty .e1{font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--ink1);margin-bottom:4px}
.stale{position:relative}
.stale::after{content:'STALE';position:absolute;top:8px;right:10px;font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--warn);border:1px solid rgba(231,182,83,.4);background:var(--warn-bg);padding:1px 6px;border-radius:3px}

/* freshness dot+age */
.fresh{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
.fresh::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--pos)}
.fresh.warn::before{background:var(--warn)}
.fresh.dead::before{background:var(--blk)}

/* progress funnel */
.funnel{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:4px}
.fstage{flex:1;min-width:96px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;position:relative}
.fstage .fk{font-family:var(--mono);font-size:8.5px;letter-spacing:.8px;color:var(--ink2);text-transform:uppercase;line-height:1.3}
.fstage .fv{font-family:var(--mono);font-size:17px;margin-top:3px}
.fstage .fd{font-size:9.5px;color:var(--ink3);margin-top:1px}
.fstage:not(:last-child)::after{content:'›';position:absolute;right:-7px;top:50%;transform:translateY(-50%);color:var(--ink3);z-index:2;font-size:12px}
.fstage.hot{border-color:rgba(214,178,94,.45)}
.fstage.hot .fv{color:var(--live)}

/* vote strip */
.votes{display:flex;gap:3px;flex-wrap:wrap}
.vote{width:17px;height:17px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8.5px;font-weight:700;cursor:help;border:1px solid transparent}
.vote.pass{background:var(--pos-bg);color:var(--pos);border-color:rgba(47,214,160,.3)}
.vote.advisory{background:var(--warn-bg);color:var(--warn);border-color:rgba(231,182,83,.3)}
.vote.abstain{background:var(--bg3);color:var(--ink2);border-color:var(--line2)}
.vote.block{background:var(--blk-bg);color:var(--blk);border-color:rgba(255,77,95,.4)}

/* R-math proof rows */
.rproof{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px}
.rproof .rrow{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.rproof .rrow:last-child{border-bottom:none}
.rproof .lab{color:var(--ink2)}

/* timeline */
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line2)}
.tle{position:relative;padding:5px 0 5px 4px;font-size:var(--fs-sm)}
.tle::before{content:'';position:absolute;left:-16.5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--ink3)}
.tle.hot::before{background:var(--live);border-color:var(--live)}
.tle.bad::before{background:var(--blk);border-color:var(--blk)}
.tle.good::before{background:var(--pos);border-color:var(--pos)}
.tle .tt{font-family:var(--mono);font-size:9.5px;color:var(--ink2)}

/* ════════ DRAWER / MODAL / PALETTE / TOASTS ════════ */
#scrim{position:fixed;inset:0;background:rgba(4,7,12,.62);opacity:0;pointer-events:none;transition:opacity .18s;z-index:70}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--bg1);border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .22s cubic-bezier(.3,.9,.3,1);z-index:75;display:flex;flex-direction:column}
#drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.dhead .dt{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.8px}
.dbody{flex:1;overflow-y:auto;padding:14px 16px}
.dx{margin-left:auto;background:none;border:1px solid var(--line2);border-radius:var(--r);color:var(--ink2);font-size:11px;padding:3px 9px}
.dx:hover{color:var(--ink0);border-color:var(--ink3)}
#modal-scrim{position:fixed;inset:0;background:rgba(4,7,12,.7);display:none;align-items:center;justify-content:center;z-index:85;padding:20px}
#modal-scrim.on{display:flex}
#modal{width:min(660px,94vw);max-height:86vh;display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line2);border-radius:var(--r-lg);box-shadow:0 24px 70px rgba(0,0,0,.55)}
#modal .mh{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.8px;padding:13px 16px;border-bottom:1px solid var(--line)}
#modal .mb{padding:15px 16px;overflow-y:auto;font-size:var(--fs-sm);line-height:1.6}
#modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
#palette{position:fixed;top:11vh;left:50%;transform:translateX(-50%) scale(.98);width:min(640px,92vw);background:var(--bg1);border:1px solid var(--line2);border-radius:var(--r-lg);box-shadow:0 26px 80px rgba(0,0,0,.6);z-index:80;display:none;overflow:hidden}
#palette.on{display:block;transform:translateX(-50%)}
#palette input{width:100%;background:var(--bg0);border:none;border-bottom:1px solid var(--line);color:var(--ink0);font-family:var(--mono);font-size:13.5px;padding:13px 16px;outline:none}
#pallist{max-height:46vh;overflow-y:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:var(--r);font-size:var(--fs-sm);cursor:pointer;color:var(--ink1)}
.pitem .pk{font-family:var(--mono);font-size:9.5px;color:var(--ink3);width:64px;flex:none;text-transform:uppercase;letter-spacing:.5px}
.pitem.sel,.pitem:hover{background:var(--bg2);color:var(--ink0)}
.pitem .pgo{margin-left:auto;font-size:9px;color:var(--ink3)}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:95;max-width:380px}
.toast{background:var(--bg2);border:1px solid var(--line2);border-left:3px solid var(--info);border-radius:var(--r);padding:10px 13px;font-size:var(--fs-sm);color:var(--ink0);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .18s ease-out}
.toast.ok{border-left-color:var(--pos)}.toast.warn{border-left-color:var(--warn)}.toast.blk{border-left-color:var(--blk)}.toast.paper{border-left-color:var(--paper)}.toast.gold{border-left-color:var(--live)}
.toast .tt2{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* kill switch */
#kill{position:relative;overflow:hidden;background:var(--blk-bg);border:1px solid rgba(255,77,95,.55);color:var(--blk);font-family:var(--mono);font-weight:700;font-size:9.5px;letter-spacing:1.2px;border-radius:var(--r);padding:8px 13px;user-select:none;-webkit-user-select:none}
#kill .fill{position:absolute;inset:0;background:rgba(255,77,95,.3);transform:scaleX(0);transform-origin:left}
#kill span{position:relative}
#kill:hover{background:rgba(255,77,95,.16)}
body.halted #kill{display:none}
#resume{display:none}
body.halted #resume{display:inline-flex}

/* canvas charts */
canvas.cv{display:block;width:100%;background:var(--bg0);border:1px solid var(--line);border-radius:var(--r)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--ink2);margin-top:6px;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend button.lg-btn{font-family:var(--mono);font-size:9.5px;color:var(--ink1);background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:2px 7px;cursor:pointer}
.legend button.lg-btn:hover{border-color:var(--info);color:var(--info)}

/* misc */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:2px 9px;white-space:nowrap}
.hr{border:none;border-top:1px solid var(--line);margin:11px 0}
.code{font-family:var(--mono);font-size:10.5px;background:var(--bg0);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.65;color:var(--ink1)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:3px;padding:1px 5px}
kbd{font-family:var(--mono);font-size:9.5px;background:var(--bg2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink1)}
.demo-wm{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--demo);border:1px dashed rgba(87,199,227,.45);border-radius:3px;padding:1px 6px;text-transform:uppercase}
.blocker{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border:1px solid rgba(255,77,95,.3);background:var(--blk-bg);border-radius:var(--r);font-size:var(--fs-sm);margin-bottom:6px}
.blocker .bi{color:var(--blk);font-family:var(--mono);font-weight:700;flex:none}
.gauge{position:relative;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.gauge>i{position:absolute;inset:0;border-radius:4px;background:var(--pos)}
.sparkbox{height:34px}

/* ── SYNCHRONY additions ── */
/* the ivory paper document — the only light surface in the terminal.
   LAW-007 made physical: a human signs a document, not a widget. */
.ivory{background:#F2EDDF;color:#221D12;border:1px solid #C9BFA5;border-radius:var(--r-lg);padding:18px 22px;font-family:Georgia,'Times New Roman',serif;box-shadow:0 14px 44px rgba(0,0,0,.5)}
.ivory h3{font-family:Georgia,serif;font-size:15px;letter-spacing:.5px;border-bottom:2px solid #221D12;padding-bottom:6px;margin-bottom:10px}
.ivory .isec{border-bottom:1px solid #C9BFA5;padding:7px 0}
.ivory .isec summary{cursor:pointer;font-weight:700;font-size:11.5px;letter-spacing:.4px;color:#403820}
.ivory .isec div{font-size:12px;line-height:1.65;color:#332C1B;padding:5px 0 4px 14px}
.ivory .sigline{margin-top:14px;padding-top:10px;border-top:2px solid #221D12;display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:#6B5F3E}
.ivory .sigline .mono{font-family:var(--mono)}
.ivory .goldseal{color:#8A6D1F;font-weight:700;letter-spacing:1px}
/* Douglas blur — P&L is not knowable mid-block */
.blurval{filter:blur(7px);user-select:none;cursor:help}
/* calibration decile grid */
.decile{display:inline-block;min-width:44px;text-align:center;font-family:var(--mono);font-size:9.5px;padding:3px 4px;border-radius:3px;border:1px solid var(--line)}
.d-good{background:var(--pos-bg);color:var(--pos)}.d-mid{background:var(--warn-bg);color:var(--warn)}.d-bad{background:var(--neg-bg);color:var(--neg)}
/* ── chart studio pro ── */
.cwrap{display:flex;gap:8px}
.cbar{display:flex;flex-direction:column;gap:3px;flex:none;width:40px}
.ctool{width:40px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);color:var(--ink2);font-family:var(--mono);font-size:13px;padding:0}
.ctool:hover{color:var(--ink0);border-color:var(--ink3)}
.ctool.on{background:var(--info-bg);border-color:rgba(90,167,255,.55);color:var(--info)}
.ctool .kbd{position:absolute;font-size:7px;bottom:1px;right:3px;color:var(--ink3)}
.cmain{flex:1;min-width:0}
.chead{display:flex;gap:14px;align-items:baseline;font-family:var(--mono);font-size:11px;padding:4px 2px 8px;flex-wrap:wrap}
.chead b{font-size:13px}
.chead .ohlc span{margin-right:9px}
canvas.cvpro{display:block;width:100%;background:var(--bg0);border:1px solid var(--line);border-radius:var(--r);cursor:crosshair;touch-action:none}
/* barometer strip */
.baro{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;background:var(--bg2)}
.baro .bnum{font-family:var(--mono);font-size:13px}
@media(max-width:900px){:root{--rail-w:56px}.dom span.dlabel,.dr-purpose,.dr-mode,.dr-foot,.dom .dkey{display:none}.dom{justify-content:center}.dom .dico{width:auto}}
</style>

<body>
<div id="app">
  <div id="topbar" aria-label="Desk status"></div>
  <nav id="rail" aria-label="Primary domains"></nav>
  <div id="main">
    <div id="subnav" role="tablist" aria-label="Workspaces"></div>
    <main id="view" tabindex="-1"><div class="vwrap" id="vwrap"></div></main>
  </div>
</div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Evidence drawer"></aside>
<div id="modal-scrim"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="palette" role="dialog" aria-label="Command palette"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   ATLAS PRIME — DECISION OPERATING SYSTEM · V11 clean rebuild
   ──────────────────────────────────────────────────────────────────
   MODE: DEMO. Every market value in this build is synthetic, generated
   by a seeded deterministic engine, and watermarked as such. Nothing
   here claims live data, live orders, or profitability. The UI renders
   decisions; authority (risk, approval, execution) is modeled as a
   server boundary (SVR.*) so the real backend can replace it 1:1.
   ──────────────────────────────────────────────────────────────────
   Architecture (single-file by deliberate ADR-002, modular inside):
     U        utilities + formatting
     RNG      seeded mulberry32 — determinism for replayable demo
     CLOCK    simulated exchange clock (ET), session phases
     CONFIG   runtime numeric truth (atlas_config mirror)
     LAWS     constitution (enforced in SVR gates, displayed in SYSTEM)
     ENUMS    canonical decision/state enums — no ad-hoc strings
     STORE    central state + pub/sub
     SVR      simulated server boundary: risk engine, token issuer,
              packet FSM, order FSM, audit ledger (append-only)
     CMD      command registry — every control is a typed contract
     UI       shell, router, drawer/modal/palette/toasts
     DOMAINS  the seven primary domains, each with sub-workspaces
     ENGINE   demo tick engine (quotes, TTLs, blotter, alerts)
   ════════════════════════════════════════════════════════════════════ */

/* ═══════════ U · utilities ═══════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const U={
  esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  fmt:(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}),
  int:n=>Number(n).toLocaleString('en-US'),
  money:n=>(n<0?'-$':'$')+U.fmt(Math.abs(n),2),
  moneyK:n=>{const a=Math.abs(n),s=n<0?'-$':'$';return a>=1e6?s+U.fmt(a/1e6,2)+'M':a>=1e4?s+U.fmt(a/1e3,1)+'k':s+U.fmt(a,2)},
  pct:(n,d=2)=>(n>=0?'+':'')+U.fmt(n,d)+'%',
  sign:(n,d=2)=>(n>=0?'+':'')+U.fmt(n,d),
  R:(n,d=2)=>(n>=0?'+':'')+U.fmt(n,d)+'R',
  ago:m=>m<1?'just now':m<60?Math.round(m)+'m ago':U.fmt(m/60,1)+'h ago',
  mmss:s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},
  hash8:s=>{let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)}return('0000000'+(h>>>0).toString(16)).slice(-8)},
  cls:(...a)=>a.filter(Boolean).join(' '),
  clamp:(n,lo,hi)=>Math.min(hi,Math.max(lo,n)),
  by:(arr,k)=>Object.fromEntries(arr.map(x=>[x[k],x])),
};
const chip=(txt,cls,ico)=>'<span class="chip '+cls+'" data-ico="'+(ico||'●')+'">'+U.esc(txt)+'</span>';
const lc=st=>'<span class="lc lc-'+U.esc(st)+'">'+U.esc(st.replace(/_/g,' '))+'</span>';
const prov=(id,tip,kind)=>'<span class="prov '+(kind||(id.startsWith('LAW')?'law':id.includes('.')?'cfg':''))+'" title="'+U.esc(tip||PROV_TIPS[id]||id)+'">'+U.esc(id)+'</span>';
const stat=(k,v,s,extra)=>'<div class="stat'+(extra?' '+extra:'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';
const fresh=(label,age,slo)=>{const cls=age>slo*3?'dead':age>slo?'warn':'';return '<span class="fresh '+cls+'">'+U.esc(label)+' · '+(age<1?'<1s':Math.round(age)+'s')+'</span>'};

/* ═══════════ RNG · seeded determinism (demo replayability) ═══════════ */
const RNG=(()=>{let s=0xA71A5;const set=x=>{s=x>>>0};const r=()=>{s|=0;s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
  return{set,r,pick:a=>a[Math.floor(r()*a.length)],range:(lo,hi)=>lo+r()*(hi-lo),gauss:()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}}})();

/* ═══════════ CLOCK · simulated exchange time (ET) ═══════════ */
const CLOCK=(()=>{
  let mins=10*60+31, sec=41;                     // boots 10:31:41 ET — mid RTH
  const tick=()=>{sec+=2;if(sec>=60){sec-=60;mins++}if(mins>=16*60+5)mins=4*60};
  const hm=()=>String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
  const hms=()=>hm()+':'+String(Math.floor(sec)).padStart(2,'0');
  const phase=()=>mins<9*60+30?'PRE-MARKET':mins<10*60?'NY OPEN DRIVE':mins<11*60+30?'NY AM SESSION':mins<13*60?'LUNCH DOLDRUMS':mins<15*60?'NY PM SESSION':mins<16*60?'CLOSING HOUR':'AFTER HOURS';
  const killzone=()=>mins>=9*60+50&&mins<=11*60?'NY-AM KILLZONE':mins>=13*60+30&&mins<=16*60?'NY-PM KILLZONE':null;
  return{tick,hm,hms,phase,killzone,mins:()=>mins};
})();

/* ═══════════ CONFIG · runtime numeric truth (atlas_config.yaml mirror) ═══════════ */
const CONFIG={
  'risk.max_trade_risk_pct':{v:1.0,unit:'%equity',law:'RISK-011',why:'Hard per-trade risk ceiling; sizing formula input'},
  'risk.max_open_risk_R':{v:3.0,unit:'R',law:'RISK-020',why:'Sum of open-position risk may never exceed this'},
  'risk.max_day_loss_R':{v:2.0,unit:'R',law:'RISK-014',why:'Daily loss circuit. Breach → risk_mode BLOCKED — hard state transition (LAW-011)'},
  'risk.max_week_loss_R':{v:5.0,unit:'R',law:'RISK-015',why:'Weekly loss circuit → desk locks to review-only'},
  'risk.min_rr':{v:5.0,unit:'R multiple',law:'LAW-004 · LOCKED',why:'Realistic 5R against the TRUE structural stop. Sub-5R rejected by construction. Constitutional — no path edits this'},
  'risk.max_sector_exposure':{v:2.5,unit:'%equity',law:'RISK-031',why:'Correlated cluster cap — NVDA+AMD count as one bet'},
  'risk.loss_ladder_step':{v:0.25,unit:'%/rung',law:'MM-004',why:'Risk steps DOWN per ladder rung after losses; 2-loss cooldown arms at rung 2'},
  'risk.event_window_hrs':{v:24,unit:'hours',law:'EVT-002',why:'No new entries inside event window (FOMC/CPI/earnings) — LAW-017'},
  'packet.ttl_min':{v:25,unit:'min',law:'GOV-021',why:'Packet expiry after assembly; stale evidence cannot be approved'},
  'packet.sections_required':{v:19,unit:'sections',law:'LAW-007 · LOCKED',why:'All 19 sections required for APPROVE_LIVE'},
  'token.ttl_sec':{v:120,unit:'seconds',law:'GOV-024 · LOCKED',why:'Approval token TTL; single-use; plan-hash bound. Execution refuses expired tokens'},
  'options.max_spread_pct':{v:8.0,unit:'%',law:'OPT-007',why:'Liquidity veto: max bid/ask spread of mid. A bad contract kills a good chart (LAW-009)'},
  'options.min_oi':{v:500,unit:'contracts',law:'OPT-008',why:'Liquidity veto: minimum open interest'},
  'options.min_volume':{v:200,unit:'contracts',law:'OPT-009',why:'Liquidity veto: minimum day volume'},
  'options.iv_rank_debit_max':{v:55,unit:'IVR',law:'OPT-014',why:'Above this IVR prefer spreads over long premium'},
  'detect.displacement_body':{v:1.25,unit:'× body',law:'DET-031',why:'Displacement candle body multiple threshold'},
  'detect.displacement_vol':{v:1.5,unit:'× vol',law:'DET-032',why:'Displacement volume multiple threshold'},
  'scan.universe_size':{v:5234,unit:'symbols',law:'SLO-001',why:'US-listed deterministic heartbeat universe (2,840 optionable)'},
  'scan.universe_cycle_s':{v:30,unit:'seconds',law:'SLO-002',why:'Full-universe feature-engine cycle budget (RTH)'},
  'slo.packet_p95_s':{v:120,unit:'seconds',law:'SLO-004',why:'TRIGGERED → packet-delivered p95 budget'},
  'slo.feed_quote_ms':{v:800,unit:'ms',law:'SLO-011',why:'Quote feed freshness SLO; breach → DEGRADED, blocks approval'},
  'slo.feed_chain_ms':{v:2500,unit:'ms',law:'SLO-012',why:'Options chain freshness SLO'},
  'alerts.p2_batch_min':{v:15,unit:'min',law:'ALR-003',why:'P2 alert batching window; only P0 breaks quiet hours'},
  'agents.committee_max_fanout':{v:9,unit:'seats',law:'AGT-004',why:'Bounded committee per candidate — never all 34 seats'},
  'demo.seed':{v:685013,unit:'uint32',law:'DEMO',why:'RNG seed — this exact demo session is reproducible'},
};
const ck=k=>CONFIG[k]?CONFIG[k].v:'⚠missing:'+k;
const PROV_TIPS={};for(const k in CONFIG)PROV_TIPS[k]=k+' = '+CONFIG[k].v+' '+CONFIG[k].unit+'\n'+CONFIG[k].why;

/* ═══════════ LAWS · constitution (displayed here, enforced in SVR) ═══════════ */
const LAWS=[

/* ═══════════ SVR · simulated server boundary ═══════════
   In production these are FastAPI services. The UI NEVER computes
   authority: it calls SVR.* and renders structured verdicts. This
   keeps the swap to a real backend 1:1 — same contracts, same codes. */
const SVR={
  /* append-only audit ledger — every state change lands here */
  ledger:[],
  audit(actor,kind,msg){this.ledger.unshift({t:CLOCK.hms(),actor,kind,msg,h:U.hash8(actor+kind+msg+this.ledger.length)});if(this.ledger.length>600)this.ledger.pop()},

  /* ── deterministic risk engine — structured reason codes, no scores ── */
  riskCheck(plan){
    const r={verdict:'PASS',codes:[],required:[]};
    const deny=(code,msg,req)=>{r.verdict='BLOCK';r.codes.push({code,msg});if(req)r.required.push(req)};
    const warn=(code,msg)=>{r.codes.push({code,msg,advisory:true})};
    if(S.kill)deny('RISK-KILL','Kill switch active — all order paths locked','Resume desk (owner) before any approval');
    if(S.riskMode==='COOLDOWN'||S.riskMode==='BLOCKED')deny('RISK-MODE','risk_mode='+S.riskMode+' — circuit breaker engaged (LAW-011)','Wait for session reset');
    const riskPct=plan.riskUSD/S.equity*100;
    if(riskPct>ck('risk.max_trade_risk_pct'))deny('RISK-SIZE',U.fmt(riskPct,2)+'% > risk.max_trade_risk_pct '+ck('risk.max_trade_risk_pct')+'%','Reduce size to ≤'+U.fmt(S.equity*ck('risk.max_trade_risk_pct')/100,0)+' USD risk');
    if(S.openRiskR+plan.riskR>ck('risk.max_open_risk_R'))deny('RISK-OPEN','Open risk would reach '+U.fmt(S.openRiskR+plan.riskR,2)+'R > '+ck('risk.max_open_risk_R')+'R cap','Close or reduce an open position first');
    if(plan.rr<ck('risk.min_rr'))deny('RISK-5R','Best realistic path '+U.fmt(plan.rr,2)+'R < '+ck('risk.min_rr')+'R (LAW-004)','A wider target must be STRUCTURAL, not wished — otherwise reject');
    if(plan.spreadPct!=null&&plan.spreadPct>ck('options.max_spread_pct'))deny('OPT-007','Contract spread '+U.fmt(plan.spreadPct,1)+'% > '+ck('options.max_spread_pct')+'% (LAW-009)','Pick a liquid strike/expiry or WAIT for spread normalization');
    if(plan.eventHrs!=null&&plan.eventHrs<ck('risk.event_window_hrs'))deny('RISK-EVENT','Binary event in '+plan.eventHrs+'h < '+ck('risk.event_window_hrs')+'h blackout (LAW-017)','Wait for the event to pass');
    if(plan.sectorPct!=null&&plan.sectorPct>ck('risk.max_sector_exposure'))deny('RISK-SECTOR','Cluster exposure '+U.fmt(plan.sectorPct,1)+'% > '+ck('risk.max_sector_exposure')+'% cap','Correlated risk counts as one position');
    if(S.dataHealth!=='NOMINAL')deny('DATA-STALE','Data health '+S.dataHealth+' — stale inputs cannot approve (LAW-006)','Restore feed SLO first');
    if(plan.fresh===false)deny('DATA-SNAP','Evidence snapshot expired — packet must revalidate (LAW-006)','Re-run the desk on this symbol');
    if(plan.counterRegime)warn('CTX-REGIME','Counter-regime trade — size discipline advised, paper preferred');
    return r;
  },

  /* ── approval tokens — short-lived, single-use, plan-hash bound ── */
  tokens:{},_tkn:8840,
  issueToken(packetId,planHash,decision){
    const id='TKN-'+(++this._tkn);
    this.tokens[id]={id,packetId,planHash,decision,issued:CLOCK.hms(),ttl:ck('token.ttl_sec'),used:false};
    this.audit('SVR TokenIssuer','token',id+' issued for '+packetId+' · decision '+decision+' · hash '+planHash+' · ttl '+ck('token.ttl_sec')+'s · single-use');
    return this.tokens[id];
  },
  redeemToken(id,planHash){
    const t=this.tokens[id];
    if(!t)return{ok:false,code:'TKN-404',msg:'Token unknown'};
    if(t.used)return{ok:false,code:'TKN-USED',msg:'Token already redeemed — single-use'};
    if(t.ttl<=0)return{ok:false,code:'TKN-EXP',msg:'Token expired — plan returns to review'};
    if(t.planHash!==planHash)return{ok:false,code:'TKN-HASH',msg:'Plan changed since approval — token invalidated, revalidation required'};
    t.used=true;this.audit('SVR TokenIssuer','token',id+' redeemed for '+t.packetId);
    return{ok:true,token:t};
  },

  /* ── packet FSM transitions (server-owned) ── */
  packetDecide(pkt,decision,reason){
    if(pkt.state!=='READY_FOR_HUMAN')return{ok:false,msg:'Packet not awaiting human — state '+pkt.state};
    if(!ENUMS.DECISIONS.includes(decision))return{ok:false,msg:'Non-canonical decision enum (LAW-014)'};
    pkt.decision=decision;pkt.decisionReason=reason||null;pkt.decidedAt=CLOCK.hms();
    if(decision==='APPROVE_PAPER_ONLY'||decision==='APPROVE_REDUCED_SIZE'){pkt.state='APPROVED_PAPER'}
    else if(decision==='APPROVE_LIVE'){pkt.state='APPROVED_LIVE_PENDING_TOKEN'}
    else if(decision==='WAIT_FOR_TRIGGER'||decision==='MODIFY_LEVELS'||decision==='LOG_AND_REVIEW'){pkt.state='READY_FOR_HUMAN';pkt.note=decision}
    else{pkt.state='REJECTED'}
    this.audit('HUMAN (owner)','decision',pkt.id+' → '+decision+(reason?' · '+reason:'')+' · journaled (LAW-018)');
    JOURNAL.unshift({t:CLOCK.hm(),id:pkt.id,sym:pkt.sym,kind:pkt.state==='REJECTED'?'REJECTED':'DECISION',what:decision+(reason?' · '+reason:''),grade:pkt.grade,outcome:'—',lesson:pkt.state==='REJECTED'?'Awaiting outcome tracking — rejection quality is measured (E2)':'—'});
    return{ok:true};
  },
};

/* ═══════════ CMD · command registry — the button contract ═══════════
   Every interactive control binds to a registered command via
   data-cmd + data-arg. No inline onclick anywhere. A command declares:
   id · label · purpose · permission · preconditions() · run() · audit.
   Controls whose preconditions fail render disabled WITH THE REASON.
   One delegated listener wires the whole app. */
const CMD={
  reg:{},
  define(def){this.reg[def.id]=def},
  can(id,arg){
    const c=this.reg[id];if(!c)return{ok:false,why:'Command not registered: '+id};
    if(c.pre){const why=c.pre(arg);if(why)return{ok:false,why}}
    return{ok:true};
  },
  run(id,arg,el){
    const c=this.reg[id];
    if(!c){UI.toast('Unwired control — '+id,'blk','INTEGRITY');console.error('missing cmd',id);return}
    const gate=this.can(id,arg);
    if(!gate.ok){UI.toast(gate.why,'warn',c.label);return}
    if(c.audit!==false)SVR.audit('HUMAN (owner)','cmd',c.label+(arg?' · '+arg:''));
    c.run(arg,el);
  },
  /* button HTML helper — resolves precondition state at render time */
  btn(id,arg,cls,labelOverride){
    const c=this.reg[id];if(!c)return'<button class="btn '+(cls||'')+'" disabled data-blocked="Command not registered">'+U.esc(id)+'</button>';
    const gate=this.can(id,arg);
    const label=labelOverride||c.label;
    if(gate.ok)return'<button class="btn '+(cls||'')+'" data-cmd="'+id+'"'+(arg!=null?' data-arg="'+U.esc(arg)+'"':'')+' title="'+U.esc(c.purpose)+'">'+label+'</button>';
    return'<button class="btn '+(cls||'')+'" disabled data-blocked="'+U.esc(gate.why)+'">'+label+'</button>';
  },
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-cmd]');
  if(el&&!el.disabled){e.preventDefault();CMD.run(el.dataset.cmd,el.dataset.arg,el)}
});

let killT=null,killP=0;
function wireKill(){
  const k=$('#kill');if(!k)return;
  const fill=k.querySelector('.fill');

  k.onpointerdown=e=>{e.preventDefault();if(S.kill)return;
    killT=setInterval(()=>{killP+=0.05/0.7;fill.style.transform='scaleX('+Math.min(1,killP)+')';

const Palette={sel:0,items:[],
  open(){const p=$('#palette');p.classList.add('on');$('#scrim').classList.add('on');
    p.innerHTML='<input id="palq" placeholder="Jump to domain, workspace, symbol, packet, agent, law…" autocomplete="off"><div id="pallist"></div>';
    const inp=$('#palq');inp.focus();this.sel=0;
    const paint=()=>{$('#pallist').innerHTML=this.items.map((it,i)=>'<div class="pitem'+(i===this.sel?' sel':'')+'" data-pi="'+i+'"><span class="pk">'+U.esc(it.k)+'</span>'+U.esc(it.label)+'<span class="pgo">↵</span></div>').join('')||'<div class="pitem">No matches</div>';
      $$('#pallist .pitem').forEach(el=>el.onclick=()=>{const i=+el.dataset.pi;if(this.items[i]){this.close();this.items[i].go()}})};
    const build=q=>{q=(q||'').toLowerCase();const out=[];
      Object.entries(DOMAINS).forEach(([id,d])=>d.ws.forEach(w=>{const lbl=d.label+' / '+w.label;if(!q||lbl.toLowerCase().includes(q))out.push({k:d.label,label:w.label+' — '+d.purpose,go:()=>go(id,w.id)})}));
      SYMS.forEach(s=>{if(!q||s.sym.toLowerCase().includes(q))out.push({k:s.sym,label:'Research — '+s.name+' · '+s.setup,go:()=>{S.sym=s.sym;go('research','overview')}})});
      PACKETS.forEach(p=>{if(!q||(p.id+' '+p.sym).toLowerCase().includes(q))out.push({k:p.id,label:'Packet — '+p.sym+' '+p.dir+' · '+p.state,go:()=>go('decisions','packet',p.id)})});
      SEATS.forEach(s=>{if(!q||(s.id+' '+s.nm).toLowerCase().includes(q))out.push({k:s.id,label:'Agent — '+s.nm+' · '+s.cortex,go:()=>go('system','agents',s.id)})});
      LAWS.forEach(([id,t])=>{if(q&&(id.toLowerCase().includes(q)||t.toLowerCase().includes(q)))out.push({k:id,label:t.slice(0,72)+'…',go:()=>go('system','config')})});
      [{k:'⌘J',label:'Copilot — ask the desk (it will say no)',go:()=>CMD.run('ui.copilot')},{k:'CONTRACT',label:'Discipline contract — replay onboarding',go:()=>CMD.run('onboard')}].forEach(x=>{if(!q||x.label.toLowerCase().includes(q))out.push(x)});
      return out.slice(0,14)};
    this.items=build('');paint();
    inp.oninput=()=>{this.items=build(inp.value);this.sel=0;paint()};
    inp.onkeydown=e=>{
      if(e.key==='ArrowDown'){e.preventDefault();this.sel=Math.min(this.items.length-1,this.sel+1);paint()}
      else if(e.key==='ArrowUp'){e.preventDefault();this.sel=Math.max(0,this.sel-1);paint()}
      else if(e.key==='Enter'){const it=this.items[this.sel];if(it){this.close();it.go()}}
      else if(e.key==='Escape')this.close()};
  },
  close(){$('#palette').classList.remove('on');if(!$('#drawer').classList.contains('on'))$('#scrim').classList.remove('on')},
};

/* deterministic per-symbol candle series (isolated PRNG — global stream untouched) */
function localRng(seedStr){let s=0;for(let i=0;i<seedStr.length;i++)s=(Math.imul(s,31)+seedStr.charCodeAt(i))>>>0;return()=>{s|=0;s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const _candleCache={};
function candles(sym,n){n=n||96;const key=sym+'|'+n;if(_candleCache[key])return _candleCache[key];
  const s=symBy(sym),r=localRng('atlas-v11-'+key),out=[];let px=(s?s.px:100)*0.965;
  for(let i=0;i<n;i++){
    const drift=i>n*0.55?0.0009:0.0001;                       // engineered: sweep→displacement at 55%
    let o=px,mv=(r()-0.48)*0.008+drift;
    if(i===Math.floor(n*0.55)){mv=-0.012}                     // the sweep candle
    if(i===Math.floor(n*0.55)+2){mv=0.016}                    // displacement reclaim
    let c=o*(1+mv),hi=Math.max(o,c)*(1+r()*0.003),lo=Math.min(o,c)*(1-r()*0.003),vol=0.4+r()*(i===Math.floor(n*0.55)?2.4:1);
    out.push({o,c,h:hi,l:lo,v:vol});px=c}
  const anchor=(s?s.px:100)/px;out.forEach(cd=>{cd.o*=anchor;cd.c*=anchor;cd.h*=anchor;cd.l*=anchor});
  _candleCache[key]=out;return out}
function drawPrice(cvId,sym,opts){POSTRENDER.push(()=>{const cv=document.getElementById(cvId);if(!cv)return;opts=opts||{};

  const lows=data.map(c=>c.l),his=data.map(c=>c.h);let lo=Math.min(...lows),hi=Math.max(...his);
  if(s&&s.levels&&s.levels.stop){lo=Math.min(lo,s.levels.stop*0.998);hi=Math.max(hi,(opts.full?s.levels.t2:s.levels.t1)*1.002||hi)}
  const pad=(hi-lo)*0.04;lo-=pad;hi+=pad;

  const step=(hi-lo)/5;for(let i=0;i<=5;i++){const p=lo+step*i,y=py(p);x.beginPath();x.moveTo(0,y);x.lineTo(W-AX,y);x.stroke();x.fillText(p.toFixed(p>1000?0:2),W-AX+8,y+6)}
  /* zones: FVG + OB from level fractions (deterministic annotations) */

    x.fillStyle='rgba(90,167,255,.10)';x.fillRect(zx,py(s.levels.entry*1.0005),(W-AX)-zx,py(s.levels.entry*0.997)-py(s.levels.entry*1.0005));
    x.fillStyle='rgba(90,167,255,.7)';x.font='16px monospace';x.fillText('FVG · DET-041',zx+8,py(s.levels.entry)-8);
    x.fillStyle='rgba(47,214,160,.10)';x.fillRect(zx*0.94,py(s.levels.stop*1.007),(W-AX)-zx*0.94,py(s.levels.stop*1.001)-py(s.levels.stop*1.007));
    x.fillStyle='rgba(47,214,160,.7)';x.fillText('OB · DET-052',zx*0.94+8,py(s.levels.stop*1.004)+22)}
  data.forEach((c,i)=>{const X=i*cw,up=c.c>=c.o;
    x.strokeStyle=up?'rgba(47,214,160,.85)':'rgba(242,99,124,.85)';x.beginPath();x.moveTo(X+cw/2,py(c.h));x.lineTo(X+cw/2,py(c.l));x.stroke();
    x.fillStyle=up?'rgba(47,214,160,.85)':'rgba(242,99,124,.85)';const y1=py(Math.max(c.o,c.c)),y2=py(Math.min(c.o,c.c));x.fillRect(X+cw*0.18,y1,Math.max(2,cw*0.64),Math.max(2,y2-y1));
    x.fillStyle='rgba(90,167,255,.25)';x.fillRect(X+cw*0.18,H-c.v*H*0.07,Math.max(2,cw*0.64),c.v*H*0.07)});
  if(s&&s.levels&&s.levels.entry&&opts.levels!==false){
    const lv=[['ENTRY',s.levels.entry,'#5AA7FF'],['STOP',s.levels.stop,'#FF4D5F'],['T1',s.levels.t1,'#2FD6A0'],['T2 · 5R',s.levels.t2,'#2FD6A0'],['T3',s.levels.t3,'#2FD6A0']];
    x.font='16px monospace';lv.forEach(([nm,p,col])=>{if(!p)return;const y=py(p);if(y<0||y>H)return;
      x.strokeStyle=col;x.setLineDash([7,5]);x.beginPath();x.moveTo(0,y);x.lineTo(W-AX,y);x.stroke();x.setLineDash([]);

})}

function drawChartX(cvId,sym,opts){POSTRENDER.push(()=>{const cv=document.getElementById(cvId);if(!cv)return;opts=opts||{};
  const W=cv.width=cv.clientWidth*2,H=cv.height=(opts.h||300)*2,x=cv.getContext('2d');
  const all=candles(sym,opts.n||110),cut=opts.replay?Math.max(12,Math.floor(all.length*opts.replayAt/100)):all.length;
  const data=all.slice(0,cut),s=symBy(sym);
  const lows=data.map(c=>c.l),his=data.map(c=>c.h);let lo=Math.min(...lows),hi=Math.max(...his);
  if(s&&s.levels&&s.levels.stop&&!opts.replay){lo=Math.min(lo,s.levels.stop*0.998);hi=Math.max(hi,(s.levels.t2||hi)*1.002)}
  const pad=(hi-lo)*0.04;lo-=pad;hi+=pad;
  const AX=88,cw=(W-AX)/data.length,py=p=>H-((p-lo)/(hi-lo))*(H*0.80)-H*0.03;
  x.fillStyle='#070B12';x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(151,166,192,.08)';x.lineWidth=1;x.font='17px monospace';
  const step=(hi-lo)/5;for(let i=0;i<=5;i++){const p=lo+step*i,y=py(p);x.beginPath();x.moveTo(0,y);x.lineTo(W-AX,y);x.stroke();x.fillStyle='#67748C';x.fillText(p.toFixed(p>1000?0:2),W-AX+8,y+6)}
  if(opts.zones&&s&&s.levels&&s.levels.entry){
    const zx=(W-AX)*0.57;
    x.fillStyle='rgba(90,167,255,.10)';x.fillRect(zx,py(s.levels.entry*1.0005),(W-AX)-zx,py(s.levels.entry*0.997)-py(s.levels.entry*1.0005));
    x.fillStyle='rgba(90,167,255,.7)';x.fillText('FVG · DET-041',zx+8,py(s.levels.entry)-8);
    x.fillStyle='rgba(47,214,160,.10)';x.fillRect(zx*0.94,py(s.levels.stop*1.007),(W-AX)-zx*0.94,py(s.levels.stop*1.001)-py(s.levels.stop*1.007));
    x.fillStyle='rgba(47,214,160,.7)';x.fillText('OB · DET-052',zx*0.94+8,py(s.levels.stop*1.004)+20)}
  /* series */
  if(opts.type==='line'||opts.type==='area'){
    x.beginPath();data.forEach((c,i)=>{const X=i*cw+cw/2,Y=py(c.c);i?x.lineTo(X,Y):x.moveTo(X,Y)});
    x.strokeStyle='#5AA7FF';x.lineWidth=2.5;x.stroke();
    if(opts.type==='area'){x.lineTo(cut*cw,H);x.lineTo(0,H);x.closePath();const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(90,167,255,.20)');g.addColorStop(1,'rgba(90,167,255,0)');x.fillStyle=g;x.fill()}
  }else{
    data.forEach((c,i)=>{const X=i*cw,up=c.c>=c.o;
      x.strokeStyle=up?'rgba(47,214,160,.85)':'rgba(242,99,124,.85)';x.beginPath();x.moveTo(X+cw/2,py(c.h));x.lineTo(X+cw/2,py(c.l));x.stroke();
      x.fillStyle=up?'rgba(47,214,160,.85)':'rgba(242,99,124,.85)';const y1=py(Math.max(c.o,c.c)),y2=py(Math.min(c.o,c.c));x.fillRect(X+cw*0.18,y1,Math.max(2,cw*0.64),Math.max(2,y2-y1));
      x.fillStyle='rgba(90,167,255,.22)';x.fillRect(X+cw*0.18,H-c.v*H*0.06,Math.max(2,cw*0.64),c.v*H*0.06)})}
  /* indicators */
  const ema=(n)=>{const k=2/(n+1);let e=data[0].c;return data.map(c=>(e=c.c*k+e*(1-k)))};
  if(opts.ema20){const e=ema(20);x.beginPath();e.forEach((v,i)=>{const X=i*cw+cw/2,Y=py(v);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle='rgba(231,182,83,.8)';x.lineWidth=1.6;x.stroke()}
  if(opts.ema50){const e=ema(50);x.beginPath();e.forEach((v,i)=>{const X=i*cw+cw/2,Y=py(v);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle='rgba(157,141,248,.8)';x.lineWidth=1.6;x.stroke()}
  if(opts.vwap){let cum=0,cv2=0;const w=data.map(c=>{const tp=(c.h+c.l+c.c)/3;cum+=tp*c.v;cv2+=c.v;return cum/cv2});
    x.beginPath();w.forEach((v,i)=>{const X=i*cw+cw/2,Y=py(v);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle='rgba(87,199,227,.7)';x.setLineDash([3,4]);x.stroke();x.setLineDash([])}
  if(opts.bb){const n2=20,k2=2;const sma=data.map((c,i)=>{const w2=data.slice(Math.max(0,i-n2+1),i+1);return w2.reduce((a2,c2)=>a2+c2.c,0)/w2.length});
    const sd=data.map((c,i)=>{const w2=data.slice(Math.max(0,i-n2+1),i+1);const m=sma[i];return Math.sqrt(w2.reduce((a2,c2)=>a2+(c2.c-m)*(c2.c-m),0)/w2.length)});
    [1,-1].forEach(sg=>{x.beginPath();sma.forEach((m,i)=>{const X=i*cw+cw/2,Y=py(m+sg*k2*sd[i]);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle='rgba(157,141,248,.4)';x.lineWidth=1.2;x.stroke()})}
  if(opts.rsi){const per=14;let g=0,l2=0;const rsi=data.map((c,i)=>{if(!i)return 50;const ch2=c.c-data[i-1].c;g=(g*(per-1)+Math.max(ch2,0))/per;l2=(l2*(per-1)+Math.max(-ch2,0))/per;return l2===0?100:100-100/(1+g/l2)});
    const y0=H*0.86,hh=H*0.13;x.fillStyle='rgba(12,18,32,.85)';x.fillRect(0,y0,W-AX,hh);
    [30,70].forEach(lv=>{const Y=y0+hh-(lv/100)*hh;x.strokeStyle='rgba(151,166,192,.2)';x.setLineDash([3,4]);x.beginPath();x.moveTo(0,Y);x.lineTo(W-AX,Y);x.stroke();x.setLineDash([])});
    x.beginPath();rsi.forEach((v,i)=>{const X=i*cw+cw/2,Y=y0+hh-(v/100)*hh;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle='rgba(231,182,83,.85)';x.lineWidth=1.6;x.stroke();
    x.fillStyle='#67748C';x.fillText('RSI(14)',8,y0+16)}
  if(opts.levels!==false&&s&&s.levels&&s.levels.entry&&!opts.mini){
    [['ENTRY',s.levels.entry,'#5AA7FF'],['STOP',s.levels.stop,'#FF4D5F'],['T1',s.levels.t1,'#2FD6A0'],['T2 · 5R',s.levels.t2,'#2FD6A0'],['T3',s.levels.t3,'#2FD6A0']].forEach(([nm,p,col])=>{
      if(!p)return;const y=py(p);if(y<0||y>H)return;
      x.strokeStyle=col;x.setLineDash([7,5]);x.beginPath();x.moveTo(0,y);x.lineTo(W-AX,y);x.stroke();x.setLineDash([]);
      x.fillStyle=col;x.fillText(nm+' '+p.toFixed(2),10,y-6)})}
  if(opts.replay){x.fillStyle='rgba(214,178,94,.9)';x.font='18px monospace';x.fillText('REPLAY · bar '+cut+'/'+all.length+' · no future leakage',12,26)}
})}

/* ── Monte Carlo cone (legacy M2) — honest label: 140 seeded paths ── */
function drawCone(cvId){POSTRENDER.push(()=>{const cv=document.getElementById(cvId);if(!cv)return;
  const W=cv.width=cv.clientWidth*2,H=cv.height=230*2,x=cv.getContext('2d');
  const r=localRng('cone-'+ck('demo.seed')),N=170,P=140,paths=[];
  for(let p=0;p<P;p++){let eq=Math.log(1000),row=[eq];for(let i=0;i<N;i++){eq+=0.011+(r()-0.5)*0.06;row.push(eq)}paths.push(row)}
  const lo=Math.log(500),hi=Math.log(200000);
  const py=v=>H-((v-lo)/(hi-lo))*H*0.9-H*0.05,px=i=>i/N*W;
  x.fillStyle='#070B12';x.fillRect(0,0,W,H);
  x.font='16px monospace';
  [1000,10000,100000].forEach(g2=>{const y=py(Math.log(g2));x.strokeStyle='rgba(151,166,192,.18)';x.setLineDash([4,5]);x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();x.setLineDash([]);x.fillStyle='#67748C';x.fillText('$'+(g2/1000)+'k',W-70,y-5)});
  const bands=[[0.1,0.9,'rgba(90,167,255,.08)'],[0.25,0.75,'rgba(90,167,255,.13)']];
  bands.forEach(([a,b,col])=>{x.beginPath();
    for(let i=0;i<=N;i++){const col2=paths.map(p=>p[i]).sort((m,n2)=>m-n2);x[i?'lineTo':'moveTo'](px(i),py(col2[Math.floor(P*a)]))}
    for(let i=N;i>=0;i--){const col2=paths.map(p=>p[i]).sort((m,n2)=>m-n2);x.lineTo(px(i),py(col2[Math.floor(P*b)]))}
    x.closePath();x.fillStyle=col;x.fill()});
  x.beginPath();for(let i=0;i<=N;i++){const col2=paths.map(p=>p[i]).sort((m,n2)=>m-n2);x[i?'lineTo':'moveTo'](px(i),py(col2[Math.floor(P*0.5)]))}
  x.strokeStyle='#5AA7FF';x.lineWidth=2.5;x.stroke();
  x.beginPath();paths[7].forEach((v,i)=>x[i?'lineTo':'moveTo'](px(i),py(v)));x.strokeStyle='rgba(214,178,94,.85)';x.lineWidth=1.6;x.stroke();
  const hit=paths.filter(p=>Math.max(...p)>=Math.log(100000)).length;
  x.fillStyle='#E9EEF6';x.font='18px monospace';x.fillText('P(touch $100k ≤ '+N+' trades) ≈ '+Math.round(hit/P*100)+'% · 140 seeded paths · exp +1.04R · win 34% · payoff 3.9:1 · DEMO',14,28);
})}

  else if(confN<7){verdict='WATCH_ONLY';cls='ch-warn';why=(12-confN)+' confluence factors missing — the desk would rather show you nothing than a bad trade.'}
  else if(rr<5.5||b.riskPct>1.0){verdict='APPROVED_REDUCED_SIZE';cls='ch-paper';why='Marginal edge ('+U.fmt(rr,1)+'R / '+confN+'/12) — size discipline applies.'}
  else{verdict='APPROVED';cls='ch-ok';why='Plan clears every gate at '+U.fmt(rr,1)+'R with '+confN+'/12 confluence. Still needs the packet pipeline + your enum for anything beyond paper.'}
  const quality=Math.round((Math.min(rr,8)/8)*45+(confN/12)*40+(b.riskPct<=0.6?15:b.riskPct<=1?8:0));
  return{r2,r3,rr,confN,verdict,cls,why,quality,risk};
}

function cproSeries(){
  const all=candles(S.sym,360);
  const eff=CHARTX.replay?Math.max(40,Math.floor(all.length*CHARTX.replayAt/100)):all.length;
  return all.slice(0,eff);
}
function cproClampView(len){
  const v=CHARTPRO.view;
  v.n=U.clamp(v.n,30,360);
  v.off=U.clamp(v.off,0,Math.max(0,len-v.n));
}
/* deterministic AI structure: pivots + sweep + displacement + auto-fib */
function cproPivots(data){
  const out=[],w=6;
  for(let i=w;i<data.length-w;i++){
    const win=data.slice(i-w,i+w+1);
    if(data[i].h===Math.max(...win.map(c=>c.h)))out.push({i,p:data[i].h,hi:true});
    if(data[i].l===Math.min(...win.map(c=>c.l)))out.push({i,p:data[i].l,hi:false});
  }
  /* label swing grammar */
  let lastHi=null,lastLo=null;
  out.forEach(pv=>{
    if(pv.hi){pv.lbl=lastHi==null?'H':(pv.p>lastHi?'HH':'LH');lastHi=pv.p}
    else{pv.lbl=lastLo==null?'L':(pv.p>lastLo?'HL':'LL');lastLo=pv.p}
  });
  return out;
}

function cproDraw(){
  const cv=document.getElementById('cp-main');if(!cv)return;
  const W=cv.width=cv.clientWidth*2,H=cv.height=380*2,x=cv.getContext('2d');
  const s=symBy(S.sym),data=cproSeries();
  cproClampView(data.length);
  const v=CHARTPRO.view,i0=Math.max(0,data.length-v.n-v.off),i1=Math.min(data.length,i0+v.n);
  const win=data.slice(i0,i1);
  let lo=Math.min(...win.map(c=>c.l)),hi=Math.max(...win.map(c=>c.h));
  if(s&&s.levels&&s.levels.stop&&!CHARTX.replay){lo=Math.min(lo,s.levels.stop*0.998);hi=Math.max(hi,(s.levels.t2||hi)*1.002)}
  const pad=(hi-lo)*0.05;lo-=pad;hi+=pad;
  const AX=92,plotH=CHARTX.rsi?H*0.80:H*0.94,cw=(W-AX)/v.n;
  const p2y=p=>plotH-((p-lo)/(hi-lo))*(plotH*0.94)-plotH*0.02;
  const y2p=y=>lo+((plotH-plotH*0.02-y)/(plotH*0.94))*(hi-lo);
  const b2x=i=>(i-i0)*cw+cw/2, x2b=px=>U.clamp(Math.round(px/cw)+i0,0,data.length-1);
  cv._sc={p2y,y2p,b2x,x2b,i0,i1,AX,W,H,cw,plotH};
  x.fillStyle='#070B12';x.fillRect(0,0,W,H);
  /* killzone band — last fifth of visible window when inside a killzone */
  if(CLOCK.killzone()){const kx=(W-AX)*0.8;x.fillStyle='rgba(214,178,94,.045)';x.fillRect(kx,0,(W-AX)-kx,plotH);
    x.fillStyle='rgba(214,178,94,.5)';x.font='15px monospace';x.fillText(CLOCK.killzone(),kx+8,18)}
  /* grid + price axis */
  x.font='17px monospace';const step=(hi-lo)/6;
  for(let i=0;i<=6;i++){const p=lo+step*i,y=p2y(p);
    x.strokeStyle='rgba(151,166,192,.07)';x.beginPath();x.moveTo(0,y);x.lineTo(W-AX,y);x.stroke();
    x.fillStyle='#67748C';x.fillText(p.toFixed(p>1000?0:2),W-AX+8,y+6)}
  /* machine zones (FVG/OB) with hit-rects */
  cv._zones=[];
  if(CHARTX.zones&&s&&s.levels&&s.levels.entry){
    const zx=(W-AX)*0.55;
    const fy1=p2y(s.levels.entry*1.0005),fy2=p2y(s.levels.entry*0.997);
    x.fillStyle='rgba(90,167,255,.10)';x.fillRect(zx,fy1,(W-AX)-zx,fy2-fy1);
    x.fillStyle='rgba(90,167,255,.75)';x.font='15px monospace';x.fillText('FVG · DET-041 · click',zx+8,fy1-6);
    cv._zones.push({x:zx,y:fy1,w:(W-AX)-zx,h:fy2-fy1,id:'FVG'});
    const oy1=p2y(s.levels.stop*1.007),oy2=p2y(s.levels.stop*1.001);
    x.fillStyle='rgba(47,214,160,.10)';x.fillRect(zx*0.92,oy1,(W-AX)-zx*0.92,oy2-oy1);
    x.fillStyle='rgba(47,214,160,.75)';x.fillText('OB · DET-052 · click',zx*0.92+8,oy2+18);
    cv._zones.push({x:zx*0.92,y:oy1,w:(W-AX)-zx*0.92,h:oy2-oy1,id:'OB'});
  }
  /* candles + volume */
  win.forEach((c,j)=>{const X=j*cw,up=c.c>=c.o,col=up?'rgba(47,214,160,.9)':'rgba(242,99,124,.9)';
    x.strokeStyle=col;x.beginPath();x.moveTo(X+cw/2,p2y(c.h));x.lineTo(X+cw/2,p2y(c.l));x.stroke();
    x.fillStyle=col;const y1=p2y(Math.max(c.o,c.c)),y2=p2y(Math.min(c.o,c.c));
    x.fillRect(X+cw*0.16,y1,Math.max(2,cw*0.68),Math.max(2,y2-y1));
    x.fillStyle='rgba(90,167,255,.20)';x.fillRect(X+cw*0.16,plotH-c.v*plotH*0.055,Math.max(2,cw*0.68),c.v*plotH*0.055)});
  /* indicators on the visible window (computed on full series, sliced) */
  const ema=n2=>{const k2=2/(n2+1);let e=data[0].c;return data.map(c=>(e=c.c*k2+e*(1-k2)))};
  const lineOf=(arr,col,dash)=>{x.beginPath();for(let i=i0;i<i1;i++){const X=b2x(i),Y=p2y(arr[i]);i===i0?x.moveTo(X,Y):x.lineTo(X,Y)}x.strokeStyle=col;x.lineWidth=1.7;if(dash)x.setLineDash(dash);x.stroke();x.setLineDash([])};
  if(CHARTX.ema20)lineOf(ema(20),'rgba(231,182,83,.85)');
  if(CHARTX.ema50)lineOf(ema(50),'rgba(157,141,248,.85)');
  if(CHARTX.ema200)lineOf(ema(200),'rgba(242,99,124,.6)');
  if(CHARTX.vwap){let cum=0,cv3=0;const w2=data.map(c=>{const tp=(c.h+c.l+c.c)/3;cum+=tp*c.v;cv3+=c.v;return cum/cv3});lineOf(w2,'rgba(87,199,227,.75)',[3,4])}
  if(CHARTX.bb){const n2=20,k2=2;const sma=data.map((c,i)=>{const w3=data.slice(Math.max(0,i-n2+1),i+1);return w3.reduce((a2,c2)=>a2+c2.c,0)/w3.length});
    const sd=data.map((c,i)=>{const w3=data.slice(Math.max(0,i-n2+1),i+1);const m2=sma[i];return Math.sqrt(w3.reduce((a2,c2)=>a2+(c2.c-m2)**2,0)/w3.length)});
    lineOf(sma.map((m2,i)=>m2+k2*sd[i]),'rgba(157,141,248,.35)');lineOf(sma.map((m2,i)=>m2-k2*sd[i]),'rgba(157,141,248,.35)')}
  /* plan levels */
  if(s&&s.levels&&s.levels.entry){x.font='15px monospace';
    [['ENTRY',s.levels.entry,'#5AA7FF'],['STOP',s.levels.stop,'#FF4D5F'],['T1',s.levels.t1,'#2FD6A0'],['T2 · 5R',s.levels.t2,'#2FD6A0'],['T3',s.levels.t3,'#2FD6A0']].forEach(([nm,p,col])=>{
      if(!p)return;const y=p2y(p);if(y<0||y>plotH)return;
      x.strokeStyle=col;x.setLineDash([7,5]);x.beginPath();x.moveTo(0,y);x.lineTo(W-AX,y);x.stroke();x.setLineDash([]);
      x.fillStyle=col;x.fillText(nm+' '+p.toFixed(2),8,y-5)})}
  /* AI structure overlay */
  if(CHARTPRO.ai){
    const pvs=cproPivots(data).filter(pv=>pv.i>=i0&&pv.i<i1);
    x.font='14px monospace';
    pvs.forEach(pv=>{x.fillStyle=pv.hi?'rgba(242,99,124,.8)':'rgba(47,214,160,.8)';
      x.fillText(pv.lbl,b2x(pv.i)-10,p2y(pv.p)+(pv.hi?-8:16))});
    const swI=Math.floor(data.length*0.55);
    if(swI>=i0&&swI<i1){const sx=b2x(swI),sy=p2y(data[swI].l);
      x.strokeStyle='rgba(214,178,94,.9)';x.lineWidth=2;x.beginPath();x.arc(sx,sy+8,13,0,7);x.stroke();
      x.fillStyle='rgba(214,178,94,.9)';x.fillText('SWEEP',sx-22,sy+38);
      const dx=b2x(Math.min(swI+2,data.length-1));
      x.strokeStyle='rgba(47,214,160,.9)';x.beginPath();x.moveTo(dx,sy);x.lineTo(dx,sy-46);x.lineTo(dx-6,sy-36);x.moveTo(dx,sy-46);x.lineTo(dx+6,sy-36);x.stroke();
      x.fillStyle='rgba(47,214,160,.9)';x.fillText('DISPLACEMENT',dx+8,sy-30)}
    /* auto-fib of the last leg: post-sweep low → window high */
    const legLo=Math.min(...data.slice(swI).map(c=>c.l)),legHi=Math.max(...data.slice(swI).map(c=>c.h));
    [[0,'0'],[0.382,'38.2'],[0.5,'50'],[0.618,'61.8'],[0.705,'70.5 ◆A+'],[0.79,'79'],[1,'100']].forEach(([f,lb])=>{
      const p=legHi-(legHi-legLo)*f,y=p2y(p);if(y<0||y>plotH)return;
      const gold=lb.includes('◆');
      x.strokeStyle=gold?'rgba(214,178,94,.55)':'rgba(151,166,192,.16)';x.setLineDash([2,5]);
      x.beginPath();x.moveTo((W-AX)*0.66,y);x.lineTo(W-AX,y);x.stroke();x.setLineDash([]);
      x.fillStyle=gold?'rgba(214,178,94,.85)':'rgba(151,166,192,.45)';x.fillText(lb,(W-AX)*0.66-46,y+4)});
  }
  /* user drawings */
  const dr=CHARTPRO.list();
  const drawOne=(d,seld)=>{
    x.lineWidth=seld?2.6:1.8;
    const col=seld?'#E7B653':(d.col||'#5AA7FF');
    x.strokeStyle=col;x.fillStyle=col;x.font='14px monospace';
    if(d.t==='hline'){const y=p2y(d.p1.p);x.setLineDash([]);x.beginPath();x.moveTo(0,y);x.lineTo(W-AX,y);x.stroke();x.fillText(d.p1.p.toFixed(2),W-AX-70,y-5)}
    if(d.t==='trend'){x.beginPath();x.moveTo(b2x(d.p1.i),p2y(d.p1.p));x.lineTo(b2x(d.p2.i),p2y(d.p2.p));x.stroke()}
    if(d.t==='zone'){const x1=b2x(d.p1.i),x22=b2x(d.p2.i),y1=p2y(d.p1.p),y22=p2y(d.p2.p);
      x.fillStyle=(d.col||'#5AA7FF')+'22';x.fillRect(Math.min(x1,x22),Math.min(y1,y22),Math.abs(x22-x1),Math.abs(y22-y1));
      x.strokeRect(Math.min(x1,x22),Math.min(y1,y22),Math.abs(x22-x1),Math.abs(y22-y1))}
    if(d.t==='fib'){const pHi=Math.max(d.p1.p,d.p2.p),pLo=Math.min(d.p1.p,d.p2.p);
      [[0,'0'],[0.236,'23.6'],[0.382,'38.2'],[0.5,'50'],[0.618,'61.8'],[0.705,'70.5 ◆'],[0.79,'79'],[1,'100']].forEach(([f,lb])=>{
        const p=pHi-(pHi-pLo)*f,y=p2y(p);
        x.strokeStyle=lb.includes('◆')?'rgba(214,178,94,.8)':col+'88';x.beginPath();x.moveTo(b2x(Math.min(d.p1.i,d.p2.i)),y);x.lineTo(b2x(Math.max(d.p1.i,d.p2.i)),y);x.stroke();
        x.fillStyle=lb.includes('◆')?'rgba(214,178,94,.9)':col;x.fillText(lb+' · '+p.toFixed(2),b2x(Math.max(d.p1.i,d.p2.i))+6,y+4)})}
    if(d.t==='measure'){const x1=b2x(d.p1.i),x22=b2x(d.p2.i),y1=p2y(d.p1.p),y22=p2y(d.p2.p);
      const dp=d.p2.p-d.p1.p,pct=dp/d.p1.p*100,bars=Math.abs(d.p2.i-d.p1.i);
      x.setLineDash([5,4]);x.strokeRect(Math.min(x1,x22),Math.min(y1,y22),Math.abs(x22-x1),Math.abs(y22-y1));x.setLineDash([]);
      const rTxt=(s&&s.levels&&s.levels.entry&&s.levels.stop)?' · '+U.fmt(Math.abs(dp)/Math.abs(s.levels.entry-s.levels.stop),2)+'R (vs plan stop)':'';
      const lbl=(dp>=0?'+':'')+dp.toFixed(2)+' ('+pct.toFixed(2)+'%) · '+bars+' bars'+rTxt;
      x.fillStyle='#0C1220';const tw=x.measureText(lbl).width;x.fillRect(Math.min(x1,x22),Math.min(y1,y22)-24,tw+14,20);
      x.fillStyle=dp>=0?'#2FD6A0':'#F2637C';x.fillText(lbl,Math.min(x1,x22)+7,Math.min(y1,y22)-9)}
    if(d.t==='pos'){const e=d.p1.p,st=d.p2.p,tg=d.p3.p;const x1=b2x(d.p1.i),x22=Math.min(b2x(d.p1.i)+cw*26,W-AX);
      const rr=Math.abs(tg-e)/Math.abs(e-st)*(((tg>e)===(e>st))?1:1);
      x.fillStyle='rgba(242,99,124,.14)';x.fillRect(x1,Math.min(p2y(e),p2y(st)),x22-x1,Math.abs(p2y(st)-p2y(e)));
      x.fillStyle='rgba(47,214,160,.14)';x.fillRect(x1,Math.min(p2y(e),p2y(tg)),x22-x1,Math.abs(p2y(tg)-p2y(e)));
      x.strokeStyle='#5AA7FF';x.beginPath();x.moveTo(x1,p2y(e));x.lineTo(x22,p2y(e));x.stroke();
      const pass=rr>=ck('risk.min_rr');
      x.fillStyle='#0C1220';x.fillRect(x1+4,p2y(e)-26,236,20);
      x.fillStyle=pass?'#2FD6A0':'#FF4D5F';
      x.fillText(U.fmt(rr,2)+'R '+(pass?'✓ ≥ '+ck('risk.min_rr')+'R — gate would PASS':'✗ SUB-'+ck('risk.min_rr')+'R — gate would BLOCK'),x1+10,p2y(e)-11)}
    if(d.t==='note'){x.fillText('✎ '+d.txt,b2x(d.p1.i),p2y(d.p1.p))}
  };
  dr.forEach((d,idx)=>drawOne(d,idx===CHARTPRO.sel));
  /* pending placement preview */
  if(CHARTPRO.pend.length&&CHARTPRO.hover){
    const ph={t:CHARTPRO.tool,p1:CHARTPRO.pend[0],p2:CHARTPRO.pend[1]||CHARTPRO.hover,p3:CHARTPRO.hover,col:'#9D8DF8'};
    if(CHARTPRO.tool==='pos'&&CHARTPRO.pend.length===1)ph.t='measure';
    if(CHARTPRO.tool==='pos'&&CHARTPRO.pend.length===2){ph.p1=CHARTPRO.pend[0];ph.p2=CHARTPRO.pend[1];ph.p3=CHARTPRO.hover}
    drawOne(ph,false);
  }
  /* RSI pane */
  if(CHARTX.rsi){const per=14;let g=0,l2=0;const rsi=data.map((c,i)=>{if(!i)return 50;const ch2=c.c-data[i-1].c;g=(g*(per-1)+Math.max(ch2,0))/per;l2=(l2*(per-1)+Math.max(-ch2,0))/per;return l2===0?100:100-100/(1+g/l2)});
    const y0=plotH+8,hh=H-y0-6;x.fillStyle='rgba(12,18,32,.9)';x.fillRect(0,y0,W-AX,hh);
    [30,70].forEach(lv=>{const Y=y0+hh-(lv/100)*hh;x.strokeStyle='rgba(151,166,192,.2)';x.setLineDash([3,4]);x.beginPath();x.moveTo(0,Y);x.lineTo(W-AX,Y);x.stroke();x.setLineDash([])});
    x.beginPath();for(let i=i0;i<i1;i++){const X=b2x(i),Y=y0+hh-(rsi[i]/100)*hh;i===i0?x.moveTo(X,Y):x.lineTo(X,Y)}
    x.strokeStyle='rgba(231,182,83,.85)';x.lineWidth=1.6;x.stroke();
    x.fillStyle='#67748C';x.font='14px monospace';x.fillText('RSI(14) '+rsi[i1-1].toFixed(0),8,y0+16)}
  /* crosshair */
  if(CHARTPRO.hover&&CHARTPRO.hover.px!=null){
    const hx=CHARTPRO.hover.px,hy=CHARTPRO.hover.py;
    x.strokeStyle='rgba(151,166,192,.3)';x.setLineDash([3,4]);
    x.beginPath();x.moveTo(hx,0);x.lineTo(hx,plotH);x.stroke();
    x.beginPath();x.moveTo(0,hy);x.lineTo(W-AX,hy);x.stroke();x.setLineDash([]);
    const p=y2p(hy);x.fillStyle='#1A2438';x.fillRect(W-AX+2,hy-11,AX-4,22);
    x.fillStyle='#E9EEF6';x.font='16px monospace';x.fillText(p.toFixed(2),W-AX+8,hy+5);
  }
  if(CHARTX.replay){x.fillStyle='rgba(214,178,94,.9)';x.font='17px monospace';x.fillText('REPLAY · '+data.length+'/360 bars · no future leakage',10,plotH-10)}
  /* OHLC header */
  const hb=CHARTPRO.hover&&CHARTPRO.hover.bar!=null?data[CHARTPRO.hover.bar]:win[win.length-1];
  const el=document.getElementById('cp-ohlc');
  if(el&&hb){const chg=(hb.c-hb.o)/hb.o*100;
    el.innerHTML='<b>'+S.sym+'</b> <span class="i2">'+CHARTX.tf+'</span><span class="ohlc"><span>O <b class="mono">'+hb.o.toFixed(2)+'</b></span><span>H <b class="mono">'+hb.h.toFixed(2)+'</b></span><span>L <b class="mono">'+hb.l.toFixed(2)+'</b></span><span>C <b class="mono '+(chg>=0?'up':'dn')+'">'+hb.c.toFixed(2)+' ('+U.pct(chg)+')</b></span></span>'+
    '<span class="i2">bid×ask <span class="mono">'+(s.px*0.9998).toFixed(2)+' × '+(s.px*1.0002).toFixed(2)+'</span></span>'+
    '<span class="i2">bars '+(i0+1)+'–'+i1+' of '+data.length+' · wheel zoom · drag pan</span>'+
    (CHARTPRO.sel!=null?'<span class="tag" style="color:var(--warn)">drawing selected — DEL removes</span>':'')+
    (CHARTPRO.pend.length?'<span class="tag" style="color:var(--paper)">'+CHARTPRO.tool.toUpperCase()+': point '+(CHARTPRO.pend.length+1)+'…</span>':'');}
}

/* ── event wiring (once per mount) ── */
function cproWire(){
  const cv=document.getElementById('cp-main');if(!cv||cv.dataset.wired)return;cv.dataset.wired='1';
  const pt=e=>{const r=cv.getBoundingClientRect();const px=(e.clientX-r.left)*(cv.width/r.width),py=(e.clientY-r.top)*(cv.height/r.height);
    const sc=cv._sc;return{px,py,bar:sc?sc.x2b(px):0,i:sc?sc.x2b(px):0,p:sc?sc.y2p(py):0}};
  cv.addEventListener('mousemove',e=>{const q=pt(e);CHARTPRO.hover=q;
    if(CHARTPRO.dragging){const dBars=Math.round((q.px-CHARTPRO.dragX)/(cv._sc?cv._sc.cw:6));CHARTPRO.view.off=CHARTPRO.dragOff+dBars}
    cproDraw()});
  cv.addEventListener('mouseleave',()=>{CHARTPRO.hover=null;CHARTPRO.dragging=false;cproDraw()});
  cv.addEventListener('mousedown',e=>{if(CHARTPRO.tool==='cursor'){const q=pt(e);
    /* selection first */
    const sc=cv._sc,dr=CHARTPRO.list();let hit=null;
    dr.forEach((d,idx)=>{const near=(pp,ii)=>Math.abs(sc.p2y(pp)-q.py)<16&&(ii==null||Math.abs(sc.b2x(ii)-q.px)<60);
      if(d.t==='hline'&&Math.abs(sc.p2y(d.p1.p)-q.py)<10)hit=idx;
      else if(d.p1&&near(d.p1.p,d.p1.i))hit=idx;
      else if(d.p2&&near(d.p2.p,d.p2.i))hit=idx});
    if(hit!=null){CHARTPRO.sel=hit;cproDraw();return}
    CHARTPRO.sel=null;CHARTPRO.dragging=true;CHARTPRO.dragX=q.px;CHARTPRO.dragOff=CHARTPRO.view.off;cv.style.cursor='grabbing'}});
  window.addEventListener('mouseup',()=>{if(CHARTPRO.dragging){CHARTPRO.dragging=false;const cv2=document.getElementById('cp-main');if(cv2)cv2.style.cursor='crosshair';cproDraw()}});
  cv.addEventListener('wheel',e=>{e.preventDefault();const v=CHARTPRO.view;
    v.n=Math.round(v.n*(e.deltaY>0?1.12:0.88));cproClampView(cproSeries().length);cproDraw()},{passive:false});
  cv.addEventListener('click',e=>{const q=pt(e);
    /* machine-zone click → four questions */
    if(CHARTPRO.tool==='cursor'&&cv._zones){const z=cv._zones.find(z2=>q.px>=z2.x&&q.px<=z2.x+z2.w&&q.py>=z2.y&&q.py<=z2.y+z2.h);
      if(z){CMD.run('zone.inspect',z.id);return}}
    if(CHARTPRO.tool==='cursor')return;
    const need={trend:2,hline:1,zone:2,fib:2,measure:2,pos:3,note:1}[CHARTPRO.tool];
    CHARTPRO.pend.push({i:q.i,p:q.p});
    if(CHARTPRO.pend.length>=need){
      const[p1,p2,p3]=CHARTPRO.pend;
      if(CHARTPRO.tool==='note'){
        UI.modal('✎ NOTE at '+p1.p.toFixed(2),'<input id="cp-note" class="inp" placeholder="e.g. LPS forming — watch for SOS volume" maxlength="60">',
          '<button class="btn" data-cmd="ui.closeModal">Cancel</button><button class="btn pri" data-cmd="cpro.note.save">Place note</button>');
        CHARTPRO._notePend={p1};CHARTPRO.pend=[];return}
      const d={t:CHARTPRO.tool,p1,p2,p3};
      CHARTPRO.list().push(d);CHARTPRO.pend=[];
      if(d.t==='pos'){const rr=Math.abs(p3.p-p1.p)/Math.abs(p1.p-p2.p);
        SVR.audit('HUMAN (owner)','chart','Position tool: entry '+p1.p.toFixed(2)+' stop '+p2.p.toFixed(2)+' target '+p3.p.toFixed(2)+' = '+U.fmt(rr,2)+'R — '+(rr>=ck('risk.min_rr')?'gate would PASS':'SUB-'+ck('risk.min_rr')+'R, gate would BLOCK'));
        UI.toast(U.fmt(rr,2)+'R plan sketched — '+(rr>=ck('risk.min_rr')?'clears the 5R floor. Build it properly in Decisions → Trade Builder.':'below the 5R floor. The chart says no before the desk has to.'),rr>=ck('risk.min_rr')?'ok':'warn','POSITION TOOL')}
      cproDraw()
    }else cproDraw();
  });
}

document.addEventListener('keydown',e=>{
  if(S.domain!=='research'||S.ws!=='chart'||e.target.matches('input,select,textarea')||e.metaKey||e.ctrlKey)return;
  const map={t:'trend',l:'hline',z:'zone',b:'fib',r:'measure',p:'pos',x:'note'};
  const k=e.key.toLowerCase();
  if(map[k]){CHARTPRO.tool=map[k];CHARTPRO.pend=[];render();return}
  if(e.key==='Escape'&&CHARTPRO.tool!=='cursor'){CHARTPRO.tool='cursor';CHARTPRO.pend=[];render();return}
  if((e.key==='Delete'||e.key==='Backspace')&&CHARTPRO.sel!=null){CMD.run('cpro.del')}
});
CHARTX.ema200=false;

/* ═══════════ ENGINE · demo heartbeat — one loop, no decorator towers ═══════════
   The legacy stacked 13 render wrappers and two competing 1s intervals.
   Here: ONE 2s tick that mutates state, then targeted DOM patches. */
const ENGINE={
  n:0,
  tick(){this.n++;S.tick=this.n;CLOCK.tick();
    /* drift promoted symbols (seeded stream — deterministic session) */
    SYMS.forEach(s=>{const d=(RNG.r()-0.492)*0.0011;s.px*=(1+d);s.chg+=d*100});
    TAPE.forEach(t=>{t[1]*=(1+(RNG.r()-0.5)*0.0006)});
    /* packet TTLs — expiry is a hard transition */
    PACKETS.forEach(p=>{if(p.state==='READY_FOR_HUMAN'||p.state==='RISK_BLOCKED'){p.ttl-=2;
      if(p.ttl===300)pushAlert('P1',p.id+' expires in 5:00 — evidence goes stale (GOV-021)','decisions.packet',p.id);
      if(p.ttl<=0){p.ttl=0;p.state='EXPIRED';SVR.audit('SVR PacketFSM','packet',p.id+' EXPIRED — TTL exceeded, unjudged. Auto-reopen on same-hash fresh trigger is LS-track (AUT-115).');pushAlert('P1',p.id+' EXPIRED unjudged','decisions.queue')}}});
    /* open positions drift */
    if(this.n%3===0)POSITIONS.forEach(p=>{if(p.fsm==='MANAGING')p.uR+=(RNG.r()-0.47)*0.03});
    if(this.n%4===0)S.dayPnl+=(RNG.r()-0.46)*9;
    /* ambient ledger telemetry */
    if(this.n%9===0){const seat=RNG.pick(SEATS.filter(s=>['15s','30s','1m','5m','10m'].includes(s.cad)));
      SVR.audit(seat.id+' '+seat.nm,'telemetry',RNG.pick(['heartbeat OK — lane clean, schema valid','cadence sweep complete — no anomalies','freshness stamp written to consciousness state','universe delta processed — no promotions this cycle']))}
    if(typeof blotterStep==='function')blotterStep(this.n);
    if(S.domain==='system'&&S.ws==='autonomy'&&S.autonomyLab&&this.n%4===0)render();
    /* targeted patches — full render only if user is on a live-updating view */
    renderTop();
    if(S.domain==='decisions'){const el=document.getElementById('pk-ttl');if(el){const p=pktBy(S.packet);if(p)el.textContent=fmtTTL(p)}}
    if((S.domain==='markets'&&(S.ws==='regime'||S.ws==='watch'))&&this.n%6===0)render();
    if(S.domain==='system'&&S.ws==='audit'&&this.n%9===0)render();
  },
  start(){setInterval(()=>{try{this.tick()}catch(e){console.error('tick',e)}},2000)},
};

/* ═══════════ BOOT ═══════════ */
(function boot(){
  document.title='ATLAS Prime — Decision OS · DEMO';
  render();
  INTEGRITY.run();
  BOOTTEST.run();
  ENGINE.start();
  setTimeout(()=>UI.toast('DEMO session — seeded, deterministic (seed '+ck('demo.seed')+'). Synthetic data, no broker, no live claims. Press ? for keys, ⌘K to jump.','','ATLAS PRIME V11'),500);
  SVR.audit('SYSTEM','boot','ATLAS Prime V11 booted — 7 domains · '+Object.keys(VIEWS).length+' workspaces · '+Object.keys(CMD.reg).length+' registered commands · integrity '+INTEGRITY.results.pass+'/'+INTEGRITY.results.total);
})();

</script>
