<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071019">
<meta name="color-scheme" content="dark">
<title>ATLAS AI TRADER — Professional Chart Studio V4</title>
<style>
/* ============ ATLAS DESIGN TOKENS — §5.2 (single source of truth) ============ */
:root{
  --bg0:#05070C; --bg1:#0A0E16; --bg2:#101624; --bg3:#161d2e;
  --line:rgba(148,163,184,.10); --line-strong:rgba(148,163,184,.22);
  --tx0:#E7ECF4; --tx1:#9AA6B8; --tx2:#5B6676;
  --long:#2DD4A7; --short:#F0546C; --warn:#E8B44C; --block:#FF3B4E;
  --info:#5CA8FF; --gate:#C9A34A; --paper:#8B7CF6;
  --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  --r6:6px; --r4:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--tx0);font-family:var(--body);font-size:12.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:rgba(92,168,255,.25)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--info);text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:var(--disp)}
button{font-family:var(--disp);cursor:pointer}
.tx1{color:var(--tx1)}.tx2{color:var(--tx2)}
.up{color:var(--long)}.dn{color:var(--short)}

/* ============ APP SHELL ============ */
#app{display:grid;grid-template-rows:44px 26px 1fr;grid-template-columns:196px 1fr;height:100vh;overflow:hidden}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg1);border-bottom:1px solid var(--line);z-index:40}
#side{background:var(--bg1);border-right:1px solid var(--line);overflow-y:auto;padding:8px 6px 20px}
#main{overflow-y:auto;background:var(--bg0);position:relative}
#view{padding:14px 16px 60px;max-width:1680px}
body.halted #app{box-shadow:inset 0 0 0 2px var(--block)}
body.livemode #topbar{box-shadow:inset 0 -2px 0 var(--gate)}

/* topbar pieces */
.brand{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:1.5px;color:var(--tx0);display:flex;align-items:center;gap:7px;margin-right:4px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--long);box-shadow:0 0 6px var(--long)}
.tb-sep{width:1px;height:20px;background:var(--line);flex:none}
.tb-stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tb-stat .k{font-size:9px;letter-spacing:.8px;color:var(--tx2);text-transform:uppercase;font-family:var(--disp)}
.tb-stat .v{font-size:12px;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
#clock{font-family:var(--mono);font-size:12px;color:var(--tx1)}
#phase{font-family:var(--disp);font-size:9.5px;letter-spacing:1px;color:var(--tx2)}

/* ============ CHIPS (StatusChip — LAW-014 enum-driven) ============ */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;padding:3px 8px;border-radius:var(--r4);border:1px solid;white-space:nowrap}
.chip .cd{width:5px;height:5px;border-radius:50%;background:currentColor}
.c-sim{color:var(--info);border-color:rgba(92,168,255,.35);background:rgba(92,168,255,.08)}
.c-paper{color:var(--paper);border-color:rgba(139,124,246,.4);background:rgba(139,124,246,.09)}
.c-live{color:var(--gate);border-color:rgba(201,163,74,.5);background:rgba(201,163,74,.1)}
.c-ok{color:var(--long);border-color:rgba(45,212,167,.35);background:rgba(45,212,167,.07)}
.c-warn{color:var(--warn);border-color:rgba(232,180,76,.4);background:rgba(232,180,76,.08)}
.c-block{color:var(--block);border-color:rgba(255,59,78,.45);background:rgba(255,59,78,.09)}
.c-info{color:var(--info);border-color:rgba(92,168,255,.35);background:rgba(92,168,255,.07)}
.c-mut{color:var(--tx2);border-color:var(--line-strong);background:var(--bg2)}
.c-gate{color:var(--gate);border-color:rgba(201,163,74,.5);background:rgba(201,163,74,.1)}

/* lifecycle chips (one FSM everywhere §4.8) */
.lc{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-weight:600;font-size:9.5px;letter-spacing:.5px;padding:2px 7px;border-radius:var(--r4);border:1px solid var(--line-strong);color:var(--tx2);background:var(--bg2)}
.lc::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.lc-SCANNING{color:var(--tx2)}
.lc-FORMING{color:var(--info);border-color:rgba(92,168,255,.35);background:rgba(92,168,255,.06)}
.lc-ARMED{color:var(--warn);border-color:rgba(232,180,76,.45);background:rgba(232,180,76,.08);animation:pulse 1s ease-in-out infinite}
.lc-TRIGGERED{color:var(--long);border-color:rgba(45,212,167,.45);background:rgba(45,212,167,.08);animation:pulse 1s ease-in-out infinite}
.lc-AWAITING_HUMAN{color:var(--gate);border-color:rgba(201,163,74,.5);background:rgba(201,163,74,.1)}
.lc-WORKING{color:var(--info)}
.lc-FILLED{color:var(--long)}
.lc-MANAGING{color:var(--long);border-color:rgba(45,212,167,.4)}
.lc-SCALING{color:var(--long)}
.lc-CLOSED{color:var(--tx1)}
.lc-AUDITED{color:var(--tx2)}
.lc-EXPIRED,.lc-REJECTED{color:var(--short);border-color:rgba(240,84,108,.4)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,180,76,0)}50%{box-shadow:0 0 6px 0 currentColor}}
@media (prefers-reduced-motion:reduce){.lc-ARMED,.lc-TRIGGERED{animation:none}.rail-item{animation:none!important}*{transition:none!important}}

/* RuleTag — provenance chip */
.rtag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.4px;color:var(--info);background:rgba(92,168,255,.08);border:1px solid rgba(92,168,255,.22);border-radius:3px;padding:1px 5px;cursor:help;position:relative}
.rtag.law{color:var(--gate);background:rgba(201,163,74,.08);border-color:rgba(201,163,74,.3)}
.rtag.det{color:var(--paper);background:rgba(139,124,246,.08);border-color:rgba(139,124,246,.25)}
.rtag:hover::after{content:attr(data-prov);position:absolute;left:0;top:calc(100% + 4px);background:var(--bg3);border:1px solid var(--line-strong);color:var(--tx1);font-size:10px;padding:6px 8px;border-radius:var(--r4);white-space:pre;z-index:100;letter-spacing:0}

/* ============ NAV ============ */
.nav-h{font-family:var(--disp);font-size:9px;letter-spacing:1.4px;color:var(--tx2);text-transform:uppercase;padding:10px 10px 4px}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--tx1);font-family:var(--body);font-size:12px;font-weight:450;padding:6px 10px;border-radius:var(--r4);border-left:2px solid transparent;transition:background .12s,color .12s}
.nav:hover{background:var(--bg2);color:var(--tx0)}
.nav.on{background:var(--bg2);color:var(--tx0);border-left-color:var(--info)}
.nav .nid{font-family:var(--mono);font-size:9px;color:var(--tx2);width:20px;flex:none}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:9.5px;background:rgba(201,163,74,.15);color:var(--gate);border:1px solid rgba(201,163,74,.35);padding:0 5px;border-radius:3px}
.nav .tierlbl{margin-left:auto;font-family:var(--mono);font-size:8px;color:var(--tx2)}

/* ============ PANELS / GRID ============ */
.panel{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r6);margin-bottom:12px}
.panel>.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.panel>.ph .t{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--tx1)}
.panel>.ph .sub{font-size:10.5px;color:var(--tx2)}
.panel>.pb{padding:12px}
.panel>.pb.tight{padding:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1fr 2fr}
@media(max-width:1100px){.g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr}}

/* stat blocks */
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r4);padding:9px 11px}
.stat .k{font-size:9px;letter-spacing:.9px;color:var(--tx2);text-transform:uppercase;font-family:var(--disp);display:flex;gap:6px;align-items:center}
.stat .v{font-size:16px;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:3px}
.stat .s{font-size:10px;color:var(--tx2);margin-top:2px}

/* ============ TABLES (28/36/44 row heights) ============ */
table{width:100%;border-collapse:collapse}
th{font-family:var(--disp);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg1);z-index:2}
td{padding:0 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx1);white-space:nowrap}
tr.dense td{height:28px}tr.std td{height:36px}tr.comf td{height:44px}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--bg2)}
tbody tr.click{cursor:pointer}
td.r,th.r{text-align:right}

/* ============ BUTTONS ============ */
.btn{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.6px;padding:7px 14px;border-radius:var(--r4);border:1px solid var(--line-strong);background:var(--bg2);color:var(--tx0);transition:all .13s}
.btn:hover{background:var(--bg3);border-color:rgba(148,163,184,.35)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:10px}
.btn.pri{background:rgba(92,168,255,.12);border-color:rgba(92,168,255,.4);color:var(--info)}
.btn.pri:hover{background:rgba(92,168,255,.2)}
.btn.ok{background:rgba(45,212,167,.1);border-color:rgba(45,212,167,.4);color:var(--long)}
.btn.ok:hover{background:rgba(45,212,167,.18)}
.btn.warn{background:rgba(232,180,76,.1);border-color:rgba(232,180,76,.4);color:var(--warn)}
.btn.danger{background:rgba(240,84,108,.1);border-color:rgba(240,84,108,.4);color:var(--short)}
.btn.danger:hover{background:rgba(240,84,108,.2)}
.btn.gate{background:rgba(201,163,74,.12);border-color:rgba(201,163,74,.5);color:var(--gate)}
.btn.gate:hover{background:rgba(201,163,74,.22)}

/* ============ DECISION BAR (C2) ============ */
.decbar{position:sticky;bottom:0;background:var(--bg1);border-top:1px solid var(--line-strong);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:10;border-radius:0 0 var(--r6) var(--r6)}
.decbar .btn{min-height:40px}

/* ============ VOTES / DISSENT ============ */
.vote{display:flex;gap:9px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:flex-start}
.vote:last-child{border-bottom:none}
.vote .vseat{font-family:var(--mono);font-size:9.5px;color:var(--tx2);width:96px;flex:none;padding-top:1px}
.vote .vtxt{font-size:11.5px;color:var(--tx1);line-height:1.5}
.vote .vverdict{margin-left:auto;flex:none}
.dissent{background:rgba(232,180,76,.07);border:1px solid rgba(232,180,76,.35);border-radius:var(--r4);padding:9px 11px;margin-bottom:10px}
.dissent .dh{font-family:var(--disp);font-size:9.5px;letter-spacing:1px;color:var(--warn);text-transform:uppercase;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.blockbox{background:rgba(255,59,78,.07);border:1px solid rgba(255,59,78,.4);border-radius:var(--r4);padding:9px 11px;margin-bottom:10px}
.blockbox .dh{font-family:var(--disp);font-size:9.5px;letter-spacing:1px;color:var(--block);text-transform:uppercase;margin-bottom:4px}

/* ============ LIVE RAIL (C3 — signature element) ============ */
.rail{position:relative;padding-left:22px}
.rail::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line-strong)}
.rail-item{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r4);padding:8px 11px;margin-bottom:8px;animation:landIn .35s ease-out}
.rail-item::before{content:'';position:absolute;left:-18px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--info);box-shadow:0 0 0 3px var(--bg0)}
.rail-item.pass::before{background:var(--long)}
.rail-item.block::before{background:var(--block);box-shadow:0 0 8px var(--block),0 0 0 3px var(--bg0)}
.rail-item.advisory::before{background:var(--warn)}
.rail-item.pending{opacity:.45;border-style:dashed}
.rail-item.pending::before{background:var(--tx2)}
.rail-item .rh{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.rail-item .rseat{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.5px}
.rail-item .rstep{font-family:var(--mono);font-size:9px;color:var(--tx2)}
.rail-item .rtime{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--tx2)}
.rail-item .rbody{font-size:11px;color:var(--tx1);line-height:1.45}
.rail-item.block{border-color:rgba(255,59,78,.45);background:rgba(255,59,78,.05)}
@keyframes landIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ============ SEAT CARDS (C4) ============ */
.seat{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r6);padding:10px 12px;cursor:pointer;transition:border-color .13s,background .13s}
.seat:hover{border-color:var(--line-strong);background:var(--bg2)}
.seat .sh{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.seat .sid{font-family:var(--mono);font-size:9px;color:var(--tx2)}
.seat .snm{font-family:var(--disp);font-weight:600;font-size:11.5px}
.seat .hb{width:6px;height:6px;border-radius:50%;background:var(--long);margin-left:auto}
.seat.stale .hb{background:var(--warn)}
.seat.err .hb{background:var(--block)}
.seat .sop{font-size:10.5px;color:var(--tx1);line-height:1.4;min-height:29px}
.seat .sft{display:flex;gap:10px;margin-top:6px;font-family:var(--mono);font-size:9px;color:var(--tx2)}

/* ============ PACKET SECTIONS (C2 center) ============ */
.psec{border:1px solid var(--line);border-radius:var(--r4);margin-bottom:8px;background:var(--bg1)}
.psec>.psh{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer;user-select:none}
.psec>.psh .pnum{font-family:var(--mono);font-size:9px;color:var(--tx2);width:24px}
.psec>.psh .pt{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx1)}
.psec>.psh .pst{margin-left:auto}
.psec>.psb{padding:4px 12px 11px;font-size:11.5px;color:var(--tx1);line-height:1.55;border-top:1px solid var(--line)}
.psec.missing{border-color:rgba(232,180,76,.4)}
.psec.missing>.psh .pt{color:var(--warn)}
.kvrow{display:flex;gap:8px;padding:3px 0;font-size:11.5px}
.kvrow .k{color:var(--tx2);width:150px;flex:none}
.kvrow .v{font-family:var(--mono);color:var(--tx0)}

/* 5R proof table */
.fiver{width:100%;border:1px solid rgba(201,163,74,.35);border-radius:var(--r4);overflow:hidden;margin:6px 0}
.fiver .fr{display:flex;border-bottom:1px solid var(--line)}
.fiver .fr:last-child{border-bottom:none}
.fiver .fk{width:190px;flex:none;padding:6px 10px;background:rgba(201,163,74,.06);color:var(--tx1);font-size:10.5px}
.fiver .fv{padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--tx0)}

/* ============ LEDGER ============ */
.lrow{display:flex;gap:10px;align-items:baseline;padding:5px 12px;border-bottom:1px solid var(--line);font-size:11px}
.lrow:hover{background:var(--bg2)}
.lrow .lt{font-family:var(--mono);font-size:9.5px;color:var(--tx2);width:60px;flex:none}
.lrow .lact{font-family:var(--mono);font-size:9.5px;width:120px;flex:none}
.lrow .lkind{font-family:var(--disp);font-size:8.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--tx2);width:88px;flex:none}
.lrow .lmsg{color:var(--tx1)}

/* ============ DRAWER / PALETTE / MODAL ============ */
#scrim{position:fixed;inset:0;background:rgba(3,5,9,.6);opacity:0;pointer-events:none;transition:opacity .15s;z-index:60}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:-460px;width:440px;max-width:92vw;height:100vh;background:var(--bg1);border-left:1px solid var(--line-strong);z-index:70;transition:right .18s ease-out;display:flex;flex-direction:column}
#drawer.on{right:0}
#drawer .dh2{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#drawer .db2{flex:1;overflow-y:auto;padding:12px 14px}
#palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%) scale(.98);width:560px;max-width:92vw;background:var(--bg1);border:1px solid var(--line-strong);border-radius:var(--r6);z-index:80;opacity:0;pointer-events:none;transition:all .13s}
#palette.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
#palette input{width:100%;background:var(--bg2);border:none;border-bottom:1px solid var(--line);color:var(--tx0);font-family:var(--body);font-size:13px;padding:12px 14px;outline:none;border-radius:var(--r6) var(--r6) 0 0}
#palette .plist{max-height:320px;overflow-y:auto;padding:6px}
.pitem{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:var(--r4);cursor:pointer;font-size:12px;color:var(--tx1)}
.pitem.sel,.pitem:hover{background:var(--bg2);color:var(--tx0)}
.pitem .pk{font-family:var(--mono);font-size:9px;color:var(--tx2);width:52px;flex:none}
#modal-scrim{position:fixed;inset:0;background:rgba(3,5,9,.7);z-index:90;display:none;align-items:center;justify-content:center}
#modal-scrim.on{display:flex}
#modal{width:520px;max-width:92vw;max-height:82vh;overflow-y:auto;background:var(--bg1);border:1px solid var(--line-strong);border-radius:var(--r6)}
#modal .mh{padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.7px;display:flex;align-items:center;gap:8px}
#modal .mb{padding:14px}
#modal .mf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

/* ============ BANNERS / EMPTY / STALE ============ */
.banner{display:flex;gap:9px;align-items:center;padding:9px 12px;border-radius:var(--r4);font-size:11.5px;margin-bottom:12px;border:1px solid}
.banner.warn{background:rgba(232,180,76,.07);border-color:rgba(232,180,76,.4);color:var(--warn)}
.banner.block{background:rgba(255,59,78,.07);border-color:rgba(255,59,78,.45);color:var(--block)}
.banner.info{background:rgba(92,168,255,.06);border-color:rgba(92,168,255,.3);color:var(--info)}
.empty{padding:36px 20px;text-align:center;color:var(--tx2)}
.empty .eh{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--tx1);margin-bottom:5px}
.empty .es{font-size:11.5px;line-height:1.5}
.stale-num{text-decoration:line-through;opacity:.55}

/* ============ KILL SWITCH ============ */
#kill{position:relative;overflow:hidden;font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:1.2px;padding:7px 14px;border-radius:var(--r4);border:1px solid rgba(255,59,78,.5);background:rgba(255,59,78,.08);color:var(--block);user-select:none}
#kill .fill{position:absolute;inset:0;background:rgba(255,59,78,.3);transform:scaleX(0);transform-origin:left;transition:transform .05s linear}
#kill span{position:relative;z-index:1}
#kill.armed{background:var(--block);color:#fff}
#resume{display:none}
body.halted #kill{display:none}
body.halted #resume{display:inline-block}

/* ============ ZONE POPOVER (Q5 doctrine card) ============ */
#zonepop{position:fixed;width:330px;background:var(--bg1);border:1px solid var(--line-strong);border-radius:var(--r6);z-index:75;display:none;font-size:11.5px}
#zonepop .zh{padding:9px 12px;border-bottom:1px solid var(--line);font-family:var(--disp);font-weight:600;font-size:11px;display:flex;gap:8px;align-items:center}
#zonepop .zb{padding:10px 12px}
#zonepop .zq{margin-bottom:8px}
#zonepop .zq .q{font-family:var(--disp);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);margin-bottom:2px}
#zonepop .zq .a{color:var(--tx1);line-height:1.5}

/* ============ DIFF VIEW (C6/C7) ============ */
.diff{font-family:var(--mono);font-size:11px;background:var(--bg0);border:1px solid var(--line);border-radius:var(--r4);overflow:hidden}
.diff .dl{padding:3px 12px;white-space:pre-wrap}
.diff .dl.add{background:rgba(45,212,167,.08);color:var(--long)}
.diff .dl.del{background:rgba(240,84,108,.08);color:var(--short)}
.diff .dl.ctx{color:var(--tx2)}

/* ============ TABS / MISC ============ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;padding:8px 14px;background:none;border:none;color:var(--tx2);border-bottom:2px solid transparent}
.tab.on{color:var(--tx0);border-bottom-color:var(--info)}
kbd{font-family:var(--mono);font-size:9.5px;background:var(--bg2);border:1px solid var(--line-strong);border-radius:3px;padding:1px 5px;color:var(--tx1)}
.meter{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--info);border-radius:3px}
.pill{font-family:var(--mono);font-size:9.5px;color:var(--tx2)}
canvas{display:block}
.sparkwrap{display:inline-block;vertical-align:middle}
.freshstamp{font-family:var(--mono);font-size:9px;color:var(--tx2);display:inline-flex;gap:4px;align-items:center}
.freshstamp::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--long)}
.freshstamp.stale::before{background:var(--warn)}
/* ============ EXTENSION LAYER — depth pass ============ */
#tape{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--bg0);border-bottom:1px solid var(--line);overflow:hidden;font-family:var(--mono);font-size:10.5px;color:var(--tx1)}
#side{grid-row:3}#main{grid-row:3}
.tp{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.tp .s{color:var(--tx2);font-family:var(--disp);font-size:9px;letter-spacing:.8px}
#sessprog{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:9px}
#sessprog .bar{width:120px;height:3px;background:var(--bg2);border-radius:2px;overflow:hidden}
#sessprog .bar i{display:block;height:100%;background:var(--info)}
.kicker{font-family:var(--disp);font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--tx2)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:3px}
/* toasts */
#toasts{position:fixed;right:14px;bottom:14px;z-index:95;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--bg2);border:1px solid var(--line-strong);border-left:3px solid var(--info);border-radius:var(--r4);padding:9px 12px;font-size:11.5px;color:var(--tx1);animation:landIn .25s ease-out;display:flex;gap:8px;align-items:center}
.toast.ok{border-left-color:var(--long)}.toast.warn{border-left-color:var(--warn)}.toast.gate{border-left-color:var(--gate)}.toast.block{border-left-color:var(--block)}
/* C1 queue keyboard selection + filters */
.qsel{box-shadow:inset 0 0 0 1px var(--info)!important}
.filterbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fbtn{font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;padding:4px 9px;border-radius:var(--r4);border:1px solid var(--line-strong);background:var(--bg1);color:var(--tx2);cursor:pointer}
.fbtn.on{color:var(--info);border-color:rgba(92,168,255,.45);background:rgba(92,168,255,.08)}
.exp-soon{border-left:2px solid var(--block)!important}
/* sortable table headers */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--tx1)}
th.sort-asc::after{content:' ▲';font-size:8px}th.sort-desc::after{content:' ▼';font-size:8px}
/* replay scrubber */
.scrubwrap{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r4);padding:10px 14px;margin-bottom:12px}
input[type=range].scrub{-webkit-appearance:none;flex:1;height:4px;background:var(--bg3);border-radius:2px;outline:none}
input[type=range].scrub::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gate);border:2px solid var(--bg0);cursor:pointer}
/* telegram pocket-gate mock */
.tgcard{max-width:360px;background:#0f1520;border:1px solid var(--line-strong);border-radius:12px;padding:12px;font-size:11.5px}
.tgcard .tgh{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-family:var(--disp);font-weight:600}
.tgbtns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
.tgbtn{background:rgba(92,168,255,.1);border:1px solid rgba(92,168,255,.3);color:var(--info);border-radius:6px;padding:6px 4px;text-align:center;font-family:var(--disp);font-size:9.5px;font-weight:600;letter-spacing:.4px}
.tgbtn.g{background:rgba(201,163,74,.1);border-color:rgba(201,163,74,.4);color:var(--gate)}
.tgbtn.r{background:rgba(240,84,108,.08);border-color:rgba(240,84,108,.35);color:var(--short)}
/* dependency map */
.depmap{background:var(--bg0);border:1px solid var(--line);border-radius:var(--r4)}
/* correlation matrix */
.hmwrap{display:grid;gap:2px}
.hmcell{height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9.5px;border-radius:2px;color:var(--tx0)}
.hmlbl{font-family:var(--mono);font-size:9px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
/* shortcuts overlay grid */
.scgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
.scrow{display:flex;justify-content:space-between;gap:14px;padding:4px 0;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--tx1)}
/* FSM timeline (Q8) */
.fsmtl{display:flex;gap:0;align-items:center;margin:8px 0 2px;flex-wrap:wrap}
.fsmtl .st{font-family:var(--mono);font-size:9px;padding:3px 8px;border:1px solid var(--line);color:var(--tx2);background:var(--bg2)}
.fsmtl .st:first-child{border-radius:4px 0 0 4px}.fsmtl .st:last-child{border-radius:0 4px 4px 0}
.fsmtl .st.done{color:var(--long);border-color:rgba(45,212,167,.35)}
.fsmtl .st.now{color:var(--tx0);background:rgba(92,168,255,.12);border-color:rgba(92,168,255,.45)}
/* decision kbd hints */
.decbar .btn kbd{margin-right:6px;background:rgba(0,0,0,.25)}
/* section anchors rail (C2 center TOC) */
.toc{position:sticky;top:0;background:var(--bg1);border-bottom:1px solid var(--line);padding:6px 4px;display:flex;gap:3px;flex-wrap:wrap;z-index:3;margin-bottom:8px}
.toc a{font-family:var(--mono);font-size:9px;color:var(--tx2);padding:2px 5px;border:1px solid var(--line);border-radius:3px}
.toc a.miss{color:var(--warn);border-color:rgba(232,180,76,.4)}
.toc a:hover{color:var(--tx0)}
/* mini bars */
.bars{display:flex;align-items:flex-end;gap:3px;height:44px}
.bars i{flex:1;background:rgba(92,168,255,.5);border-radius:2px 2px 0 0;min-width:6px}
/* live dot */
.livedot{width:6px;height:6px;border-radius:50%;background:var(--long);display:inline-block;animation:pulse 1.4s infinite}
/* ---- market microstructure layer ---- */
@keyframes flup{0%{background:rgba(45,212,167,.28)}100%{background:transparent}}
@keyframes fldn{0%{background:rgba(240,84,108,.28)}100%{background:transparent}}
.fl-up{animation:flup .55s ease-out}.fl-dn{animation:fldn .55s ease-out}
.book{font-family:var(--mono);font-size:10.5px}
.book .br{display:grid;grid-template-columns:1fr 74px 74px 1fr;gap:0;align-items:center;height:19px}
.book .bsz{position:relative;text-align:right;padding-right:7px;color:var(--tx2)}
.book .asz{position:relative;text-align:left;padding-left:7px;color:var(--tx2)}
.book .bsz i,.book .asz i{position:absolute;top:2px;bottom:2px;z-index:0;border-radius:2px}
.book .bsz i{right:0;background:rgba(45,212,167,.14)}
.book .asz i{left:0;background:rgba(240,84,108,.14)}
.book .bsz span,.book .asz span{position:relative;z-index:1}
.book .bpx{text-align:right;padding-right:8px;color:var(--long)}
.book .apx{text-align:left;padding-left:8px;color:var(--short)}
.book .mid{grid-column:1/5;display:flex;justify-content:center;gap:10px;padding:3px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--tx1);margin:2px 0}
.tns{font-family:var(--mono);font-size:10px;line-height:1.75;max-height:178px;overflow:hidden}
.tns .tr2{display:grid;grid-template-columns:52px 1fr 56px 44px;gap:6px}
.tns .tr2:first-child{animation:landIn .25s ease-out}
.frozen{position:absolute;top:10px;right:12px;font-family:var(--disp);font-size:9px;letter-spacing:1px;color:var(--warn);border:1px solid rgba(232,180,76,.45);border-radius:3px;padding:3px 7px;background:rgba(232,180,76,.07)}
.ba{font-family:var(--mono);font-size:11px}
.ba b{color:var(--long);font-weight:500}.ba i{color:var(--short);font-style:normal}
/* ---- MIND layer ---- */
.cortex{fill:rgba(16,22,36,.9);stroke:rgba(91,102,118,.55)}
.neuron{cursor:pointer}
.neuron circle{fill:#101624;stroke:#5B6676;stroke-width:1.2}
.neuron.hot circle{stroke:var(--long);filter:drop-shadow(0 0 5px rgba(45,212,167,.5))}
.neuron.veto circle{stroke:var(--gate)}
.neuron text{fill:#9AA6B8;font-family:IBM Plex Mono;font-size:8.5px}
.axon{stroke:rgba(92,168,255,.16);stroke-width:1.1;fill:none}
.axon.fire{stroke:rgba(92,168,255,.85);stroke-width:1.8;filter:drop-shadow(0 0 4px rgba(92,168,255,.6))}
#tbus{font-family:var(--mono);font-size:10.5px;line-height:1.8;max-height:200px;overflow:hidden}
#tbus .tb1{display:flex;gap:8px}#tbus .tb1:first-child{animation:landIn .3s ease-out}
#tbus .frm{color:var(--info);min-width:150px}#tbus .to{color:var(--tx2);min-width:118px}
.stageL{display:flex;gap:0;align-items:stretch;margin:10px 0 14px;flex-wrap:wrap}
.stg{flex:1;min-width:104px;border:1px solid var(--line);background:var(--bg1);padding:9px 10px;position:relative}
.stg:first-child{border-radius:6px 0 0 6px}.stg:last-child{border-radius:0 6px 6px 0}
.stg .amt{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--tx0)}
.stg .req{font-size:9.5px;color:var(--tx2);margin-top:3px;line-height:1.5}
.stg.done{border-color:rgba(45,212,167,.4);background:rgba(45,212,167,.05)}
.stg.now{border-color:var(--gate);background:rgba(201,163,74,.07);box-shadow:0 0 0 1px rgba(201,163,74,.35)}
.stg .tag{position:absolute;top:-9px;left:8px;font-family:var(--disp);font-size:8px;letter-spacing:1px;padding:1px 6px;border-radius:3px;background:var(--bg2);border:1px solid var(--line-strong);color:var(--tx2)}
.stg.now .tag{color:var(--gate);border-color:rgba(201,163,74,.5)}
.apicard{border:1px solid var(--line);border-radius:var(--r6);background:var(--bg1);padding:11px 12px}
.apicard .hd{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.apicard .nm{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--tx0)}
.ep{font-family:var(--mono);font-size:9.5px;color:var(--tx2);padding:2px 0;border-bottom:1px dashed rgba(91,102,118,.25)}
.ep b{color:var(--info);font-weight:500;margin-right:6px}
.key{font-family:var(--mono);font-size:9.5px;color:var(--tx2);letter-spacing:1px}
.qcon{background:var(--bg0);border:1px solid var(--line-strong);border-radius:var(--r4);padding:10px;font-family:var(--mono);font-size:10.5px;color:var(--tx1)}
.qcon .ln{color:var(--long)}.qcon .kw{color:var(--info)}.qcon .cm{color:var(--tx2)}
.playgrid{display:grid;grid-template-columns:150px repeat(4,1fr);gap:3px;font-family:var(--mono);font-size:9.5px}
.playgrid .hd2{color:var(--tx2);font-family:var(--disp);font-size:8.5px;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;padding:4px 0}
.playgrid .rw{color:var(--tx1);display:flex;align-items:center}
.pcell{height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px;color:var(--tx0);cursor:pointer}
.pcell small{font-size:8px;color:rgba(231,236,244,.65)}
.ttool{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.ttool .fbtn.on{color:var(--gate);border-color:rgba(201,163,74,.5);background:rgba(201,163,74,.08)}
.lesson textarea,.lesson input{width:100%;background:var(--bg2);border:1px solid var(--line-strong);color:var(--tx0);font-family:var(--body);font-size:11.5px;padding:8px 9px;border-radius:4px;margin:3px 0 8px}
.lesson textarea{font-family:var(--mono);font-size:11px;min-height:60px;resize:vertical}
.lesson label{font-family:var(--disp);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx2)}
.aibubble{background:rgba(92,168,255,.06);border:1px solid rgba(92,168,255,.3);border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--tx1);line-height:1.6}
.kbrow{display:flex;gap:10px;align-items:baseline;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.kbrow:hover{background:rgba(92,168,255,.04)}
.kbrow .fp{font-family:var(--mono);font-size:10px;color:var(--tx1);min-width:260px}
.kbrow .ft{font-size:10.5px;color:var(--tx2);flex:1}
.lanechip{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid var(--line-strong);color:var(--tx2);background:var(--bg2)}
/* ---- Vision & Memory layer ---- */
.tfconf{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tfchip{font-family:var(--mono);font-size:10px;padding:4px 9px;border-radius:4px;border:1px solid var(--line-strong);background:var(--bg1);display:flex;gap:5px;align-items:center}
.tfchip b{font-family:var(--disp);font-size:9px;letter-spacing:.5px}
.tfchip.up{border-color:rgba(45,212,167,.4);background:rgba(45,212,167,.06)}
.tfchip.dn{border-color:rgba(240,84,108,.4);background:rgba(240,84,108,.06)}
.tfchip.neu{border-color:rgba(232,180,76,.35);background:rgba(232,180,76,.05)}
.vcap{border:1px solid var(--line);border-radius:var(--r6);background:var(--bg1);overflow:hidden}
.vcap .vhd{display:flex;gap:8px;align-items:center;padding:7px 10px;background:var(--bg2);border-bottom:1px solid var(--line)}
.vcap .vtf{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--tx0)}
.vcap .vind{margin-left:auto;display:flex;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--tx2)}
.vcap .vind b{color:var(--tx1);font-weight:500}
.vcap .vnote{padding:8px 10px;font-size:11px;color:var(--tx1);line-height:1.55;border-top:1px solid var(--line)}
.vcap .vnote .lens{color:var(--gate);font-family:var(--mono);font-size:9px;letter-spacing:.5px}
.doc{background:#0B0F17;border:1px solid var(--line-strong);border-radius:6px;padding:20px 24px;font-family:Georgia,'Times New Roman',serif;color:#D6DCE6;line-height:1.65;max-height:520px;overflow:auto}
.doc h1{font-family:var(--disp);font-size:18px;color:#fff;margin:0 0 4px;letter-spacing:-.2px}
.doc .meta{font-family:var(--mono);font-size:10px;color:var(--tx2);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.doc h2{font-family:var(--disp);font-size:13px;color:#9CC4FF;margin:16px 0 5px;letter-spacing:.3px}
.doc p{margin:5px 0;font-size:13px}
.doc .lv{font-family:var(--mono);font-size:11.5px;color:#C9A34A;background:rgba(201,163,74,.07);padding:2px 6px;border-radius:3px}
.doc ul{margin:5px 0;padding-left:20px}.doc li{font-size:12.5px;margin:3px 0}
.doc .verdict{margin-top:14px;padding:10px 12px;border-radius:5px;background:rgba(45,212,167,.06);border:1px solid rgba(45,212,167,.3);font-family:var(--body);font-size:12.5px;color:var(--tx0)}
.arcrow{display:grid;grid-template-columns:78px 54px 66px 130px 60px 96px 1fr 70px;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:11px}
.arcrow:hover{background:rgba(92,168,255,.04)}
.arcrow .out{font-family:var(--mono);font-weight:600}
.arcexp{background:var(--bg0);border:1px solid var(--line);border-radius:var(--r4);padding:12px;margin:2px 0 8px}
.dtag{font-family:var(--disp);font-size:8.5px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:3px}
.dtag.took{background:rgba(45,212,167,.14);color:var(--long);border:1px solid rgba(45,212,167,.35)}
.dtag.pass{background:rgba(92,168,255,.12);color:var(--info);border:1px solid rgba(92,168,255,.35)}
.dtag.rej{background:rgba(240,84,108,.1);color:var(--short);border:1px solid rgba(240,84,108,.3)}
.dtag.miss{background:rgba(232,180,76,.12);color:var(--warn);border:1px solid rgba(232,180,76,.4)}
.brainv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.chunkedit{background:var(--bg0);border:1px solid var(--line-strong);border-radius:var(--r4);width:100%;color:var(--tx1);font-family:var(--mono);font-size:11px;line-height:1.6;padding:11px;min-height:150px;resize:vertical}
.slstream .sli{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:var(--r4);background:var(--bg1);padding:9px 11px;margin-bottom:7px;animation:landIn .3s ease-out}
.slstream .sli.refine{border-left-color:var(--warn)}.slstream .sli.merge{border-left-color:var(--gate)}
.slstream .slh{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.slstream .slk{font-family:var(--disp);font-size:8.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--tx2)}
.autopulse{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--long)}
.chunklist{max-height:340px;overflow:auto}
.chunkli{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:10.5px}
.chunkli:hover{background:rgba(92,168,255,.04)}
.chunkli.sel{background:rgba(201,163,74,.07);box-shadow:inset 2px 0 0 var(--gate)}
/* ---- Vision Lab / Analysis Archive ---- */
.shot{border:1px solid var(--line);border-radius:var(--r6);background:var(--bg0);overflow:hidden;cursor:pointer;transition:border-color .15s}
.shot:hover{border-color:rgba(92,168,255,.5)}
.shot .cap{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg1);border-bottom:1px solid var(--line)}
.shot .tf{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--tx0);min-width:30px}
.shot .rd{font-size:9.5px;color:var(--tx2);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shot canvas{display:block;width:100%}
.biasdot{width:7px;height:7px;border-radius:50%;display:inline-block}
.notecol{font-family:var(--body);font-size:11.5px;color:var(--tx1);line-height:1.6}
.notecol h4{font-family:var(--disp);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx2);margin:10px 0 4px;font-weight:700}
.notecol .ind{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px}
.confl{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.cfl{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:3px;border:1px solid rgba(45,212,167,.35);color:var(--long);background:rgba(45,212,167,.06)}
.cfl.neg{border-color:rgba(240,84,108,.35);color:var(--short);background:rgba(240,84,108,.06)}
.cfl.neu{border-color:var(--line-strong);color:var(--tx2);background:var(--bg2)}

/* ============ PRECISION POLISH (every tab) ============ */
/* layered surfaces — a hairline top highlight so panels read as crafted, not flat */
.panel,.charcard,.apicard,.arccard,.plane,.seat,.stat{box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.panel{border-color:rgba(148,163,184,.13)}
/* tabular numerals everywhere numbers live — live ticks stop jittering column width */
.mono,td,.stat .v,.tb-stat .v,.fv,.fk,.vv,.cv2,.k,.v{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
/* button: real press feedback + gate hover */
.btn{transition:background .13s,border-color .13s,transform .06s,color .13s}
.btn:active{transform:translateY(1px)}
.btn.gate:hover{background:rgba(201,163,74,.16);border-color:rgba(201,163,74,.5)}
/* clickable surfaces get a clear, consistent affordance */
.seat:hover,.charcard:hover,.shot:hover,.arccard:hover{border-color:rgba(92,168,255,.4)}
tbody tr.click,tr.blotrow{cursor:pointer}
tbody tr.click:hover,tr.blotrow:hover{background:var(--bg2);box-shadow:inset 2px 0 0 var(--info)}
/* scrollbar: subtle, brightens on hover */
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.42)}
*{scrollbar-width:thin;scrollbar-color:var(--bg3) transparent}
/* inline links: consistent, quiet, clear on hover */
.pb a,.psb a,.aibubble a,.tx1 a,.tx2 a{color:var(--info);text-decoration:none;border-bottom:1px solid rgba(92,168,255,.28);transition:border-color .12s}
.pb a:hover,.psb a:hover,.tx2 a:hover{border-bottom-color:var(--info)}
/* sticky table header: faint shadow so it detaches cleanly while scrolling */
th{box-shadow:0 1px 0 var(--line)}
/* focus ring: crisp on the dark ground */
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
/* chips/tags sit on a shared baseline */
.chip,.lc,.pill,.pbtag{vertical-align:middle}
/* kicker: one consistent eyebrow treatment across tabs */
.kicker{font-family:var(--disp);font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--tx2);opacity:.7;margin-bottom:5px}
/* honor reduced-motion for the new transitions too */
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}

  radial-gradient(circle at 82% -10%,rgba(52,126,188,.12),transparent 34%),
  radial-gradient(circle at 30% 115%,rgba(56,225,180,.055),transparent 36%),
  var(--bg0)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.32;background-image:
  linear-gradient(rgba(105,180,255,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(105,180,255,.025) 1px,transparent 1px);
  background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 88%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.018;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,#fff 3px,#fff 3px)}

function genCandles(sym, n){
  n=n||96; seedTo(0xC0FFEE ^ hash8(sym).split('').reduce((a,c)=>a+c.charCodeAt(0),0));
  const base = symBy(sym)? symBy(sym).px : 100; const out=[]; let p = base*(1-0.018);
  for(let i=0;i<n;i++){
    const drift = i>n*0.55 ? 0.0009 : -0.0002;
    const o=p, c=p*(1+drift+rr(-0.0021,0.0023));
    const h=Math.max(o,c)*(1+rr(0.0002,0.0016)), l=Math.min(o,c)*(1-rr(0.0002,0.0016));
    const vol = rr(0.4,1.1) * (i===Math.floor(n*0.55)? 2.6 : 1);
    out.push({o,h,l,c,v:vol}); p=c;
  }
  // engineered sweep low + displacement at 55%
  const k=Math.floor(n*0.55); out[k].l *= 0.994; out[k].c = out[k].o*1.004; out[k].v=2.8;
  return out;
}
const ANNOT = {}; // annotation registry (schema #6 shape)
function annotFor(sym){
  if(ANNOT[sym]) return ANNOT[sym];
  const c = genCandles(sym); const px = c[c.length-1].c;
  ANNOT[sym] = { candles:c, zones:[
    {type:'FVG', dir:'bull', top:px*0.998, bot:px*0.9945, state:'live', det:'DET-041', why:'Displacement gap on 5m sweep-reclaim; first return untested.', inval:'5m close below gap low.', contract:'21DTE ~.40Δ call (spread must pass OPT-007).', timing:'CLEAN — first return inside killzone.'},
    {type:'OB', dir:'bull', top:px*0.9935, bot:px*0.990, state:'live', det:'DET-052', why:'Last down-candle before change in state of delivery.', inval:'Full-body trade-through.', contract:'Same as FVG plan; deeper entry improves R.', timing:'EARLY — valid only with 1m confirmation.'},
    {type:'POOL', dir:'sell', y:px*1.012, state:'live', det:'DET-044', label:'PDH / BSL', why:'Untaken buy-side pool = draw on liquidity.', inval:'Sweep-and-reject converts to resistance.', contract:'Target zone — trim T2 here.', timing:'—'},
    {type:'POOL', dir:'buy', y:px*0.988, state:'swept', det:'DET-044', label:'Asia low / SSL', why:'Swept 10:14 — engineered liquidity taken.', inval:'—', contract:'—', timing:'SPENT'},
    {type:'KZ', a:0.30, b:0.62, label:'NY AM killzone', det:'TIM-003'}
  ], plan: symBy(sym)&&symBy(sym).lc==='TRIGGERED' ? {entry:px*1.0002, stop:px*0.9863, t1:px*1.0107, t2:px*1.0163, t3:px*1.0333} : null };
  return ANNOT[sym];
}
function drawChart(cv, sym, opts){
  opts=opts||{}; const ctx=cv.getContext('2d');
  const W=cv.width=cv.clientWidth*2, H=cv.height=cv.clientHeight*2; ctx.scale(1,1);
  const A=annotFor(sym), C=A.candles;
  let mn=Infinity,mx=-Infinity; C.forEach(k=>{mn=Math.min(mn,k.l);mx=Math.max(mx,k.h);});
  if(A.plan){ mn=Math.min(mn,A.plan.stop*0.999); mx=Math.max(mx,A.plan.t3*1.001); }
  const pad=(mx-mn)*0.06; mn-=pad; mx+=pad;
  const X=i=> (i+0.5)/C.length*W, Y=p=> H-((p-mn)/(mx-mn))*H;
  ctx.fillStyle='#05070C'; ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='rgba(148,163,184,.07)'; ctx.lineWidth=1;
  for(let i=1;i<6;i++){ const y=H*i/6; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    ctx.fillStyle='rgba(155,166,184,.55)'; ctx.font='18px IBM Plex Mono'; ctx.fillText(fmt(mn+(mx-mn)*(1-i/6)), W-110, y-6); }
  // killzone shading
  A.zones.filter(z=>z.type==='KZ').forEach(z=>{ ctx.fillStyle='rgba(92,168,255,.045)';
    ctx.fillRect(W*z.a,0,W*(z.b-z.a),H);
    ctx.fillStyle='rgba(92,168,255,.5)'; ctx.font='16px Space Grotesk'; ctx.fillText(z.label, W*z.a+8, 24); });
  cv._zones=[];
  // FVG / OB boxes
  A.zones.filter(z=>z.type==='FVG'||z.type==='OB').forEach(z=>{
    const y1=Y(z.top), y2=Y(z.bot); const col = z.dir==='bull'?'45,212,167':'240,84,108';
    ctx.fillStyle='rgba('+col+',0.10)'; ctx.fillRect(W*0.55,y1,W*0.45,y2-y1);
    ctx.strokeStyle='rgba('+col+',0.45)'; ctx.setLineDash(z.state==='live'?[]:[6,5]);
    ctx.strokeRect(W*0.55,y1,W*0.45,y2-y1); ctx.setLineDash([]);

    ctx.fillText(z.type+' · '+z.det+' · '+z.state, W*0.55+8, y1+18);
    cv._zones.push({y1,y2,x1:W*0.55,x2:W,z});
  });
  // liquidity pools
  A.zones.filter(z=>z.type==='POOL').forEach(z=>{
    const y=Y(z.y); const col=z.state==='swept'?'91,102,118':'92,168,255';
    ctx.strokeStyle='rgba('+col+',.8)'; ctx.setLineDash([8,6]); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba('+col+',.9)'; ctx.font='15px IBM Plex Mono'; ctx.fillText(z.label+(z.state==='swept'?' (swept)':''), 10, y-6);
    cv._zones.push({y1:y-8,y2:y+8,x1:0,x2:W,z});
  });
  // candles
  const bw=Math.max(2, W/C.length*0.62);
  C.forEach((k,i)=>{ const x=X(i); const up=k.c>=k.o;
    ctx.strokeStyle=up?'rgba(45,212,167,.9)':'rgba(240,84,108,.9)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(x,Y(k.h)); ctx.lineTo(x,Y(k.l)); ctx.stroke();
    ctx.fillStyle=up?'#2DD4A7':'#F0546C'; const yo=Y(k.o), yc=Y(k.c);
    ctx.fillRect(x-bw/2, Math.min(yo,yc), bw, Math.max(2,Math.abs(yc-yo))); });
  // trade plan levels
  if(A.plan && opts.plan!==false){
    const P=A.plan; const lvl=(p,label,col)=>{ const y=Y(p);
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
      ctx.fillStyle=col; ctx.font='16px IBM Plex Mono'; ctx.fillText(label+' '+fmt(p), 10, y-6); };
    // R zones
    ctx.fillStyle='rgba(240,84,108,.06)'; ctx.fillRect(0,Y(P.entry),W,Y(P.stop)-Y(P.entry));
    ctx.fillStyle='rgba(45,212,167,.05)'; ctx.fillRect(0,Y(P.t3),W,Y(P.entry)-Y(P.t3));
    lvl(P.entry,'ENTRY','#C9A34A'); lvl(P.stop,'STOP','#F0546C');
    lvl(P.t1,'T1','#2DD4A7'); lvl(P.t2,'T2 (5R)','#2DD4A7'); lvl(P.t3,'T3','#2DD4A7');
  }
  // agent-confidence chips
  if(opts.conf!==false){ const chips=[['S12 SMC 0.86','92,168,255'],['S14 ICT 0.81','92,168,255'],['S26 5R ✓','201,163,74']];
    chips.forEach((c,i)=>{ ctx.fillStyle='rgba('+c[1]+',.12)'; const x=12, y=H-34-(i*30);
      ctx.fillRect(x,y,150,24); ctx.strokeStyle='rgba('+c[1]+',.4)'; ctx.strokeRect(x,y,150,24);
      ctx.fillStyle='rgba('+c[1]+',1)'; ctx.font='15px IBM Plex Mono'; ctx.fillText(c[0], x+8, y+17); }); }
}

/* kill switch: hold-to-arm 700ms → confirm */
let killT=null, killP=0;
function wireKill(){
  const k=$('#kill'); if(!k) return;
  const fill=k.querySelector('.fill');
  const reset=()=>{ clearInterval(killT); killT=null; killP=0; fill.style.transform='scaleX(0)'; k.classList.remove('armed'); };
  k.onmousedown = k.ontouchstart = e=>{ e.preventDefault(); if(STATE.kill) return;
    killT=setInterval(()=>{ killP+=0.05/0.7; fill.style.transform='scaleX('+Math.min(1,killP)+')';
      if(killP>=1){ reset(); confirmKill(); } },50); };
  k.onmouseup = k.onmouseleave = k.ontouchend = reset;
}
function confirmKill(){
  openModal('⛔ Confirm HALT', 
   '<p style="line-height:1.6;color:var(--tx1)">This flattens nothing by itself — it <b style="color:var(--tx0)">locks all order-capable controls</b>, sets consciousness <span class="mono">kill_switch: true</span>, and pages P0. The execution service refuses every order while active '+rtag('GOV-024','token gate + kill switch checked pre-order at code level')+'.</p>',
   '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doKill()">HALT THE DESK</button>');

let palSel=0, palItems=[];
function openPalette(){
  const p=$('#palette'); p.classList.add('on'); $('#scrim').classList.add('on');
  p.innerHTML='<input id="palq" placeholder="Jump to screen, symbol, packet, agent…"><div class="plist" id="pallist"></div>';
  const inp=$('#palq'); inp.focus(); palSel=0;
  const buildItems=q=>{
    q=(q||'').toLowerCase(); const out=[];
    NAV.filter(n=>n.r).forEach(n=>{ if(!q||(n.r+' '+n.n).toLowerCase().includes(q)) out.push({k:n.r,label:n.n,go:()=>go(n.r)}); });
    SYMS.forEach(s=>{ if(!q||s.sym.toLowerCase().includes(q)) out.push({k:s.sym,label:'Symbol — '+s.playbook,go:()=>go('Q4',s.sym)}); });
    PACKETS.forEach(pk=>{ if(!q||(pk.id+' '+pk.sym).toLowerCase().includes(q)) out.push({k:pk.id,label:'Packet — '+pk.sym+' '+pk.dir+' ('+pk.state+')',go:()=>go('C2',pk.id)}); });
    SEATS.forEach(s=>{ if(!q||s.nm.toLowerCase().includes(q)) out.push({k:'S'+String(s.id).padStart(2,'0'),label:'Agent — '+s.nm,go:()=>go('C5',s.id)}); });
    return out.slice(0,14);
  };
  const paint=()=>{ $('#pallist').innerHTML = palItems.map((it,i)=>'<div class="pitem'+(i===palSel?' sel':'')+'" onclick="palGo('+i+')"><span class="pk">'+esc(it.k)+'</span>'+esc(it.label)+'</div>').join('') || '<div class="pitem tx2">No matches</div>'; };
  palItems=buildItems(''); paint();
  inp.oninput=()=>{ palItems=buildItems(inp.value); palSel=0; paint(); };
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){ palSel=Math.min(palItems.length-1,palSel+1); paint(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ palSel=Math.max(0,palSel-1); paint(); e.preventDefault(); }
    else if(e.key==='Enter'){ palGo(palSel); }
    else if(e.key==='Escape'){ closePalette(); }
  };
}
function palGo(i){ const it=palItems[i]; if(!it) return; closePalette(); it.go(); }
function closePalette(){ $('#palette').classList.remove('on'); $('#scrim').classList.remove('on'); }

  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); }

});

  } else {
    ledger('HUMAN (owner)','decision',p.id+' → '+op+(reason?' ('+reason+')':''));
  }
  // §18/19 — optional 20-second capture
  openModal('§18 feedback · §19 learning capture <span class="pill">optional — 20 seconds</span>',
   '<div class="kvrow"><span class="k">Agree with read?</span><span class="v" style="font-family:var(--body)"><button class="btn sm ok">Yes</button> <button class="btn sm">Partly</button> <button class="btn sm danger">No</button></span></div>'+

function go(route, arg){
  STATE.route=route; STATE.routeArg=(arg===undefined?null:arg);
  if(route==='C2' && arg) STATE.selPacket=arg;
  if((route==='Q4'||route==='Q5'||route==='Q6') && arg) STATE.selSym=arg;
  if(route==='C5' && arg!==null && arg!==undefined) STATE.selSeat=+arg;
  closeDrawer(); closePalette();
  render();
  $('#main').scrollTop=0;
}
window.go = go;

function render(){
  renderTop(); renderSide();
  const fn = VIEWS[STATE.route] || VIEWS.C1;
  $('#view').innerHTML = fn(STATE.routeArg);
  // after-hooks: canvases must draw post-DOM
  if(STATE.route==='C2') window.__c2after();
  if(STATE.route==='Q4'){ const cv=$('#q4chart'); if(cv){ drawChart(cv, STATE.selSym, {conf:false}); cv.onclick=e=>chartClick(e,cv); } }

  if(STATE.route==='Q10') window.__q10after();
}

/* ---------- ENGINE TICK — 1s replay heartbeat ---------- */
const OP_ROT = [
 [5,'universe cycle running — '+' scoring 24 symbols'],
 [4,'Polygon aggregate batch normalized (142ms)'],
 [23,'UW tape scan: no new blocks > $500k'],
 [27,'TRD-0912 heartbeat — price above BE trigger path'],
 [2,'freshness sweep clean — worst feed 4.8s'],
 [9,'RS re-rank queued for 10:50 cadence'],
 [33,'exposure sums recomputed — semis 1.1%'],
 [18,'news poll: 0 catalysts crossing threshold']
];
let opIdx=0;
function tick(){
  CLOCK.tick(); STATE.tickN++;
  // price walk (seeded)
  SYMS.forEach(s=>{ const d=rr(-0.0007,0.00074); s.px*=(1+d); s.chg+=d*100;
    if(STATE.tickN%4===0){ s.spark.push(s.px); if(s.spark.length>41) s.spark.shift(); } });
  // rotate seat ops
  if(STATE.tickN%5===0){ const op=OP_ROT[opIdx++%OP_ROT.length]; LIVEOPS.ops[op[0]]=op[1]; }
  // rail: land remaining votes every ~8s
  if(STATE.tickN%8===0 && RAIL.items.length<PIPELINE_STEPS.length){
    const i=RAIL.items.length; const st=PIPELINE_STEPS[i];
    const msgs={9:'175/210C context logged — desk gates next',10:'contract re-check queued (AMD spread watch)',11:'personality: swing-structural ruleset',12:'risk verdict PASS — headroom intact',13:'director integrating — no unresolved conflicts',14:'packet delta assembled — no new packet (PKT-2231 active)'};
    RAIL.items.push({seat:st[0], step:st[1], verdict:'pass', txt:msgs[i]||'pass', t:CLOCK.hm()});
    ledger(seatTag(st[0]),'vote', RAIL.sym+' '+st[1]+' — pass');
    if(STATE.route==='C3') render();
  }
  // ledger ambience
  if(STATE.tickN%17===0){ const op=pick(OP_ROT); ledger(seatTag(op[0]),'telemetry',op[1]); if(STATE.route==='Q13') render(); }
  // packet TTL countdown + expiry
  PACKETS.forEach(p=>{ if(p.state==='AWAITING_HUMAN'||p.state==='BLOCKED'){ p.ttl--; 
    if(p.ttl<=0){ p.state='EXPIRED'; ledger('SYSTEM','packet',p.id+' EXPIRED — TTL exceeded (packet.ttl_min)'); pushAlert('P1',p.id+' expired unjudged','C1'); if(STATE.route==='C1'||STATE.route==='C2') render(); } } });
  // position drift
  if(STATE.tickN%6===0){ POSITIONS.forEach(p=>{ if(p.fsm==='MANAGING'){ p.uR+=rr(-0.02,0.028); p.dev=Math.max(2,Math.min(60,p.dev+rr(-1,1.1))); } });
    STATE.day_pnl += rr(-6,8); }
  // T1 chrome refresh (cheap)
  renderTop();
  // live-updating routes
  if(STATE.route==='Q2' && STATE.tickN%5===0) render();
  if(STATE.route==='Q8' && STATE.tickN%6===0) render();
}

let qIdx=0;
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea') return;
  if(e.key==='?'){ e.preventDefault(); shortcuts(); return; }
  if(e.key==='/'){ e.preventDefault(); openPalette(); return; }
  if(e.key.toLowerCase()==='r' && !e.metaKey && !e.ctrlKey){ go('C3'); return; }
  if(e.key.toLowerCase()==='q' && !e.metaKey && !e.ctrlKey){ go('C1'); return; }
  if(STATE.route==='C1'){
    const q=PACKETS.filter(p=>p.state==='AWAITING_HUMAN');
    if(e.key==='ArrowDown'){ qIdx=Math.min(q.length-1,qIdx+1); paintQSel(); e.preventDefault(); }
    if(e.key==='ArrowUp'){ qIdx=Math.max(0,qIdx-1); paintQSel(); e.preventDefault(); }
    if(e.key==='Enter' && q[qIdx]){ go('C2', q.sort((a,b)=>b.gradeN-a.gradeN)[qIdx].id); }
  }
  if(STATE.route==='C2' && /^[1-9]$/.test(e.key)){
    const p=pktBy(STATE.selPacket);
    if(p && (p.state==='AWAITING_HUMAN'||p.state==='BLOCKED')){ const op=HUMAN_OPTIONS[+e.key-1]; if(op) decide(p.id, op); }
  }
});

  pts.forEach(p=>{ ctx.fillStyle=p[3]; ctx.beginPath(); ctx.arc(X(p[1]),Y(p[2]),7,0,7); ctx.fill();

genCandles = function(sym, n){
  n=n||96; seedTo(0xC0FFEE ^ hash8(sym).split('').reduce((a,c)=>a+c.charCodeAt(0),0));
  const base = symBy(sym)? symBy(sym).px : 100; const out=[]; let p=base*(1-0.017);
  // structured phases: drift %/bar, vol mult, chop
  const phases=[[14,+0.0006,1.0,.5],[10,-0.0011,1.15,.35],[12,+0.0001,0.7,.9],[8,-0.0009,1.2,.4],[2,-0.0028,2.6,.1],[6,+0.0024,2.2,.15],[9,+0.0004,1.0,.6],[7,-0.0006,0.9,.5],[11,+0.0013,1.3,.3],[9,+0.0002,0.8,.8],[8,+0.0009,1.1,.4]];
  let idx=0;
  phases.forEach(ph=>{ for(let j=0;j<ph[0]&&idx<n;j++,idx++){
    const chopFlip = rr(0,1)<ph[3]? -1:1;
    const drift = ph[1]*chopFlip;
    const o=p, c=p*(1+drift+rr(-0.0013,0.0013)*ph[2]);
    const up=c>=o;
    const h=Math.max(o,c)*(1+rr(0.0001,0.0011)*ph[2]*(up?1.2:0.7));
    const l=Math.min(o,c)*(1-rr(0.0001,0.0011)*ph[2]*(up?0.7:1.2));
    out.push({o,h,l,c, v: rr(0.35,1.0)*ph[2]*(Math.abs(drift)>0.0015?1.8:1)}); p=c;
  }});
  while(out.length<n){ const o=p,c=p*(1+rr(-0.0009,0.001)); out.push({o,h:Math.max(o,c)*1.0006,l:Math.min(o,c)*0.9994,c,v:rr(0.4,0.9)}); p=c; }
  // engineered sweep at ~55%: spike below prior lows, close back inside, then displacement
  const k=Math.floor(n*0.55); const priorLow=Math.min.apply(null,out.slice(k-10,k).map(x=>x.l));
  out[k].l=priorLow*0.9975; out[k].o=priorLow*1.001; out[k].c=out[k].o*1.0035; out[k].h=out[k].c*1.0008; out[k].v=3.1;
  for(let j=1;j<=3;j++){ const kk=k+j; if(out[kk]){ out[kk].o=out[kk-1].c; out[kk].c=out[kk].o*1.0042; out[kk].h=out[kk].c*1.0011; out[kk].l=out[kk].o*0.9992; out[kk].v=2.0+rr(0,0.6); } }
  // re-anchor tail to live px
  const scale = base/out[n-1].c;
  for(let j=0;j<n;j++){ out[j].o*=scale; out[j].h*=scale; out[j].l*=scale; out[j].c*=scale; }
  return out;
};

/* ---------- drawChart v2 — full axes/volume/VWAP/last-tag ---------- */
const TFMIN={'1m':1,'5m':5,'15m':15,'1H':60,'4H':240,'D':390};
drawChart = function(cv, sym, opts){
  opts=opts||{}; const ctx=cv.getContext('2d');
  const W=cv.width=cv.clientWidth*2, H=cv.height=cv.clientHeight*2;
  const A=annotFor(sym), C=A.candles, s=symBy(sym);
  const AX=92, TB=30; const plotW=W-AX, volH=Math.floor((H-TB)*0.16), priceH=H-TB-volH;
  let mn=Infinity,mx=-Infinity; C.forEach(k=>{mn=Math.min(mn,k.l);mx=Math.max(mx,k.h);});
  if(A.plan && opts.plan!==false){ mn=Math.min(mn,A.plan.stop*0.9985); mx=Math.max(mx,A.plan.t1*1.003); }
  const pad=(mx-mn)*0.05; mn-=pad; mx+=pad;
  const X=i=>(i+0.5)/C.length*plotW, Y=p=>priceH-((p-mn)/(mx-mn))*priceH;
  ctx.fillStyle='#05070C'; ctx.fillRect(0,0,W,H);
  // killzone shading (price panel only)
  A.zones.filter(z=>z.type==='KZ').forEach(z=>{ ctx.fillStyle='rgba(92,168,255,.05)'; ctx.fillRect(plotW*z.a,0,plotW*(z.b-z.a),priceH);
    ctx.fillStyle='rgba(92,168,255,.4)'; ctx.font='12px Space Grotesk'; ctx.fillText(z.label.toUpperCase(), plotW*z.a+8, 16); });
  // h-grid + price axis labels
  ctx.font='15px IBM Plex Mono';
  for(let i=0;i<=6;i++){ const y=priceH*i/6; ctx.strokeStyle='rgba(148,163,184,.06)'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(plotW,y); ctx.stroke();
    ctx.fillStyle='rgba(155,166,184,.6)'; ctx.fillText(fmt(mn+(mx-mn)*(1-i/6)), plotW+10, Math.min(priceH-4,Math.max(14,y+5))); }
  // v-grid + time axis
  const tf=TFMIN[opts.tf||'5m']||5; const t0=9*60+30 - (C.length-1)*tf + (STATE.tickN/60|0)*0; // session-relative
  const step= tf<=1?15 : tf<=5?12 : tf<=15?8 : 6;
  for(let i=0;i<C.length;i+=step){ const x=X(i); ctx.strokeStyle='rgba(148,163,184,.05)'; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,priceH+volH); ctx.stroke();
    let m=t0+i*tf; while(m<0)m+=1440; const hh=Math.floor(m/60)%24, mm=m%60;
    ctx.fillStyle='rgba(155,166,184,.55)'; ctx.fillText(String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'), x-24, H-8); }
  // zones (FVG/OB) — right 45% like annotation projection
  cv._zones=[];
  A.zones.filter(z=>z.type==='FVG'||z.type==='OB').forEach(z=>{
    const y1=Y(z.top), y2=Y(z.bot);
    ctx.fillStyle = z.state==='live'? 'rgba(45,212,167,.10)':'rgba(148,163,184,.06)';
    ctx.fillRect(plotW*0.55,y1,plotW*0.45,y2-y1);

    ctx.fillStyle='rgba(231,236,244,.55)'; ctx.font='13px IBM Plex Mono'; ctx.fillText(z.type, plotW*0.56, y1+15);

  ctx.stroke(); ctx.fillStyle='rgba(232,180,76,.8)'; ctx.font='12px Space Grotesk'; ctx.fillText('VWAP', plotW-58, Y(cpv/cv2)-6);
  // candles

function drawCone(cv){
  const ctx=cv.getContext('2d'); const W=cv.width=cv.clientWidth*2,H=cv.height=cv.clientHeight*2;
  ctx.fillStyle='#05070C'; ctx.fillRect(0,0,W,H);
  seedTo(0xC03E ^ (window.__coneSeed||1));
  const N=170, paths=140; const term=[]; const grid=[];
  const exp=0.011, vol=0.030; // per-trade log params from scenario engine
  const Y=v=>H-24-(Math.log(v/700)/Math.log(160000/700))*(H-46);
  const X=i=>52+i/N*(W-70);
  // percentile bands via simulated paths
  const mat=[];
  for(let p=0;p<paths;p++){ let v=1000; const row=[v];
    for(let i=1;i<=N;i++){ const r=rr(-1,1)+rr(-1,1)+rr(-1,1); v*=Math.exp(exp+vol*r*0.577); v=Math.max(320,v); row.push(v); } mat.push(row); }
  const pct=(i,q)=>{ const col=mat.map(r=>r[i]).sort((a,b)=>a-b); return col[Math.floor(q*(paths-1))]; };
  const band=(qLo,qHi,fill)=>{ ctx.fillStyle=fill; ctx.beginPath();
    for(let i=0;i<=N;i++){ const y=Y(pct(i,qHi)); i?ctx.lineTo(X(i),y):ctx.moveTo(X(i),y); }
    for(let i=N;i>=0;i--) ctx.lineTo(X(i),Y(pct(i,qLo)));
    ctx.closePath(); ctx.fill(); };
  band(0.10,0.90,'rgba(92,168,255,.08)'); band(0.25,0.75,'rgba(92,168,255,.13)');
  // median
  ctx.strokeStyle='rgba(92,168,255,.9)'; ctx.lineWidth=2.4; ctx.beginPath();
  for(let i=0;i<=N;i++){ const y=Y(pct(i,0.5)); i?ctx.lineTo(X(i),y):ctx.moveTo(X(i),y); } ctx.stroke();
  // one lived path
  ctx.strokeStyle='rgba(45,212,167,.9)'; ctx.lineWidth=1.6; ctx.beginPath();
  mat[7].forEach((v,i)=>{ i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)); }); ctx.stroke();
  // guides
  [[1000,'$1k start'],[10000,'$10k'],[100000,'$100k target']].forEach(g=>{ const y=Y(g[0]);
    ctx.setLineDash([4,5]); ctx.strokeStyle='rgba(148,163,184,.25)'; ctx.beginPath(); ctx.moveTo(52,y); ctx.lineTo(W-16,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(155,166,184,.7)'; ctx.font='13px IBM Plex Mono'; ctx.fillText(g[1],4,y+4); });
  const hit=mat.filter(r=>Math.max.apply(null,r)>=100000).length;
  ctx.fillStyle='rgba(231,236,244,.85)'; ctx.font='600 14px Space Grotesk';
  ctx.fillText('P(hit $100k \u2264 '+N+' trades) \u2248 '+Math.round(hit/paths*100)+'%  ·  median '+Math.round(pct(N,0.5)/1000)+'k  ·  p10 '+Math.round(pct(N,0.10)/1000)+'k', 56, 22);
  ctx.fillStyle='rgba(155,166,184,.6)'; ctx.font='12px IBM Plex Mono'; ctx.fillText('trades \u2192', W-96, H-6);
}

function drawArcResult(cv, a){

  const win=rv>0; const N=40; const pts=[]; let v=0; const target=rv;
  for(let i=0;i<=N;i++){ const prog=i/N; v = target*prog + Math.sin(prog*7)*Math.abs(target)*0.18*(1-prog) + rr(-1,1)*0.12; pts.push(v); }
  pts[N]=target;

  [[0,'rgba(148,163,184,.3)','0'],[-1,'rgba(240,84,108,.4)','stop -1R'],[target,win?'rgba(45,212,167,.5)':'rgba(240,84,108,.5)',(target>0?'+':'')+target.toFixed(1)+'R']].forEach(g=>{ const y=Y(g[0]);
    ctx.setLineDash([3,4]); ctx.strokeStyle=g[1]; ctx.beginPath(); ctx.moveTo(36,y); ctx.lineTo(W-8,y); ctx.stroke(); ctx.setLineDash([]);

  ctx.strokeStyle=win?'#2DD4A7':'#F0546C'; ctx.lineWidth=2; ctx.beginPath(); pts.forEach((r,i)=>{ i?ctx.lineTo(X(i),Y(r)):ctx.moveTo(X(i),Y(r)); }); ctx.stroke();

function seedCumR(n, expc, vol, seed){ seedTo(seed); const pts=[]; let c=0; const step=Math.max(1,Math.floor(n/48));
  for(let i=0;i<n;i++){ c += (rr(0,1)<0.001?0:1)*(expc + rr(-1,1)*vol); if(i%step===0) pts.push(c); } pts.push(c); return pts; }
function ddOf(series){ let peak=-1e9, dd=0; series.forEach(v=>{ peak=Math.max(peak,v); dd=Math.min(dd, v-peak); }); return dd; }

  const avgWin=(p.rWin[0]+p.rWin[1])/2, netR=wins*avgWin + loss*(-0.94) + scr*0.02;
  const cum=seedCumR(seeds, netR/seeds, p.tR*0.35, 0x5EED ^ p.id.charCodeAt(0)*31);
  const avgWpct=(p.premWin[0]+p.premWin[1])/2, avgLpct=(p.premLoss[0]+p.premLoss[1])/2;
  const netPremPct=wins*avgWpct + loss*avgLpct + scr*3, expPremPct=netPremPct/seeds;

function closeTrade(p, tr){
  const R=AUTO.persona[p.id]; tr.status='CLOSED'; tr.curR=tr.outR;

  R.netR+=tr.outR; R.cum.push((R.cum[R.cum.length-1]||0)+tr.outR); if(R.cum.length>56) R.cum.shift();
  R.equity += tr.outR * R.equity * (p.riskPct/100);
  R.curPremR=0; R.netPremPct+=tr.premR; R.open=R.open.filter(x=>x!==tr); R.recent.unshift(tr); if(R.recent.length>30) R.recent.length=30;
  if(!R.open.length) R.state='hunt';
  pushStream(p,'CLOSE', tr.sym+' '+tr.dir+' \u2192 '+(tr.outR>=0?'+':'')+tr.outR.toFixed(2)+'R '+(tr.outR>0.25?'\u2713 win':tr.outR<-0.25?'\u2717 stop':'~ scratch')+' \u2014 journaled, fed to learning');

function autoStep(){
  if(!AUTO.running) return;
  const degraded = STATE.dataMode!=='NOMINAL' || STATE.llm==='degraded' || STATE.kill;
  PERSONAS.forEach(p=>{ const R=AUTO.persona[p.id];
    // manage open trades (always, even if paused — positions must be governed)
    R.open.forEach(tr=>{ tr.prog++;
      if(tr.prog===3) tr.status='MANAGING';
      const prg=Math.min(1, tr.prog/tr.hold), osc=(0.7+0.3*Math.sin(tr.prog*0.6));
      tr.curR = +(tr.outR*prg*osc).toFixed(2); tr.curPremR = Math.round(tr.premR*prg*osc);
      if(tr.prog>=tr.hold) closeTrade(p, tr); });
    if(R.state==='trade' && !R.open.length) R.state='hunt';
    if(STATE.kill){ R.state='halt'; return; }
    if(R.paused || degraded){ if(R.state!=='trade') R.state=degraded?'cool':'cool'; return; }
    // generate + take a new idea on cadence, if capacity
    if(R.open.length < p.maxOpen && STATE.tickN % p.cadTk === (p.id.length*3)%p.cadTk){ genIdea(p); }
    if(!R.open.length && R.state!=='hunt') R.state='hunt';
  });
}

/* ---- cumulative-R spark ---- */
function drawCumR(cv, series, color){
  const ctx=cv.getContext('2d'); const W=cv.width=cv.clientWidth*2,H=cv.height=cv.clientHeight*2;
  ctx.fillStyle='#05070C'; ctx.fillRect(0,0,W,H);
  if(!series.length) return;
  const mn=Math.min(0,Math.min.apply(null,series)), mx=Math.max.apply(null,series);
  const X=i=>4+i/(series.length-1)*(W-8), Y=v=>H-6-((v-mn)/((mx-mn)||1))*(H-12);
  const z=Y(0); ctx.strokeStyle='rgba(148,163,184,.18)'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(0,z); ctx.lineTo(W,z); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath(); series.forEach((v,i)=>{ i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)); });
  ctx.stroke();
  ctx.fillStyle=color+'22'; ctx.lineTo(X(series.length-1),H); ctx.lineTo(X(0),H); ctx.closePath(); ctx.fill();
}

function drawRDist(cv, p){
  const ctx=cv.getContext('2d'); const W=cv.width=cv.clientWidth*2,H=cv.height=cv.clientHeight*2;
  ctx.fillStyle='#05070C'; ctx.fillRect(0,0,W,H);
  seedTo(0xD157 ^ p.id.charCodeAt(0)); const bins=new Array(14).fill(0);
  for(let i=0;i<600;i++){ const win=rr(0,1)<p.winRate; const r=win?rr(p.rWin[0],p.rWin[1]):rr(-1,-0.6);
    const idx=Math.max(0,Math.min(13,Math.floor((r+2)/1))); bins[idx]++; }
  const mx=Math.max.apply(null,bins); const bw=W/bins.length;
  bins.forEach((b,i)=>{ const rC=i-2+0.5; ctx.fillStyle= rC<0?'rgba(240,84,108,.5)':'rgba(45,212,167,.5)';
    const bh=(b/mx)*(H-20); ctx.fillRect(i*bw+1,H-14-bh,bw-2,bh); });
  const zx=(2/bins.length)*W; ctx.strokeStyle='rgba(148,163,184,.3)'; ctx.beginPath(); ctx.moveTo(zx,0); ctx.lineTo(zx,H-14); ctx.stroke();
  ctx.fillStyle='rgba(155,166,184,.6)'; ctx.font='11px IBM Plex Mono'; ctx.fillText('\u22121R',zx-16,H-2); ctx.fillText('+'+Math.round(p.rWin[1])+'R',W-40,H-2);
}

  }
  function mcMeta(){
    const q=mcQuote(MC.active),specs=MC.tfs.map(tf=>mcSpec(MC.active,tf)),up=specs.filter(s=>mcBiasClass(s.bias)==='up').length,net=up>=7?'FULL LONG ALIGNMENT':up>=5?'LONG MAJORITY':up>=3?'MIXED / SELECTIVE':'SHORT / STAND ASIDE';
    return '<div class="mc-workspace-meta">'+[
      ['Last',fmt(q.px,2)+' · '+(q.chg>=0?'+':'')+fmt(q.pct,2)+'%',q.chg>=0?'good':'warn'],['Top-down bias',net,up>=5?'good':'warn'],['Relative volume',fmt(q.rvol,2)+'×',q.rvol>1.5?'good':''],['IV rank',q.ivr,''],['Virtual contexts',fmt(MC.virtualContexts,0)+' hot / '+fmt(MC.workspaceCount,0)+' monitored',''],['Pinned research tabs',MC.tabs.length+' open · '+MC.pinnedCount+' saved','']
    ].map(x=>'<div class="mc-meta"><label>'+x[0]+'</label><b class="'+x[2]+'">'+x[1]+'</b></div>').join('')+'</div>';
  }
  function mcContextPair(tf){

  }
  function mcTfRibbon(){
    return '<div class="mc-tf-ribbon"><div class="mc-ribbon-label"><b>TIMEFRAME COMMAND</b><span>click any frame to promote it to the main chart</span></div>'+MC.tfs.map((tf,i)=>{const s=mcSpec(MC.active,tf),bc=mcBiasClass(s.bias);return '<button class="mc-tf-pill '+bc+(MC.primaryTf===tf?' on':'')+'" onclick="mcPrimary(\''+tf+'\')"><small>'+mcRole(tf)+'</small><b>'+tf+'</b><span>'+mce(s.bias)+'</span><kbd>'+(i+1)+'</kbd></button>'}).join('')+'<div class="mc-density"><label>CANDLE DENSITY</label><button class="'+(MC.bars===28?'on':'')+'" onclick="mcBars(28)">28</button><button class="'+(MC.bars===38?'on':'')+'" onclick="mcBars(38)">38</button><button class="'+(MC.bars===58?'on':'')+'" onclick="mcBars(58)">58</button></div></div>';
  }
  function mcDesk(){
    const pair=mcContextPair(MC.primaryTf),used=[MC.primaryTf].concat(pair),rest=MC.tfs.filter(tf=>!used.includes(tf));
    return '<div class="mc-desk"><div class="mc-desk-hero"><div class="mc-primary-slot">'+mcChartCard(MC.primaryTf,'primary')+'</div><div class="mc-context-stack">'+pair.map(tf=>mcChartCard(tf,'context')).join('')+'</div></div><div class="mc-section-title"><div><b>Remaining timeframe context</b><span>Every frame stays visible and synchronized; double-click any canvas to make it primary.</span></div><span>'+rest.length+' live context charts</span></div><div class="mc-secondary-grid">'+rest.map(tf=>mcChartCard(tf,'secondary')).join('')+'</div></div>';
  }
  function mcWall(){return '<div class="mc-wall-grid">'+MC.tfs.map(tf=>mcChartCard(tf,'wall')).join('')+'</div>'}
  function mcFocusView(){return '<div class="mc-focus-shell">'+mcChartCard(MC.primaryTf,'focus')+'<div class="mc-focus-strip">'+MC.tfs.filter(tf=>tf!==MC.primaryTf).map(tf=>{const s=mcSpec(MC.active,tf),bc=mcBiasClass(s.bias);return '<button class="mc-focus-tf '+bc+'" onclick="mcPrimary(\''+tf+'\')"><b>'+tf+'</b><span>'+mce(s.bias)+'</span><small>RSI '+s.rsi+'</small></button>'}).join('')+'</div></div>'}
  function mcChartDeck(){return MC.layout==='wall'?mcWall():MC.layout==='focus'?mcFocusView():mcDesk()}
  function mcModeBanner(){return '<div class="mc-mode-banner clarity"><b>Clarity mode:</b> 38 visible candles by default. The execution frame is dominant; higher-timeframe permission and lower-timeframe timing remain visible without shrinking every chart into a thumbnail.<span class="right">Press 1–9 timeframe · W wall · F fullscreen · I intelligence</span></div>'}
  function mcView(arg){
    if(arg){MC.active=String(arg).toUpperCase();STATE.selSym=MC.active;if(!MC.tabs.includes(MC.active))MC.tabs.unshift(MC.active)}
    return '<div class="mc-shell">'+mcHeader()+'<div class="mc-tabs">'+MC.tabs.map(mcTab).join('')+'<button class="mc-btn" onclick="document.getElementById(\'mc-search\').focus()">＋ symbol</button></div>'+mcMeta()+mcTfRibbon()+mcModeBanner()+'<main class="mc-stage">'+mcChartDeck()+'</main>'+mcRail()+'<details class="mc-engineering"><summary>Data contracts, live symbol tape and backend diagnostics</summary><div class="mc-bottom"><section class="mc-panel"><div class="mc-panel-head"><b>Frontend ↔ backend data contracts</b><span>normalized adapters · timestamps · source IDs · fail-closed freshness</span></div><div class="mc-contracts">'+mcContracts()+'</div></section><section class="mc-panel"><div class="mc-panel-head"><b>Live symbol tape</b><span id="mc-last-sync">'+(MC.lastSync==='—'?'replay clock '+CLOCK.hm():MC.lastSync)+'</span></div><div class="mc-tape" id="mc-tape">'+mcTape()+'</div></section></div></details></div>';
  }
  VIEWS.Q5=mcView;
  const q5nav=NAV.find(x=>x.r==='Q5');if(q5nav)q5nav.n='Multi-Chart Intelligence';
  if(typeof ATLAS_ROUTE_META!=='undefined')ATLAS_ROUTE_META.Q5=['Multi-Chart Intelligence','Synchronized Year→1-minute chart matrix with options flow, news, earnings, filings and AI decision context.'];

  function mcDrawAll(){
    MC.tfs.forEach(tf=>{
      const cv=document.getElementById('mc-'+tf);if(!cv||!cv.getContext)return;
      drawVision(cv,MC.active,tf==='1Y'?'1M':tf,mcSpec(MC.active,tf));
      mcAttach(cv,tf);
      if(MC.cross)mcDrawCross(cv,MC.cross.x,MC.cross.y);
    });
  }
  function mcDrawCross(cv,xr,yr){
    const ctx=cv.getContext('2d'),x=xr*cv.width,y=yr*cv.height;
    ctx.save();ctx.strokeStyle='rgba(201,163,74,.7)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke();ctx.restore();
  }
  function mcOhlc(tf,x){
    const C=visCandles(MC.active,tf==='1Y'?'1M':tf,mcSpec(MC.active,tf));
    const i=Math.max(0,Math.min(C.length-1,Math.floor(x*C.length))),k=C[i];

  function mcAttach(cv,tf){
    if(cv.__mcBound)return;cv.__mcBound=true;
    cv.addEventListener('mousemove',e=>{
      if(!MC.sync.crosshair)return;

    });
    cv.addEventListener('mouseleave',()=>{MC.cross=null;MC.tfs.forEach(t=>{const c=document.getElementById('mc-'+t);if(c)drawVision(c,MC.active,t==='1Y'?'1M':t,mcSpec(MC.active,t));const tip=document.getElementById('mct-'+t);if(tip)tip.classList.remove('on')})});
    cv.addEventListener('dblclick',()=>mcPrimary(tf));
    cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;toast(MC.active+' '+tf+' doctrine probe at '+Math.round(x*100)+'% of visible range — double-click to promote','gate');ledger('HUMAN / Vision','chart_probe',MC.active+' '+tf+' synchronized chart probe')});

  window.mcPrimary=function(tf){MC.primaryTf=tf;MC.focusTf=tf;render()};

  window.mcBars=function(n){MC.bars=n;render();toast('Candle density set to '+n+' bars per chart','ok')};
  window.mcToggleRail=function(force){MC.railOpen=typeof force==='boolean'?force:!MC.railOpen;render()};
  window.mcFullscreen=async function(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toast('Browser fullscreen was blocked','warn')}};
  window.mcToggleSync=function(k){MC.sync[k]=!MC.sync[k];render()};
  window.mcRailTab=function(k){MC.rail=k;MC.railOpen=true;render()};
  window.mcSearchKey=function(e){if(e.key!=='Enter')return;const v=e.target.value.trim().toUpperCase().replace(/[^A-Z.\-]/g,'');if(!v)return;MC.active=v;if(!MC.tabs.includes(v))MC.tabs.unshift(v);MC.tabs=MC.tabs.slice(0,28);STATE.selSym=v;render();toast(v+' workspace loaded — backend adapter will hydrate live data when connected','ok')};

  async function mcHydrate(){
    if(!(mcBrain().connected))return;
    const base=(mcBrain().apiBase||'').replace(/\/$/,'');
    try{
      const r=await fetch(base+'/v1/symbols/'+encodeURIComponent(MC.active)+'/workspace');
      if(!r.ok)throw new Error('workspace '+r.status);
      const d=await r.json();MC.adapterMode='LIVE';MC.lastSync='synced '+CLOCK.hm()+' · seq '+(d.sequence||'—');
      toast(MC.active+' multi-chart workspace synchronized','ok');render();
    }catch(err){MC.adapterMode='REPLAY';MC.lastSync='adapter contract pending · '+CLOCK.hm();toast('Backend connected, but multi-chart workspace endpoint is not implemented yet','warn',4300)}
  }
  window.mcHydrate=mcHydrate;
  const oldConnect=window.atlasBrainConnect;
  if(typeof oldConnect==='function')window.atlasBrainConnect=async function(){await oldConnect();setTimeout(mcHydrate,350)};

  document.addEventListener('keydown',e=>{
    if(STATE.route!=='Q5'||/INPUT|TEXTAREA|SELECT/.test((e.target&&e.target.tagName)||''))return;
    const idx=parseInt(e.key,10)-1;if(idx>=0&&idx<MC.tfs.length){e.preventDefault();mcPrimary(MC.tfs[idx]);return}
    if(e.key.toLowerCase()==='w'){e.preventDefault();mcLayout(MC.layout==='wall'?'desk':'wall')}
    if(e.key.toLowerCase()==='i'){e.preventDefault();mcToggleRail()}
    if(e.key.toLowerCase()==='f'){e.preventDefault();mcFullscreen()}
    if(e.key==='Escape'&&MC.railOpen){mcToggleRail(false)}
  });

  if(location.hash.toUpperCase()==='#Q5'){setTimeout(()=>go('Q5',MC.active),60);}

  setInterval(()=>{
    if(STATE.route!=='Q5')return;
    const tape=document.getElementById('mc-tape');if(tape)tape.innerHTML=mcTape();
    MC.lastSync=(mcBrain().connected?'live seq ':'replay ')+(STATE.tickN||0)+' · '+CLOCK.hm();
    const st=document.getElementById('mc-last-sync');if(st)st.textContent=MC.lastSync;
  },2400);
})();

  function generate(sym,tf){const k=sym+'|'+tf;if(cache[k])return cache[k];const r=rnd(hash(k+'v5')),N=720,q=quote(sym),step=TFMS[tf]||864e5;let p=q.px*(.42+(hash(sym+'scale')%105)/100),t=Date.now()-N*step,out=[];const trend=(hash(sym+'trend')%2?1:-1)*(0.00035+(hash(tf+'trend')%75)/100000);const vol=tf==='1m'?.0048:tf==='5m'?.0042:tf==='15m'?.0038:tf==='1H'?.0032:tf==='4H'?.0045:tf==='1D'?.0065:tf==='1W'?.013:.022;for(let i=0;i<N;i++){const regime=i<150?trend*.55:i<300?trend*1.45:i<430?-trend*.55:trend*1.05;const cyc=Math.sin(i/29)*.0012+Math.sin(i/77)*.001;const shock=(i===505?-.035:0)+(i===509?.042:0)+(i===620?-.026:0)+(i===625?.031:0);const ret=regime+cyc+(r()-.5)*vol+shock;const o=p,c=Math.max(.1,p*(1+ret)),w=vol*(.18+r()*.85),h=Math.max(o,c)*(1+w*r()),l=Math.min(o,c)*(1-w*r()),v=(.45+r()*1.5)*(1+Math.abs(ret)/(vol||.001)*.24)*(i>600?1.2:1);out.push({o,h,l,c,v,t:t+i*step});p=c}if(['4H','1H','15m','5m','1m'].includes(tf)){const i=650,lo=Math.min(...out.slice(i-16,i).map(x=>x.l));out[i]={o:lo*1.004,h:lo*1.017,l:lo*.989,c:lo*1.012,v:3.4,t:out[i].t};for(let j=1;j<9;j++){const prev=out[i+j-1];out[i+j].o=prev.c;out[i+j].c=prev.c*(1+.0022+(r()-.5)*.0015);out[i+j].h=Math.max(out[i+j].o,out[i+j].c)*1.0017;out[i+j].l=Math.min(out[i+j].o,out[i+j].c)*.9984;out[i+j].v=1.3+r()*1.3}}const scale=q.px/out[out.length-1].c;out.forEach(x=>{x.o*=scale;x.h*=scale;x.l*=scale;x.c*=scale});cache[k]=out;return out}
  function ha(data){let po=data[0].o,pc=data[0].c;return data.map((x,i)=>{const c=(x.o+x.h+x.l+x.c)/4,o=i?(po+pc)/2:(x.o+x.c)/2,h=Math.max(x.h,o,c),l=Math.min(x.l,o,c);po=o;pc=c;return{o,h,l,c,v:x.v,t:x.t}})}
  function ema(data,n,key='c'){const a=[],k=2/(n+1);let v=data[0][key];for(const x of data){v=x[key]*k+v*(1-k);a.push(v)}return a}

  function atr(data,n=14){const tr=data.map((x,i)=>i?Math.max(x.h-x.l,Math.abs(x.h-data[i-1].c),Math.abs(x.l-data[i-1].c)):x.h-x.l),a=[];let s=0;for(let i=0;i<tr.length;i++){s=i<n?s+tr[i]:a[i-1]*(n-1)+tr[i];a.push(i<n?s/(i+1):s/n)}return a}
