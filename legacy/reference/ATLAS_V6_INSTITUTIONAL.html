  function drawingHit(p,m,px,py){const tol=8,X=t=>m.timeToX(t),Y=v=>m.y(v),distSeg=(x,y,x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;if(!l)return Math.hypot(x-x1,y-y1);let t=((x-x1)*dx+(y-y1)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(x-(x1+t*dx),y-(y1+t*dy))};for(let i=(p.drawings||[]).length-1;i>=0;i--){const d=p.drawings[i];if(d.hidden)continue;if(d.type==='hline'&&Math.abs(py-Y(d.p1))<tol)return d;if(d.type==='vline'&&Math.abs(px-X(d.t1))<tol)return d;if(['trend','ray'].includes(d.type)&&distSeg(px,py,X(d.t1),Y(d.p1),d.type==='ray'?m.plotW:X(d.t2),d.type==='ray'?Y(d.p1)+(Y(d.p2)-Y(d.p1))/(X(d.t2)-X(d.t1)||1)*(m.plotW-X(d.t1)):Y(d.p2))<tol)return d;if(['rect','fib','measure','long','short'].includes(d.type)){const x1=X(d.t1),x2=X(d.t2),y1=Y(d.p1),y2=Y(d.p2);if(px>=Math.min(x1,x2)-tol&&px<=Math.max(x1,x2)+tol&&py>=Math.min(y1,y2)-tol&&py<=Math.max(y1,y2)+tol)return d}if(d.type==='text'&&Math.hypot(px-X(d.t1),py-Y(d.p1))<22)return d}return null}
  function bindCanvas(cv,p){if(cv.__v5bound)return;cv.__v5bound=true;let drag=false,sx=0,startOff=0;cv.addEventListener('pointerdown',e=>{v5Activate(p.id);if(e.button===2)return;const m=cv.__v5;if(!m)return;const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,pt=pointFrom(m,px,py);if(V5.tool==='cursor'||V5.tool==='crosshair'){if(V5.tool==='cursor'){const hit=drawingHit(p,m,px,py);if(hit){p.selected=hit.id;requestDraw();return}else p.selected=null}drag=true;sx=e.clientX;startOff=p.view.offset||0;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);return}if(V5.lockAll)return;if(['hline','vline','text'].includes(V5.tool)){pushHistory();if(V5.tool==='hline')p.drawings.push({id:uid(),type:'hline',p1:pt.price,color:'#2962ff'});else if(V5.tool==='vline')p.drawings.push({id:uid(),type:'vline',t1:pt.time,color:'#2962ff'});else{const text=prompt('Chart note','ATLAS note');if(text)p.drawings.push({id:uid(),type:'text',t1:pt.time,p1:pt.price,text,color:'#2962ff'})}save();requestDraw();return}if(['trend','ray','rect','fib','measure','long','short'].includes(V5.tool)){if(!V5.pending){V5.pending={panel:p.id,type:V5.tool,t1:pt.time,p1:pt.price,t2:pt.time,p2:pt.price};V5.preview=V5.pending}else{pushHistory();p.drawings.push(Object.assign({id:uid(),color:V5.tool==='short'?'#f23645':V5.tool==='long'?'#089981':'#2962ff'},V5.pending,{t2:pt.time,p2:pt.price}));V5.pending=null;V5.preview=null;save();requestDraw()}return}});cv.addEventListener('pointermove',e=>{const m=cv.__v5;if(!m)return;const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;p.cross={x:Math.max(0,Math.min(1,px/m.plotW)),y:Math.max(0,Math.min(1,py/m.priceBottom))};if(V5.link.crosshair)V5.panels.forEach(z=>{if(z.id!==p.id)z.cross={x:p.cross.x,y:p.cross.y}});if(drag){const delta=Math.round((e.clientX-sx)/Math.max(3,m.plotW/m.C.length));p.view.offset=Math.max(0,Math.min(m.D.all.length-25,startOff+delta))}if(V5.pending&&V5.pending.panel===p.id){const pt=pointFrom(m,px,py);V5.pending.t2=pt.time;V5.pending.p2=pt.price;V5.preview=V5.pending}requestDraw()});cv.addEventListener('pointerup',()=>{drag=false;save()});cv.addEventListener('pointerleave',()=>{if(!drag){p.cross=null;if(V5.link.crosshair)V5.panels.forEach(z=>z.cross=null);requestDraw()}});cv.addEventListener('wheel',e=>{e.preventDefault();const dir=e.deltaY>0?1:-1;p.view.count=Math.max(25,Math.min(600,(p.view.count||160)+dir*Math.max(5,Math.round(p.view.count*.08))));if(V5.link.range)V5.panels.forEach(z=>z.view.count=p.view.count);save();requestDraw()},{passive:false});cv.addEventListener('dblclick',()=>{p.view={count:160,offset:0};save();requestDraw()});cv.addEventListener('contextmenu',e=>{e.preventDefault();v5Activate(p.id);V5.context={x:e.clientX,y:e.clientY};render()})}
  function pointFrom(m,px,py){let i=m.indexAt(px),z=m.C[i],price=m.priceAt(Math.max(m.priceTop,Math.min(m.priceBottom,py)));if(V5.magnet&&z){const candidates=[z.h,z.l,z.o,z.c],best=candidates.reduce((a,b)=>Math.abs(b-price)<Math.abs(a-price)?b:a,candidates[0]);price=best}return{time:z?z.t:Date.now(),price,index:i}}

  window.v5AddPanel=function(){ensurePanels();if(V5.panels.length>=9)return notify('Nine charts is the maximum visible layout','warn');const n=V5.panels.length+1,key=n===2?'2h':String(n);V5.layout=key;const tf=(LAYOUT_TFS[key]||TFS)[n-1]||'5m';V5.panels.push(panelDefault(n-1,tf));V5.activePanel=V5.panels[V5.panels.length-1].id;save();render();notify('Chart added to layout','ok')};

:root{
  --v6-bg:#070b12;--v6-bg2:#0b111b;--v6-surface:#0f1724;--v6-surface2:#131d2d;
  --v6-line:rgba(148,163,184,.16);--v6-line2:rgba(148,163,184,.26);
  --v6-text:#f3f7fc;--v6-muted:#a8b4c5;--v6-dim:#6f7d91;
  --v6-blue:#5b8cff;--v6-cyan:#55d9f7;--v6-green:#34d399;--v6-red:#fb7185;
  --v6-amber:#f6c760;--v6-purple:#a78bfa;--v6-radius:12px;--v6-shadow:0 18px 50px rgba(0,0,0,.22);--disp:"Segoe UI Variable Display","Segoe UI",Arial,sans-serif;--body:"Segoe UI Variable Text","Segoe UI",Arial,sans-serif;--mono:"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
body.v6-institutional{background:var(--v6-bg);color:var(--v6-text)}
body.v6-institutional #app{grid-template-rows:52px 28px 1fr;grid-template-columns:236px minmax(0,1fr)}
body.v6-institutional #topbar{height:52px;padding:0 14px;background:rgba(8,12,20,.94);border-color:var(--v6-line);backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.12)}
body.v6-institutional #tape{height:28px;background:#080d15;border-color:var(--v6-line);padding:0 14px;gap:20px}
body.v6-institutional #side{width:auto;background:linear-gradient(180deg,#0a1019,#080d15);border-color:var(--v6-line);padding:10px 9px 24px}
body.v6-institutional #main{background:
 radial-gradient(circle at 7% 0%,rgba(91,140,255,.055),transparent 26%),
 radial-gradient(circle at 92% 2%,rgba(85,217,247,.035),transparent 24%),var(--v6-bg)}
body.v6-institutional #view{max-width:none;padding:18px 22px 110px}
body.v6-institutional #contextbar{min-height:36px;padding:0 18px;background:rgba(8,13,21,.92);border-bottom:1px solid var(--v6-line);backdrop-filter:blur(14px)}
body.v6-institutional #contextbar .context-copy{display:none}
body.v6-institutional #contextbar .context-route{font:800 9px var(--mono);color:var(--v6-cyan);border-color:rgba(85,217,247,.3);background:rgba(85,217,247,.06)}
body.v6-institutional #contextbar .context-crumb{margin-left:8px;color:var(--v6-dim)}
body.v6-institutional .brandcopy strong{font-size:13px;letter-spacing:1.9px}
body.v6-institutional .brandcopy small{font-size:7.5px;color:var(--v6-dim);letter-spacing:1.05px}
body.v6-institutional .brandmark{background:linear-gradient(145deg,var(--v6-blue),var(--v6-cyan));box-shadow:0 0 18px rgba(91,140,255,.34)}
body.v6-institutional .syslabel b{color:var(--v6-text)}
body.v6-institutional .syslabel span{color:var(--v6-dim)}
body.v6-institutional .tb-stat{padding:5px 11px;border-left:1px solid var(--v6-line)}
body.v6-institutional .tb-stat .k{font-size:7.5px;color:var(--v6-dim);letter-spacing:1px}
body.v6-institutional .tb-stat .v{font-size:11px}
body.v6-institutional .iconbtn{border-color:var(--v6-line);background:rgba(255,255,255,.025);color:var(--v6-muted);border-radius:7px}
body.v6-institutional .iconbtn:hover{border-color:rgba(91,140,255,.5);background:rgba(91,140,255,.08);color:#fff}
body.v6-institutional #kill{border-radius:7px;padding:7px 12px}
body.v6-institutional .workspace-card{background:linear-gradient(135deg,rgba(91,140,255,.09),rgba(85,217,247,.025));border:1px solid rgba(91,140,255,.2);border-radius:10px;padding:9px}
body.v6-institutional .workspace-icon{background:linear-gradient(145deg,var(--v6-blue),#6f5df4);border-radius:7px;box-shadow:0 8px 22px rgba(91,140,255,.22)}
body.v6-institutional .workspace-copy strong{font-size:10.5px;color:#f7f9fc}
body.v6-institutional .workspace-copy span{font-size:8.5px;color:var(--v6-dim)}
body.v6-institutional .side-search{height:36px;border-radius:8px;border-color:var(--v6-line);background:rgba(255,255,255,.022);color:var(--v6-dim)}
body.v6-institutional .side-search:hover{background:rgba(91,140,255,.06);border-color:rgba(91,140,255,.35);color:var(--v6-muted)}
body.v6-institutional .navgh{padding:9px 9px;font-size:9px;color:var(--v6-dim);border-radius:7px}
body.v6-institutional .navgh:hover,body.v6-institutional .navgh.act{background:rgba(255,255,255,.025);color:var(--v6-muted)}
body.v6-institutional .nav{min-height:34px;padding:7px 9px;font-size:11.5px;border-radius:7px;border-left:0;position:relative}
body.v6-institutional .nav:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:transparent}
body.v6-institutional .nav.on{background:linear-gradient(90deg,rgba(91,140,255,.13),rgba(91,140,255,.025));color:#fff;box-shadow:inset 0 0 0 1px rgba(91,140,255,.16)}
body.v6-institutional .nav.on:before{background:var(--v6-blue);box-shadow:0 0 10px rgba(91,140,255,.65)}
body.v6-institutional .nav .nid{font-size:8px;color:#66748a;width:23px}
body.v6-institutional .nav.on .nid{color:var(--v6-cyan)}
body.v6-institutional .side-health{border-color:var(--v6-line);background:rgba(52,211,153,.035)}
body.v6-institutional #atlas-dock{display:none}

/* Global operational components */
body.v6-institutional .panel,body.v6-institutional .seat,body.v6-institutional .stat,body.v6-institutional .charcard,body.v6-institutional .apicard,body.v6-institutional .arccard,body.v6-institutional .plane{
 background:linear-gradient(180deg,rgba(16,24,38,.97),rgba(11,17,27,.98));border-color:var(--v6-line);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 10px 30px rgba(0,0,0,.07)}
body.v6-institutional .panel:hover,body.v6-institutional .seat:hover,body.v6-institutional .charcard:hover{border-color:rgba(91,140,255,.3)}
body.v6-institutional .panel>.ph{min-height:42px;padding:10px 13px;background:rgba(255,255,255,.012);border-color:var(--v6-line)}
body.v6-institutional .panel>.ph .t{font-size:10.5px;letter-spacing:1.1px;color:#d7e0ed}
body.v6-institutional .panel>.ph .sub{font-size:10px;color:var(--v6-dim)}
body.v6-institutional .panel>.pb{padding:13px}
body.v6-institutional .stat{padding:11px 12px;min-height:82px}
body.v6-institutional .stat .k{font-size:8.5px;color:var(--v6-dim)}
body.v6-institutional .stat .v{font-size:19px;letter-spacing:-.45px;margin-top:6px}
body.v6-institutional .stat .s{font-size:10px;color:var(--v6-dim)}
body.v6-institutional .grid{gap:12px}
body.v6-institutional table{font-size:12px}
body.v6-institutional th{height:34px;padding:8px 11px;background:#0f1724;color:#78879b;font-size:8.5px;border-color:var(--v6-line)}
body.v6-institutional td{padding:0 11px;color:#b9c5d5;border-color:rgba(148,163,184,.09)}
body.v6-institutional tr.dense td{height:32px}body.v6-institutional tr.std td{height:38px}body.v6-institutional tr.comf td{height:46px}
body.v6-institutional tbody tr:hover{background:rgba(91,140,255,.045)}
body.v6-institutional .btn{min-height:32px;padding:7px 12px;border-radius:7px;border-color:var(--v6-line2);background:rgba(255,255,255,.028);font-size:10.5px;color:#d8e1ee}
body.v6-institutional .btn:hover{background:rgba(91,140,255,.08);border-color:rgba(91,140,255,.42);color:#fff}
body.v6-institutional .btn.pri{background:rgba(91,140,255,.12);border-color:rgba(91,140,255,.45);color:#a9c3ff}
body.v6-institutional .btn.ok{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.38);color:#79e8bc}
body.v6-institutional .btn.warn{background:rgba(246,199,96,.08);border-color:rgba(246,199,96,.38);color:#f7d98e}
body.v6-institutional .btn.danger{background:rgba(251,113,133,.075);border-color:rgba(251,113,133,.38);color:#ff9cad}
body.v6-institutional .btn.gate{background:rgba(167,139,250,.09);border-color:rgba(167,139,250,.4);color:#c7b6ff}
body.v6-institutional .chip,body.v6-institutional .lc{border-radius:5px;padding:3px 7px}
body.v6-institutional .banner{border-radius:8px;padding:10px 12px;font-size:11.5px}
body.v6-institutional .decbar{padding:10px 12px;background:rgba(10,16,25,.94);backdrop-filter:blur(16px);border-color:var(--v6-line)}
body.v6-institutional .decbar .btn{min-height:42px}
body.v6-institutional .seat{padding:11px 12px}
body.v6-institutional .seat .snm{font-size:12px}
body.v6-institutional .seat .sop{font-size:11px;line-height:1.55}
body.v6-institutional .rail-item{border-radius:8px;padding:9px 11px;background:rgba(17,27,42,.9);border-color:var(--v6-line)}
body.v6-institutional .psec{border-radius:8px;border-color:var(--v6-line);background:rgba(15,23,36,.92)}
body.v6-institutional .psec>.psh{min-height:38px;padding:8px 11px}
body.v6-institutional .psec>.psh .pt{font-size:10px}
body.v6-institutional .psec>.psb{padding:10px 12px;font-size:12px;line-height:1.65}
body.v6-institutional .kvrow{font-size:11.5px;padding:4px 0}
body.v6-institutional .kvrow .k{color:var(--v6-dim)}
body.v6-institutional .modal,body.v6-institutional #modal{border-radius:12px;border-color:var(--v6-line2);box-shadow:0 30px 90px rgba(0,0,0,.48)}
body.v6-institutional input,body.v6-institutional select,body.v6-institutional textarea{border-radius:7px!important;border-color:var(--v6-line2)!important;background:#0d1521!important;color:#eef3fa!important}

/* Route reface shell */
.v6-route-shell{display:flex;flex-direction:column;gap:12px;min-width:0}
.v6-route-hero{position:relative;overflow:hidden;border:1px solid rgba(91,140,255,.18);border-radius:14px;background:
 radial-gradient(circle at 84% 0%,rgba(85,217,247,.09),transparent 30%),
 radial-gradient(circle at 4% 0%,rgba(91,140,255,.12),transparent 34%),
 linear-gradient(135deg,rgba(16,25,40,.99),rgba(9,14,23,.99));box-shadow:var(--v6-shadow)}
.v6-route-hero:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(91,140,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(91,140,255,.035) 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(90deg,#000,transparent 80%)}
.v6-route-main{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:18px 19px 14px}
.v6-route-eyebrow{display:flex;align-items:center;gap:8px;font:800 8.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--v6-cyan);margin-bottom:7px}
.v6-route-eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--v6-green);box-shadow:0 0 12px rgba(52,211,153,.8)}
.v6-route-title{font:700 clamp(20px,2vw,28px)/1.08 var(--disp);letter-spacing:-.45px;color:#f8fbff;margin:0}
.v6-route-desc{max-width:920px;margin-top:7px;font-size:11.5px;line-height:1.6;color:#9daabc}
.v6-route-actions{display:flex;align-items:flex-start;justify-content:flex-end;gap:7px;flex-wrap:wrap;max-width:520px}
.v6-action{height:34px;padding:0 11px;border:1px solid var(--v6-line2);border-radius:7px;background:rgba(255,255,255,.028);color:#b9c5d6;font:700 9px var(--disp);letter-spacing:.45px;cursor:pointer;white-space:nowrap}
.v6-action:hover{background:rgba(91,140,255,.09);border-color:rgba(91,140,255,.45);color:#fff}
.v6-action.primary{background:rgba(91,140,255,.15);border-color:rgba(91,140,255,.52);color:#c7d7ff}
.v6-action.danger{background:rgba(251,113,133,.075);border-color:rgba(251,113,133,.4);color:#ffa7b6}
.v6-guardrail{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid rgba(148,163,184,.12);background:rgba(3,7,13,.22)}
.v6-guard{padding:10px 13px;border-right:1px solid rgba(148,163,184,.11);min-width:0}
.v6-guard:last-child{border-right:0}
.v6-guard label{display:block;font:700 7.5px var(--disp);letter-spacing:1px;text-transform:uppercase;color:var(--v6-dim)}
.v6-guard b{display:block;font:700 12px var(--mono);color:#e8eef7;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v6-guard span{display:block;font-size:8.5px;color:var(--v6-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v6-guard.good b{color:var(--v6-green)}.v6-guard.warn b{color:var(--v6-amber)}.v6-guard.bad b{color:var(--v6-red)}
.v6-group-tabs{display:flex;align-items:center;gap:4px;padding:7px;border:1px solid var(--v6-line);border-radius:10px;background:rgba(11,17,27,.78);overflow-x:auto;scrollbar-width:none}
.v6-group-tabs::-webkit-scrollbar{display:none}
.v6-group-tab{height:31px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--v6-dim);font:700 8.5px var(--disp);letter-spacing:.4px;white-space:nowrap;cursor:pointer}
.v6-group-tab:hover{color:#dce5f1;background:rgba(255,255,255,.025)}
.v6-group-tab.on{color:#fff;background:rgba(91,140,255,.1);border-color:rgba(91,140,255,.32)}
.v6-route-body{min-width:0}
.v6-route-body>h2:first-child,.v6-route-body>h2:first-child+.tx2{display:none}
.v6-route-body>.grid:first-child,.v6-route-body>.panel:first-child{margin-top:0}
.v6-replay-note{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid rgba(246,199,96,.2);background:rgba(246,199,96,.035);border-radius:8px;color:#a8976f;font-size:9.5px}
.v6-replay-note b{font:700 8px var(--mono);letter-spacing:.7px;color:var(--v6-amber)}

/* New Institutional Edge workspaces */
.v6-edge-shell{display:flex;flex-direction:column;gap:12px}
.v6-edge-hero{position:relative;overflow:hidden;border:1px solid rgba(91,140,255,.2);border-radius:15px;padding:20px;background:
 radial-gradient(circle at 83% 5%,rgba(85,217,247,.11),transparent 28%),
 radial-gradient(circle at 15% 0%,rgba(167,139,250,.13),transparent 34%),
 linear-gradient(135deg,#111b2b,#0a101a 62%,#090e16);box-shadow:var(--v6-shadow)}
.v6-edge-hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(91,140,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(91,140,255,.04) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;mask-image:linear-gradient(90deg,#000,transparent 75%)}
.v6-edge-hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.55fr);gap:18px}
.v6-edge-kicker{display:flex;align-items:center;gap:8px;font:800 8.5px var(--mono);letter-spacing:1.7px;color:var(--v6-cyan);text-transform:uppercase}
.v6-edge-kicker i{width:8px;height:8px;border-radius:50%;background:var(--v6-green);box-shadow:0 0 13px rgba(52,211,153,.8)}
.v6-edge-hero h1{font:700 clamp(24px,2.4vw,36px)/1.06 var(--disp);letter-spacing:-.7px;margin:9px 0 7px;color:#fff}
.v6-edge-hero h1 span{background:linear-gradient(90deg,#fff,var(--v6-cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.v6-edge-hero p{max-width:930px;font-size:12px;line-height:1.7;color:#a7b4c6}
.v6-edge-hero .laws{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.v6-edge-hero .laws span{font:700 8px var(--mono);padding:4px 7px;border:1px solid rgba(91,140,255,.2);background:rgba(91,140,255,.045);color:#9db9ff;border-radius:5px}
.v6-briefbox{display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(246,199,96,.24);border-radius:11px;padding:14px;background:rgba(246,199,96,.035)}
.v6-briefbox label{font:800 8px var(--disp);letter-spacing:1.2px;text-transform:uppercase;color:#9e8d67}
.v6-briefbox strong{font:700 19px var(--disp);color:#fff;margin:10px 0 5px}
.v6-briefbox p{font-size:10.5px;line-height:1.55;color:#9d8f72}
.v6-brief-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.v6-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
.v6-kpi{position:relative;overflow:hidden;min-height:88px;padding:12px;border:1px solid var(--v6-line);border-radius:10px;background:linear-gradient(180deg,rgba(18,28,44,.96),rgba(11,17,27,.98))}
.v6-kpi:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent,var(--v6-blue));opacity:.8}
.v6-kpi label{font:700 8px var(--disp);letter-spacing:1px;text-transform:uppercase;color:var(--v6-dim)}
.v6-kpi b{display:block;font:700 21px var(--mono);letter-spacing:-.5px;color:#fff;margin-top:7px}
.v6-kpi span{display:block;font-size:9.5px;color:var(--v6-dim);margin-top:3px}
.v6-layout-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,.65fr);gap:12px}
.v6-layout-half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.v6-layout-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.v6-card{border:1px solid var(--v6-line);border-radius:11px;background:linear-gradient(180deg,rgba(16,24,38,.97),rgba(10,16,26,.98));overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.022)}
.v6-card-head{display:flex;align-items:center;gap:8px;min-height:43px;padding:9px 12px;border-bottom:1px solid var(--v6-line);background:rgba(255,255,255,.012)}
.v6-card-head h3{font:700 10px var(--disp);letter-spacing:1px;text-transform:uppercase;color:#d8e1ed}
.v6-card-head p{font-size:9.5px;color:var(--v6-dim)}
.v6-card-head .right{margin-left:auto;display:flex;gap:5px;align-items:center}
.v6-card-body{padding:12px}
.v6-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--v6-line2);border-radius:5px;font:700 8px var(--mono);color:var(--v6-muted);background:rgba(255,255,255,.025)}
.v6-pill.good{color:#71e6b8;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.05)}
.v6-pill.warn{color:#f7d88a;border-color:rgba(246,199,96,.35);background:rgba(246,199,96,.05)}
.v6-pill.bad{color:#ff9caf;border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.05)}
.v6-opprow{display:grid;grid-template-columns:54px 58px minmax(180px,1fr) 62px 70px 88px;gap:9px;align-items:center;min-height:48px;padding:8px 9px;border-bottom:1px solid rgba(148,163,184,.09);cursor:pointer}
.v6-opprow:hover{background:rgba(91,140,255,.045)}.v6-opprow:last-child{border-bottom:0}
.v6-opprow .sym{font:700 12px var(--disp);color:#fff}.v6-opprow .px{font:600 10px var(--mono)}
.v6-opprow .thesis{min-width:0}.v6-opprow .thesis b{display:block;font-size:10.5px;color:#d8e1ed}.v6-opprow .thesis span{display:block;font-size:9px;color:var(--v6-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.v6-opprow .score{font:700 13px var(--mono);text-align:right}.v6-opprow .rr{font:700 11px var(--mono);text-align:right;color:var(--v6-green)}
.v6-court{display:grid;grid-template-columns:112px 1fr 72px;gap:10px;align-items:center;min-height:54px;padding:9px 10px;border-bottom:1px solid rgba(148,163,184,.09)}
.v6-court:last-child{border-bottom:0}.v6-court .name{font:700 9px var(--disp);text-transform:uppercase;letter-spacing:.75px;color:#c8d2df}.v6-court .op{font-size:10.5px;line-height:1.5;color:#9eabba}.v6-court .vote{text-align:right;font:800 8px var(--mono)}
.v6-court .vote.pass{color:var(--v6-green)}.v6-court .vote.wait{color:var(--v6-amber)}.v6-court .vote.block{color:var(--v6-red)}
.v6-doctrine{display:grid;gap:7px}.v6-doctrine>div{display:grid;grid-template-columns:25px 1fr;gap:9px;padding:8px;border:1px solid rgba(148,163,184,.1);border-radius:7px;background:rgba(255,255,255,.015)}
.v6-doctrine i{display:flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:6px;background:rgba(91,140,255,.1);color:var(--v6-cyan);font:800 9px var(--mono)}
.v6-doctrine b{display:block;font-size:10.5px;color:#dce4ef}.v6-doctrine span{display:block;font-size:9px;color:var(--v6-dim);margin-top:2px;line-height:1.45}
.v6-matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.v6-matrix-cell{min-height:110px;border:1px solid var(--v6-line);border-radius:9px;padding:11px;background:rgba(255,255,255,.014)}

    return '<div class="v6-edge-shell">'+edgeHero('Operations <span>& Reliability Center</span>','A serious trading platform is an operating system, not a collection of screens. This center exposes feed health, queue pressure, service latency, failure containment, audit readiness and the exact reasons live execution remains enabled or blocked.','PAPER READY · LIVE BLOCKED','Core replay workflows are functional. Production live trading remains blocked until licensed feeds, durable state, authenticated services, broker sandbox parity and graduated capital validation are complete.')+
      kpis([['System availability','99.98%','replay service model','var(--v6-green)'],['Worst dependency','1.8s','news secondary source','var(--v6-amber)'],['Queue pressure','12%','oldest job 0.7s','var(--v6-cyan)'],['Event sequence gaps','0','ordered envelopes','var(--v6-green)'],['Critical incidents','0','current session','var(--v6-green)'],['Live launch gates','6 / 10','four blockers remain','var(--v6-red)']])+

      '<div class="v6-layout-half">'+card('Latency & Capacity','p95 against service objectives','<div class="v6-latency"><div class="v6-latency-row"><label><span>Market-data normalization</span><span>142 / 250ms</span></label><div class="v6-track"><i style="width:57%"></i></div></div><div class="v6-latency-row"><label><span>Feature-engine universe cycle</span><span>86 / 180ms</span></label><div class="v6-track"><i style="width:48%"></i></div></div><div class="v6-latency-row"><label><span>Committee fan-in</span><span>1.4 / 3.0s</span></label><div class="v6-track"><i style="width:47%"></i></div></div><div class="v6-latency-row"><label><span>Human packet assembly</span><span>420 / 900ms</span></label><div class="v6-track"><i style="width:47%"></i></div></div><div class="v6-latency-row"><label><span>Order preflight</span><span>188 / 350ms</span></label><div class="v6-track"><i style="width:54%"></i></div></div></div>')+card('Failure Drills','prove the system fails closed','<div class="v6-doctrine"><div><i>D1</i><div><b>Stale quote during approval</b><span>Invalidate token, block order, refresh packet and require new decision.</span></div></div><div><i>D2</i><div><b>Options spread widens after approval</b><span>Reject preview; do not silently change contract or price tolerance.</span></div></div><div><i>D3</i><div><b>Risk service unavailable</b><span>All order-capable commands fail closed and page P0.</span></div></div><div><i>D4</i><div><b>WebSocket sequence gap</b><span>Pause delta rendering, request snapshot and resume from verified sequence.</span></div></div></div><div class="brief-actions" style="margin-top:8px"><button class="v6-action" onclick="atlasV6RunDrill(\'stale-data\')">Run stale-data drill</button><button class="v6-action" onclick="atlasV6RunDrill(\'risk-outage\')">Run risk-outage drill</button></div>')+'</div>'+
      card('Eight-Pass Product & Scenario Review','simulated design and operational QA—not three months of real-money trading','<div class="v6-passlist">'+passes+'</div>')+

  function guardrails(){

      ['Operating mode',modeTruth(),STATE.mode==='LIVE'?'real capital requires token':'replay / paper boundary',STATE.mode==='LIVE'?'warn':'good'],
      ['Data integrity',STATE.dataMode==='NOMINAL'?'NOMINAL':'DEGRADED','freshness gates remain server-owned',STATE.dataMode==='NOMINAL'?'good':'bad'],

  function groupTabs(){

  function reface(){
    document.body.classList.add('v6-institutional');

  window.atlasV6ReviewFilter=function(k){V6.reviewFilter=k;render()};

})();
