function files(){return title('RAG vault, original PDFs/images, reports, trade packets, chart screenshots, manifests, and evidence trails.')+`<div class="grid g3">${file('Master KB Bundle','/atlas/kb/latest','58MB · deduped · Windows safe')}${file('Original PDFs + Images','/atlas/original_sources','Wyckoff, SMC, ICT, screenshots')}${file('Trade Evidence Vault','/atlas/trade_packets','human verification packets')}${file('Agent Role Manuals','/atlas/agents/v12','34 deep role operating manuals')}${file('Frontend Specs','/atlas/software/frontend','system prompts + HTML previews')}${file('Manifests / Hashes','/atlas/manifests','SHA-256 audit records')}</div>`}
function api(){return title('Data provider, broker, AI model, database, and worker health. Failures are visible; stale data blocks trading.')+`<div class="grid g2">${card('Provider Health',`<table><thead><tr><th>Provider</th><th>Status</th><th>Freshness</th><th>Use</th></tr></thead><tbody><tr><td>Market Data</td><td><span class="badge b-up">connected</span></td><td>0.7s</td><td>bars/quotes</td></tr><tr><td>Options Flow</td><td><span class="badge b-warn">degraded</span></td><td>12m</td><td>flow confirmation</td></tr><tr><td>Broker</td><td><span class="badge b-ai">paper</span></td><td>live</td><td>orders disabled live</td></tr><tr><td>RAG DB</td><td><span class="badge b-up">indexed</span></td><td>18k chunks</td><td>knowledge retrieval</td></tr></tbody></table>`)}${card('Data Integrity Rules',checks([['pass','Freshness displayed','Every module shows last update.'],['fail','Stale flow blocks trades','PLTR flow not usable.'],['pass','Audit hash stored','Evidence has source + timestamp.']]))}</div>`}
function automation(){return title('Schedulers for market scans, company updates, agent cycles, reports, learning reviews, and risk checks.')+`<div class="grid g2">${card('Automation Schedule',`<table><thead><tr><th>Job</th><th>Cadence</th><th>Owner</th><th>Status</th></tr></thead><tbody><tr><td>Pre-market report</td><td>Daily 7:30</td><td>Head Director</td><td><span class="badge b-up">ready</span></td></tr><tr><td>Full universe scan</td><td>Every 5 min</td><td>Scanner</td><td><span class="badge b-up">running</span></td></tr><tr><td>Earnings intelligence</td><td>Hourly + event</td><td>News Agent</td><td><span class="badge b-up">running</span></td></tr><tr><td>Learning review</td><td>After trade + EOD</td><td>Learning Agent</td><td><span class="badge b-ai">waiting</span></td></tr></tbody></table>`)}${card('Manager Dispatch Rules',checks([['pass','Agents push, not wait','System works without constant user prompting.'],['pass','Only escalate material items','Noise is filtered before owner inbox.'],['pass','Risk events are immediate','Vetoes bypass normal batching.']]))}</div>`}
function admin(){return title('Enterprise role permissions, live-mode protection, security, audit, and team scaling controls.')+`<div class="grid g3">${card('Roles',`<table><tbody><tr><td>Owner</td><td><span class="badge b-ai">all permissions</span></td></tr><tr><td>Risk Manager</td><td>veto + policy</td></tr><tr><td>Trader</td><td>paper plans only</td></tr><tr><td>Viewer</td><td>read-only</td></tr></tbody></table>`)}${card('Security State',checks([['pass','2FA enabled','Required before live unlock.'],['pass','API keys encrypted','No plaintext display.'],['pass','Read-only default','Broker execution separate permission.']]))}${card('Billing / Scale',`<p class="muted">Enterprise-ready plan area for users, teams, roles, API seats, data-provider costs, and audit retention.</p><span class="badge b-gray">Investor-grade admin shell</span>`)}</div>`}
function audit(){return title('Immutable audit trail for AI recommendations, human approvals, risk vetoes, orders, rule changes, and data freshness.')+`<div class="grid g2">${card('Audit Log',`<table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Hash</th></tr></thead><tbody><tr><td>09:48:12</td><td>Risk Officer</td><td>Vetoed TSLA below 5R</td><td class="mono">a9f3...</td></tr><tr><td>09:45:37</td><td>Head Director</td><td>Promoted NVDA to watch tier</td><td class="mono">71de...</td></tr><tr><td>09:41:55</td><td>Data Integrity</td><td>Marked options feed degraded</td><td class="mono">ca22...</td></tr></tbody></table>`)}${card('Audit Principles',checks([['pass','Every decision logged','Including rejections and blocks.'],['pass','Every evidence packet hashed','Source, timestamp, and agent version.'],['pass','Rule changes require signature','Human owner must approve.']]))}</div>`}
function qa(){return title('Go-live QA for product, design, data, broker safety, risk controls, and production readiness.')+`<div class="grid g4">${card('UI QA',metric('94%','responsive + accessible','up'))}${card('Risk QA',metric('98%','5R/veto gates pass','up'))}${card('API QA',metric('71%','mock only in preview','warn'))}${card('Live Trading QA',metric('0%','not connected','down'))}</div><div style="margin-top:13px">${card('Go-Live Blocking Items',checks([['fail','Real broker sandbox not connected','Must test order lifecycle.'],['fail','Live data agreements not configured','Need provider contracts and API keys.'],['wait','Backtesting engine scaffold','Need full replay validation.'],['pass','Frontend operating model','Ready for engineering build.']]))}</div>`}
function promptView(){return title('System prompt for future AI/build team: describes the enterprise frontend standard and non-negotiable behavior.')+card('ATLAS Enterprise Frontend Prompt',`<div class="json">You are designing ATLAS AI TRADER as an enterprise AI/Human trading operating system. Build the interface so the human owner can see what every agent is doing, what evidence it consumed, what it concluded, what it blocked, what it escalated, what trade it is watching, what exit it is managing, what lesson it learned, and what needs human approval. Enforce 5R by default. Never hide stale data, risk violations, missing proof, bad option contracts, or AI uncertainty. The platform must feel like a billion-dollar institutional operating console, but it must never claim guaranteed profits.</div>`)}
function heatmap(){const arr=['XLK','SMH','XLF','XLE','IWM','DIA','HYG','TLT','VIX','BTC'];return `<div class="grid g4">${arr.map((x,i)=>{let p=[1.8,2.4,.4,-.7,.1,.2,.3,-.9,-3.2,1.1][i];return `<div class="card-body" style="background:${p>=0?'rgba(33,212,139,.08)':'rgba(255,84,112,.08)'};border:1px solid var(--line);border-radius:12px"><b>${x}</b><div class="${p>=0?'up':'down'} num">${p>=0?'+':''}${p.toFixed(1)}%</div><small class="muted2">${p>1?'leadership':p<0?'lagging':'neutral'}</small></div>`}).join('')}</div>`}
function chartBlock(label){return `<div class="chart-card"><canvas class="chart"></canvas><div class="chart-overlay"><div><span class="badge b-ai">${label}</span> <span class="badge b-up">5R Target Visible</span></div><div><span class="badge b-warn">Static Preview</span></div></div><div class="chart-tools">${['Y','M','W','D','4H','1H','15M','5M','1M'].map((x,i)=>`<button class="tf ${x==='15M'?'active':''}">${x}</button>`).join('')}</div></div>`}
function file(name,path,meta){return `<div class="file"><div class="ico">▣</div><div><b>${name}</b><small>${path}</small><small>${meta}</small></div></div>`}
function renderRail(){
  document.getElementById('rail').innerHTML = `<h3>Head Director Live Rail</h3>
    <div class="rail-block"><div class="ai-message"><b>Current firm directive:</b> Monitor NVDA/AMD only. Do not chase. TSLA and COIN are blocked until risk/contract quality improves.</div></div>
    <div class="rail-block"><h3>Agent Status</h3>${S.agents.slice(0,5).map(a=>`<div class="inbox-item"><h4>${a[0]} <span class="badge b-gray">${a[4]}%</span></h4><p>${a[1]}</p></div>`).join('')}</div>
    <div class="rail-block"><h3>Human Actions</h3><button class="btn btn-ai" style="width:100%;margin-bottom:8px" onclick="go('verification')">Review Verification Queue</button><button class="btn" style="width:100%;margin-bottom:8px" onclick="go('tradewatch')">Open Trade Watch</button><button class="btn btn-down" style="width:100%" onclick="toggleKill()">Toggle Kill Switch</button></div>
    <div class="rail-block"><h3>Learning Queue</h3><p class="muted">2 strategy improvements require your approval. 1 rule proposal rejected by governance due to small sample size.</p></div>`;
}
function tickerObj(t){return S.watch.find(x=>x.t===t)||S.watch[0]}
function tradeDetail(t){let x=tickerObj(t);return `<div class="grid g2">${card('Setup Evidence',checks([['pass','Market regime checked','Risk-on but extended.'],['pass','Liquidity mapped','BSL/SSL and weak high/low identified.'],['pass','Invalidation defined',x.stop],['pass','Target path defined',`${x.t1} / ${x.t2} / ${x.t3}`],[x.r>=5?'pass':'fail','5R validation',`${x.r}R realistic path`],['wait','Human review','Required before live trade.']]))}${card('Manager Summary',`<p><b>${x.t}:</b> ${x.setup}</p><p class="muted">${x.missing}</p><div class="splitter"></div><p><b>Agent votes:</b> ${x.votes}</p><p><b>Personality:</b> ${x.p}</p>`)}</div>`}
function directorPacket(){return `<p class="muted">This packet summarizes all watch candidates, active trades, risk status, and blocked ideas.</p>${tradeTable()}<div class="splitter"></div>${checks([['pass','All candidates have invalidation','No undefined stop allowed.'],['pass','Blocked trades remain visible','AI learns from rejection.'],['wait','Live mode remains locked','Owner approval required.']])}`}
function openModal(t,b){document.getElementById('modalTitle').innerHTML=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('show');setTimeout(drawCharts,10)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function notify(t,msg,type='ai'){const d=document.createElement('div');d.className='toast';d.style.borderLeftColor=`var(--${type==='down'?'down':type==='warn'?'warn':type==='up'?'up':'ai'})`;d.innerHTML=`<b>${t}</b><small>${msg}</small>`;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),5200)}
function cycleMode(){S.mode=S.mode==='sim'?'paper':S.mode==='paper'?'live':'sim';document.documentElement.dataset.mode=S.mode;document.getElementById('mode').textContent=S.mode.toUpperCase()+' MODE';renderShell();notify('Mode changed',`System display mode is now ${S.mode}. Live still requires permissions and risk checks.`,S.mode==='live'?'warn':'ai')}
function toggleKill(){S.kill=!S.kill;document.getElementById('kill').textContent=S.kill?'KILL SWITCH ACTIVE':'KILL SWITCH ARMED';document.getElementById('kill').style.background=S.kill?'rgba(255,84,112,.35)':'rgba(255,84,112,.13)';renderShell();notify(S.kill?'Kill switch active':'Kill switch armed',S.kill?'All automation and execution blocked.':'System ready; live remains permission locked.',S.kill?'down':'warn')}
function tick(){
  S.tickers=S.tickers.map(x=>{let ch=(Math.random()-.49)*0.08;return [x[0],Math.max(1,x[1]*(1+ch/100)),x[2]+ch,x[3]]});renderShell();
  document.querySelectorAll('.chart').forEach(drawOne);
}
function drawCharts(){document.querySelectorAll('.chart').forEach(drawOne)}
function drawOne(c){
  if(!c.getContext)return;const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(160,180,220,.08)';ctx.lineWidth=1;for(let i=0;i<8;i++){let y=36+i*(h-74)/7;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let i=0;i<12;i++){let x=i*w/11;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  let n=82,px=[],base=h*.58;for(let i=0;i<n;i++){let y=base+Math.sin(i*.17)*36+Math.sin(i*.55)*13-i*.42+Math.random()*2;px.push([22+i*(w-50)/(n-1),y])}
  ctx.beginPath();ctx.strokeStyle='#42a5ff';ctx.lineWidth=2;px.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
  ctx.fillStyle='rgba(33,212,139,.12)';ctx.fillRect(w*.18,h*.47,w*.22,34);ctx.strokeStyle='rgba(33,212,139,.55)';ctx.strokeRect(w*.18,h*.47,w*.22,34);
  ctx.fillStyle='rgba(140,125,255,.12)';ctx.fillRect(w*.54,h*.30,w*.20,44);ctx.strokeStyle='rgba(140,125,255,.55)';ctx.strokeRect(w*.54,h*.30,w*.20,44);
  ctx.strokeStyle='rgba(255,84,112,.7)';ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(0,h*.74);ctx.lineTo(w,h*.74);ctx.stroke();
  ctx.strokeStyle='rgba(33,212,139,.75)';ctx.beginPath();ctx.moveTo(0,h*.22);ctx.lineTo(w,h*.22);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='11px ui-monospace,monospace';ctx.fillText('ORDER BLOCK',w*.18+8,h*.47+20);ctx.fillText('FVG / IMBALANCE',w*.54+8,h*.30+24);ctx.fillStyle='#ff5470';ctx.fillText('INVALIDATION',10,h*.74-7);ctx.fillStyle='#21d48b';ctx.fillText('5R TARGET',10,h*.22-7);
}
window.addEventListener('resize',drawCharts);
init();
</script>
